<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&amp;family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&amp;family=Inter:wght@500;600&amp;display=swap');
      .txt-fern { font-family: 'Fredoka', 'Montserrat', sans-serif; font-weight: 700; fill: #EF4444; letter-spacing: 2px; }
      .txt-sub { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 18px; fill: #6B4A3A; }
      .txt-details { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 16px; fill: #4A3B32; letter-spacing: 0.5px; }
      .bead-text { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 16px; fill: #5A3E2D; }
    </style>
  </defs>

  <!-- Clean Warm Linen Background -->
  <rect width="600" height="800" rx="16" fill="#FAF8F2" />

  <!-- TOP HALF: Beaded Charm Bracelet Draping -->
  <g transform="translate(0, 30)">
    <!-- Golden Link Chain Curve -->
    <path d="M 60 180 Q 300 290 540 180" fill="none" stroke="#D4AF37" stroke-width="6" stroke-dasharray="10 4" />
    <path d="M 60 180 Q 300 290 540 180" fill="none" stroke="#FDE047" stroke-width="2" />

    <!-- Top Hanging Ribbon / Bow -->
    <g transform="translate(285, 270)">
      <path d="M 0 0 C -25 -15 -25 -35 0 -20 C 25 -35 25 -15 0 0 Z" fill="#FCA5A5"/>
      <path d="M 0 0 L -15 25 M 0 0 L 15 25" stroke="#F87171" stroke-width="3" stroke-linecap="round"/>
      <circle cx="0" cy="-5" r="4" fill="#EF4444"/>
    </g>

    <!-- Round Letter Beads on Chain: "L" "E" "T" "'" "S"   "P" "A" "R" "T" "Y" -->
    <!-- L -->
    <g transform="translate(130, 215)">
      <circle cx="0" cy="0" r="16" fill="#FDE68A" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="0" y="5" text-anchor="middle" class="bead-text">L</text>
    </g>
    <!-- E -->
    <g transform="translate(165, 230)">
      <circle cx="0" cy="0" r="16" fill="#FED7AA" stroke="#FB923C" stroke-width="1.5"/>
      <text x="0" y="5" text-anchor="middle" class="bead-text">E</text>
    </g>
    <!-- T -->
    <g transform="translate(200, 242)">
      <circle cx="0" cy="0" r="16" fill="#FBCFE8" stroke="#F472B6" stroke-width="1.5"/>
      <text x="0" y="5" text-anchor="middle" class="bead-text">T</text>
    </g>
    <!-- ' -->
    <g transform="translate(235, 252)">
      <circle cx="0" cy="0" r="12" fill="#E9D5FF" stroke="#C084FC" stroke-width="1.5"/>
      <text x="0" y="5" text-anchor="middle" class="bead-text">&apos;</text>
    </g>
    <!-- S -->
    <g transform="translate(268, 258)">
      <circle cx="0" cy="0" r="16" fill="#BAE6FD" stroke="#38BDF8" stroke-width="1.5"/>
      <text x="0" y="5" text-anchor="middle" class="bead-text">S</text>
    </g>

    <!-- P -->
    <g transform="translate(325, 258)">
      <circle cx="0" cy="0" r="16" fill="#BBF7D0" stroke="#4ADE80" stroke-width="1.5"/>
      <text x="0" y="5" text-anchor="middle" class="bead-text">P</text>
    </g>
    <!-- A -->
    <g transform="translate(360, 250)">
      <circle cx="0" cy="0" r="16" fill="#FED7AA" stroke="#FB923C" stroke-width="1.5"/>
      <text x="0" y="5" text-anchor="middle" class="bead-text">A</text>
    </g>
    <!-- R -->
    <g transform="translate(395, 240)">
      <circle cx="0" cy="0" r="16" fill="#FBCFE8" stroke="#F472B6" stroke-width="1.5"/>
      <text x="0" y="5" text-anchor="middle" class="bead-text">R</text>
    </g>
    <!-- T -->
    <g transform="translate(430, 226)">
      <circle cx="0" cy="0" r="16" fill="#FDE68A" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="0" y="5" text-anchor="middle" class="bead-text">T</text>
    </g>
    <!-- Y -->
    <g transform="translate(465, 210)">
      <circle cx="0" cy="0" r="16" fill="#A7F3D0" stroke="#34D399" stroke-width="1.5"/>
      <text x="0" y="5" text-anchor="middle" class="bead-text">Y</text>
    </g>

    <!-- CHARMS DANGLING FROM CHAIN -->
    <!-- 1. Smiley Face Charm (Left) -->
    <g transform="translate(85, 170)">
      <circle cx="0" cy="0" r="18" fill="#FDE047" stroke="#EAB308" stroke-width="2"/>
      <circle cx="-6" cy="-4" r="2.5" fill="#422006"/>
      <circle cx="6" cy="-4" r="2.5" fill="#422006"/>
      <path d="M -8 3 Q 0 13 8 3" stroke="#422006" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- 2. Red Mushroom Charm -->
    <g transform="translate(115, 260)">
      <!-- Cap -->
      <path d="M -16 0 C -16 -18 16 -18 16 0 Z" fill="#EF4444"/>
      <!-- Dots on mushroom -->
      <circle cx="-7" cy="-7" r="2.5" fill="#FFF"/>
      <circle cx="6" cy="-8" r="2.5" fill="#FFF"/>
      <circle cx="0" cy="-3" r="2" fill="#FFF"/>
      <!-- Stem -->
      <path d="M -6 0 L -4 10 L 4 10 L 6 0 Z" fill="#FFFDF8"/>
    </g>

    <!-- 3. Peace Sign Charm -->
    <g transform="translate(180, 290)">
      <circle cx="0" cy="0" r="14" fill="#C4B5FD" stroke="#7C3AED" stroke-width="1.5"/>
      <line x1="0" y1="-14" x2="0" y2="14" stroke="#7C3AED" stroke-width="2"/>
      <line x1="0" y1="0" x2="-10" y2="10" stroke="#7C3AED" stroke-width="2"/>
      <line x1="0" y1="0" x2="10" y2="10" stroke="#7C3AED" stroke-width="2"/>
    </g>

    <!-- 4. Baby Blue Dice Charm -->
    <g transform="translate(155, 370)">
      <rect x="-14" y="-14" width="28" height="28" rx="5" fill="#7DD3FC" stroke="#0284C7" stroke-width="1.5" transform="rotate(12)"/>
      <circle cx="0" cy="0" r="2" fill="#FFF"/>
      <circle cx="-6" cy="-6" r="2" fill="#FFF"/>
      <circle cx="6" cy="6" r="2" fill="#FFF"/>
    </g>

    <!-- 5. BFF Gold Heart Charm (Center) -->
    <g transform="translate(295, 340)">
      <path d="M 0 6 C -18 -15 -25 8 0 25 C 25 8 18 -15 0 6 Z" fill="#FACC15" stroke="#CA8A04" stroke-width="2"/>
      <text x="0" y="10" text-anchor="middle" font-family="'Fredoka', sans-serif" font-size="10" font-weight="700" fill="#854D0E">BFF</text>
    </g>

    <!-- 6. Four Leaf Clover Charm -->
    <g transform="translate(365, 315)">
      <circle cx="-5" cy="-5" r="6" fill="#4ADE80"/>
      <circle cx="5" cy="-5" r="6" fill="#4ADE80"/>
      <circle cx="-5" cy="5" r="6" fill="#4ADE80"/>
      <circle cx="5" cy="5" r="6" fill="#4ADE80"/>
      <circle cx="0" cy="0" r="4" fill="#22C55E"/>
    </g>

    <!-- 7. Sweet Strawberry Charm -->
    <g transform="translate(440, 290)">
      <!-- Leaves -->
      <polygon points="-8,-12 0,-16 8,-12 0,-9" fill="#22C55E"/>
      <!-- Body -->
      <path d="M -10 -9 C -14 6 0 16 0 16 C 0 16 14 6 10 -9 Z" fill="#EF4444"/>
      <!-- Seeds -->
      <circle cx="-4" cy="-2" r="1" fill="#FEF08A"/>
      <circle cx="4" cy="-2" r="1" fill="#FEF08A"/>
      <circle cx="0" cy="4" r="1" fill="#FEF08A"/>
    </g>

    <!-- 8. Yin-Yang Charm -->
    <g transform="translate(500, 240)">
      <circle cx="0" cy="0" r="14" fill="#FFF" stroke="#CBD5E1" stroke-width="1.5"/>
      <path d="M 0 -14 A 14 14 0 0 1 0 14 A 7 7 0 0 1 0 0 A 7 7 0 0 0 0 -14 Z" fill="#67E8F9"/>
      <circle cx="0" cy="-7" r="2.5" fill="#FFF"/>
      <circle cx="0" cy="7" r="2.5" fill="#67E8F9"/>
    </g>

    <!-- 9. Daisy Flower Charm -->
    <g transform="translate(240, 480)">
      <circle cx="0" cy="0" r="8" fill="#FDE047"/>
      <circle cx="-12" cy="0" r="6" fill="#FFF" stroke="#E2E8F0" stroke-width="1"/>
      <circle cx="12" cy="0" r="6" fill="#FFF" stroke="#E2E8F0" stroke-width="1"/>
      <circle cx="0" cy="-12" r="6" fill="#FFF" stroke="#E2E8F0" stroke-width="1"/>
      <circle cx="0" cy="12" r="6" fill="#FFF" stroke="#E2E8F0" stroke-width="1"/>
    </g>

    <!-- Scattered cute charms around text -->
    <g transform="translate(110, 560)">
      <!-- Sweet strawberry -->
      <polygon points="-6,-9 0,-13 6,-9 0,-7" fill="#22C55E"/>
      <path d="M -8 -7 C -11 4 0 12 0 12 C 0 12 11 4 8 -7 Z" fill="#EF4444"/>
    </g>
    <g transform="translate(135, 625)">
      <!-- Smiley -->
      <circle cx="0" cy="0" r="12" fill="#FDE047" stroke="#EAB308" stroke-width="1.5"/>
      <circle cx="-4" cy="-2" r="1.5" fill="#422006"/>
      <circle cx="4" cy="-2" r="1.5" fill="#422006"/>
      <path d="M -5 2 Q 0 8 5 2" stroke="#422006" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </g>
    <g transform="translate(485, 380)">
      <!-- Gold star -->
      <polygon points="0,-12 3,-4 11,-4 5,2 7,10 0,6 -7,10 -5,2 -11,-4 -3,-4" fill="#FDE047"/>
    </g>
  </g>

  <!-- CENTRAL TYPOGRAPHY -->
  <text x="300" y="470" text-anchor="middle" class="txt-fern" font-size="28">FERN IS TURNING 8</text>

  <text x="300" y="525" text-anchor="middle" class="txt-sub">Join us for a celebration</text>

  <text x="300" y="575" text-anchor="middle" class="txt-details">Friday, August 12th</text>
  <text x="300" y="605" text-anchor="middle" class="txt-details">at 3 in the afternoon</text>

  <text x="300" y="660" text-anchor="middle" class="txt-sub">Our place</text>
</svg>
