<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&amp;family=Inter:wght@500;600;700&amp;display=swap');
      .txt-yellow { font-family: 'Montserrat', sans-serif; font-weight: 900; fill: #FFEE00; }
      .txt-cyan { font-family: 'Montserrat', sans-serif; font-weight: 800; fill: #00F0FF; }
      .txt-sub { font-family: 'Inter', sans-serif; font-weight: 700; fill: #38BDF8; letter-spacing: 2px; }
      .txt-lime { font-family: 'Montserrat', sans-serif; font-weight: 800; fill: #4ADE80; letter-spacing: 1.5px; }
      .doodle { stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .doodle-fill { stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <!-- Glow filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" rx="16" fill="#0A0B10" />

  <!-- Doodles / Keith Haring style figures around border -->
  <g filter="url(#neon-glow)">
    <!-- Top Left Yellow Dancing Figure -->
    <g transform="translate(60, 60)" stroke="#FFEE00" class="doodle">
      <circle cx="20" cy="15" r="12" fill="none" stroke-width="6"/>
      <path d="M 20 27 L 20 65 L 42 85 M 20 65 L -2 88" />
      <path d="M -5 38 L 20 45 L 45 35" />
      <!-- Motion lines -->
      <path d="M 45 15 L 55 12 M 48 25 L 58 28 M -12 18 L -3 22" stroke="#00F0FF" stroke-width="4"/>
    </g>

    <!-- Top Right Yellow Dancing Figure -->
    <g transform="translate(480, 50)" stroke="#FFEE00" class="doodle">
      <circle cx="25" cy="15" r="12" fill="none" stroke-width="6"/>
      <path d="M 25 27 L 25 65 L 50 85 M 25 65 L 0 85" />
      <path d="M 0 35 L 25 45 L 50 35" />
      <path d="M -10 15 L -2 20 M 55 18 L 65 22" stroke="#4ADE80" stroke-width="4"/>
    </g>

    <!-- Top Center Squiggles & Radiance -->
    <path d="M 250 40 Q 270 25 290 40 T 330 40" stroke="#00F0FF" class="doodle" stroke-width="5"/>
    <path d="M 220 70 L 235 60 M 350 60 L 365 70" stroke="#4ADE80" class="doodle" stroke-width="4"/>
    <circle cx="290" cy="65" r="4" fill="#FFEE00"/>

    <!-- Left Border Figures & Squiggles -->
    <g transform="translate(40, 240)" stroke="#FFEE00" class="doodle">
      <circle cx="20" cy="15" r="12" fill="none" stroke-width="6"/>
      <path d="M 20 27 L 20 70 L -5 95 M 20 70 L 40 95" />
      <path d="M -10 40 L 20 50 L 45 30" />
      <path d="M 50 15 L 60 15 M -8 15 L 2 15" stroke="#4ADE80" stroke-width="4"/>
    </g>
    <path d="M 35 380 Q 55 365 45 345 T 30 320" stroke="#00F0FF" class="doodle" stroke-width="5"/>
    <path d="M 30 420 Q 50 435 35 455 T 45 480" stroke="#4ADE80" class="doodle" stroke-width="5"/>

    <g transform="translate(40, 520)" stroke="#FFEE00" class="doodle">
      <circle cx="20" cy="15" r="12" fill="none" stroke-width="6"/>
      <path d="M 20 27 L 20 65 L 45 85 M 20 65 L 0 90" />
      <path d="M -5 30 L 20 40 L 45 50" />
      <path d="M 45 10 L 55 5 M -12 25 L -2 20" stroke="#00F0FF" stroke-width="4"/>
    </g>

    <!-- Right Border Figures & Squiggles -->
    <g transform="translate(500, 250)" stroke="#FFEE00" class="doodle">
      <circle cx="20" cy="15" r="12" fill="none" stroke-width="6"/>
      <path d="M 20 27 L 20 65 L -5 85 M 20 65 L 45 90" />
      <path d="M -5 50 L 20 40 L 45 30" />
      <path d="M 45 15 L 55 15 M -10 15 L 0 15" stroke="#00F0FF" stroke-width="4"/>
    </g>
    <path d="M 545 370 Q 525 390 545 410 T 530 440" stroke="#FFEE00" class="doodle" stroke-width="5"/>
    <path d="M 540 470 Q 560 490 535 510" stroke="#00F0FF" class="doodle" stroke-width="5"/>

    <!-- Bottom Left Figure -->
    <g transform="translate(60, 650)" stroke="#FFEE00" class="doodle">
      <circle cx="20" cy="15" r="12" fill="none" stroke-width="6"/>
      <path d="M 20 27 L 20 60 L 45 80 M 20 60 L -5 80" />
      <path d="M -5 35 L 20 45 L 45 35" />
      <path d="M 40 10 L 50 5 M -10 20 L -2 15" stroke="#4ADE80" stroke-width="4"/>
    </g>

    <!-- Bottom Center Figure -->
    <g transform="translate(270, 680)" stroke="#FFEE00" class="doodle">
      <circle cx="25" cy="15" r="12" fill="none" stroke-width="6"/>
      <path d="M 25 27 L 25 60 L 50 80 M 25 60 L 0 80" />
      <path d="M 0 35 L 25 45 L 50 35" />
      <path d="M -8 15 L -1 15 M 50 15 L 58 15" stroke="#00F0FF" stroke-width="4"/>
    </g>

    <!-- Bottom Right Figure -->
    <g transform="translate(480, 650)" stroke="#FFEE00" class="doodle">
      <circle cx="20" cy="15" r="12" fill="none" stroke-width="6"/>
      <path d="M 20 27 L 20 60 L -5 80 M 20 60 L 45 80" />
      <path d="M -5 35 L 20 45 L 45 35" />
      <path d="M 42 12 L 52 18 M -12 12 L -2 18" stroke="#00F0FF" stroke-width="4"/>
    </g>

    <!-- Accent Dots & Sparks -->
    <circle cx="160" cy="70" r="4" fill="#00F0FF" />
    <circle cx="430" cy="75" r="4" fill="#FFEE00" />
    <circle cx="80" cy="460" r="4" fill="#FFEE00" />
    <circle cx="520" cy="180" r="4" fill="#4ADE80" />
    <circle cx="510" cy="600" r="4" fill="#FFEE00" />
    <circle cx="200" cy="730" r="4" fill="#4ADE80" />
    <circle cx="390" cy="725" r="4" fill="#00F0FF" />
  </g>

  </svg>
