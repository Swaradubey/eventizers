<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400;1,600&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap');
      .font-script { font-family: 'Playfair Display', Georgia, serif; font-style: italic; text-anchor: middle; }
      .font-serif { font-family: 'Playfair Display', Georgia, serif; text-anchor: middle; }
      .font-sans { font-family: 'Inter', -apple-system, sans-serif; text-anchor: middle; }
    </style>
    <linearGradient id="minimalist-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCFCFA"/>
      <stop offset="100%" stop-color="#F7F6F2"/>
    </linearGradient>
  </defs>

  <!-- Fine Cotton Card Base -->
  <rect width="800" height="600" rx="16" fill="url(#minimalist-bg)"/>
  <rect x="20" y="20" width="760" height="560" rx="10" fill="none" stroke="#EAE7DF" stroke-width="1.2"/>

  <!-- Minimalist Structural Hairlines -->
  <g stroke="#DDD9CE" stroke-width="1.2">
    <line x1="380" y1="120" x2="380" y2="480" stroke-linecap="round"/>
    <line x1="450" y1="300" x2="710" y2="300" stroke-width="0.9"/>
    <line x1="450" y1="365" x2="710" y2="365" stroke-width="0.9"/>
  </g>

  <!-- Left Column: Couple Names -->
  <g>
    <text x="210" y="250" class="font-script" font-size="62" font-weight="600" fill="#1C1C1C">Bella</text>
    <text x="210" y="315" class="font-serif" font-size="28" font-style="italic" fill="#555555">&amp;</text>
    <text x="210" y="385" class="font-script" font-size="62" font-weight="600" fill="#1C1C1C">Carter</text>
  </g>

  <!-- Right Column: Event & Invitation Details -->
  <g>
    <!-- Invitation Text -->
    <text x="580" y="205" class="font-sans" font-size="13" font-weight="400" fill="#4B4B4B" letter-spacing="0.8">Together with our families,</text>
    <text x="580" y="235" class="font-sans" font-size="13" font-weight="400" fill="#4B4B4B" letter-spacing="0.8">we joyfully invite you to</text>
    <text x="580" y="265" class="font-sans" font-size="13" font-weight="400" fill="#4B4B4B" letter-spacing="0.8">celebrate our wedding on</text>

    <!-- Prominent Tracked Date with borders -->
    <text x="580" y="342" class="font-sans" font-size="24" font-weight="600" fill="#111111" letter-spacing="6">07 / 18 / 2026</text>

    <!-- Time -->
    <text x="580" y="405" class="font-sans" font-size="13" font-weight="400" fill="#555555" letter-spacing="0.5">at 5 o'clock in the evening</text>

    <!-- Venue & Location -->
    <text x="580" y="445" class="font-sans" font-size="14" font-weight="600" fill="#222222" letter-spacing="1">Wildwood Forest</text>
    <text x="580" y="472" class="font-sans" font-size="13" font-weight="400" fill="#666666" letter-spacing="0.5">Portland, Oregon</text>
  </g>
</svg>
