<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&amp;family=Inter:wght@400;500;600;700&amp;family=Playfair+Display:wght@600;700&amp;display=swap');
      .font-script { font-family: 'Dancing Script', cursive; text-anchor: middle; }
      .font-sans { font-family: 'Inter', -apple-system, sans-serif; text-anchor: middle; }
      .font-serif { font-family: 'Playfair Display', Georgia, serif; text-anchor: middle; }
    </style>
    <linearGradient id="og-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="50%" stop-color="#FAF5F0"/>
      <stop offset="100%" stop-color="#F5ECE4"/>
    </linearGradient>
    <linearGradient id="og-orchid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F25C98"/>
      <stop offset="50%" stop-color="#C22067"/>
      <stop offset="100%" stop-color="#800D41"/>
    </linearGradient>
    <linearGradient id="og-geranium" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF7B59"/>
      <stop offset="50%" stop-color="#EA4326"/>
      <stop offset="100%" stop-color="#B8220A"/>
    </linearGradient>
    <linearGradient id="og-leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#469966"/>
      <stop offset="50%" stop-color="#246940"/>
      <stop offset="100%" stop-color="#124024"/>
    </linearGradient>
    <filter id="og-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="600" height="800" rx="16" fill="url(#og-bg)" />

  <!-- Inset Border Frame -->
  <rect x="22" y="22" width="556" height="756" rx="10" fill="none" stroke="#EADBD5" stroke-width="1.2" />
  <rect x="28" y="28" width="544" height="744" rx="8" fill="none" stroke="#DCA295" stroke-width="0.7" stroke-dasharray="6,4" opacity="0.6" />

  <!-- Top Border Garland -->
  <g id="top-garland" filter="url(#og-shadow)">
    <g transform="translate(60, 45)">
      <path d="M 0 0 C -30 20 -40 50 -20 80 C 10 90 40 50 20 20 Z" fill="url(#og-leaf)" />
      <g transform="translate(15, 30)">
        <path d="M 0 -22 C -18 -32 -28 -12 -12 2 C 0 8 12 2 28 -12 C 18 -32 0 -22 0 -22 Z" fill="url(#og-orchid)" />
        <ellipse cx="-18" cy="8" rx="15" ry="9" transform="rotate(-30 -18 8)" fill="#FA78B0" />
        <ellipse cx="18" cy="8" rx="15" ry="9" transform="rotate(30 18 8)" fill="#FA78B0" />
        <path d="M 0 5 C -12 10 -15 25 0 28 C 15 25 12 10 0 5 Z" fill="#800D41" />
        <circle cx="0" cy="8" r="4" fill="#FFDE59" />
      </g>
    </g>

    <g transform="translate(300, 40)">
      <ellipse cx="-45" cy="5" rx="20" ry="9" transform="rotate(-15 -45 5)" fill="url(#og-leaf)" />
      <ellipse cx="45" cy="5" rx="20" ry="9" transform="rotate(15 45 5)" fill="url(#og-leaf)" />
      <circle cx="-12" cy="18" r="14" fill="url(#og-geranium)" />
      <circle cx="12" cy="18" r="14" fill="url(#og-geranium)" />
      <circle cx="0" cy="8" r="14" fill="#FF7B59" />
      <circle cx="0" cy="26" r="14" fill="url(#og-geranium)" />
      <circle cx="0" cy="18" r="2.5" fill="#FFDE59" />
    </g>

    <g transform="translate(540, 45)">
      <path d="M 0 0 C 30 20 40 50 20 80 C -10 90 -40 50 -20 20 Z" fill="url(#og-leaf)" />
      <g transform="translate(-15, 30)">
        <path d="M 0 -22 C 18 -32 28 -12 12 2 C 0 8 -12 2 -28 -12 C -18 -32 0 -22 0 -22 Z" fill="url(#og-orchid)" />
        <ellipse cx="18" cy="8" rx="15" ry="9" transform="rotate(30 18 8)" fill="#FA78B0" />
        <ellipse cx="-18" cy="8" rx="15" ry="9" transform="rotate(-30 -18 8)" fill="#FA78B0" />
        <path d="M 0 5 C 12 10 15 25 0 28 C -15 25 -12 10 0 5 Z" fill="#800D41" />
        <circle cx="0" cy="8" r="4" fill="#FFDE59" />
      </g>
    </g>

    <g transform="translate(180, 32)">
      <circle cx="0" cy="0" r="12" fill="url(#og-geranium)" />
      <circle cx="0" cy="0" r="3" fill="#FFDE59" />
    </g>
    <g transform="translate(420, 32)">
      <circle cx="0" cy="0" r="12" fill="url(#og-geranium)" />
      <circle cx="0" cy="0" r="3" fill="#FFDE59" />
    </g>
  </g>

  <!-- Left Side Floral Blooms -->
  <g id="left-garland" filter="url(#og-shadow)">
    <g transform="translate(35, 270)">
      <ellipse cx="5" cy="-12" rx="16" ry="8" transform="rotate(-60 5 -12)" fill="url(#og-leaf)" />
      <circle cx="16" cy="0" r="16" fill="url(#og-orchid)" />
      <circle cx="16" cy="0" r="8" fill="#FF94C2" opacity="0.9" />
      <circle cx="16" cy="0" r="3" fill="#FFDE59" />
    </g>
    <g transform="translate(35, 510)">
      <ellipse cx="5" cy="12" rx="16" ry="8" transform="rotate(60 5 12)" fill="url(#og-leaf)" />
      <circle cx="16" cy="0" r="16" fill="url(#og-geranium)" />
      <circle cx="16" cy="0" r="7" fill="#FFA58F" opacity="0.9" />
      <circle cx="16" cy="0" r="3" fill="#FFDE59" />
    </g>
  </g>

  <!-- Right Side Floral Blooms -->
  <g id="right-garland" filter="url(#og-shadow)">
    <g transform="translate(565, 270)">
      <ellipse cx="-5" cy="-12" rx="16" ry="8" transform="rotate(60 -5 -12)" fill="url(#og-leaf)" />
      <circle cx="-16" cy="0" r="16" fill="url(#og-geranium)" />
      <circle cx="-16" cy="0" r="7" fill="#FFA58F" opacity="0.9" />
      <circle cx="-16" cy="0" r="3" fill="#FFDE59" />
    </g>
    <g transform="translate(565, 510)">
      <ellipse cx="-5" cy="12" rx="16" ry="8" transform="rotate(-60 -5 12)" fill="url(#og-leaf)" />
      <circle cx="-16" cy="0" r="16" fill="url(#og-orchid)" />
      <circle cx="-16" cy="0" r="8" fill="#FF94C2" opacity="0.9" />
      <circle cx="-16" cy="0" r="3" fill="#FFDE59" />
    </g>
  </g>

  <!-- Bottom Border Garland -->
  <g id="bottom-garland" filter="url(#og-shadow)">
    <g transform="translate(60, 755)">
      <path d="M 0 0 C -30 -20 -40 -50 -20 -80 C 10 -90 40 -50 20 -20 Z" fill="url(#og-leaf)" />
      <g transform="translate(15, -30)">
        <path d="M 0 22 C -18 32 -28 12 -12 -2 C 0 -8 12 -2 28 12 C 18 32 0 22 0 22 Z" fill="url(#og-orchid)" />
        <ellipse cx="-18" cy="-8" rx="15" ry="9" transform="rotate(30 -18 -8)" fill="#FA78B0" />
        <ellipse cx="18" cy="-8" rx="15" ry="9" transform="rotate(-30 18 -8)" fill="#FA78B0" />
        <circle cx="0" cy="-8" r="4" fill="#FFDE59" />
      </g>
    </g>

    <g transform="translate(300, 760)">
      <ellipse cx="-45" cy="-5" rx="20" ry="9" transform="rotate(15 -45 -5)" fill="url(#og-leaf)" />
      <ellipse cx="45" cy="-5" rx="20" ry="9" transform="rotate(-15 45 -5)" fill="url(#og-leaf)" />
      <circle cx="-12" cy="-18" r="14" fill="url(#og-geranium)" />
      <circle cx="12" cy="-18" r="14" fill="url(#og-geranium)" />
      <circle cx="0" cy="-8" r="14" fill="#FF7B59" />
      <circle cx="0" cy="-26" r="14" fill="url(#og-geranium)" />
      <circle cx="0" cy="-18" r="2.5" fill="#FFDE59" />
    </g>

    <g transform="translate(540, 755)">
      <path d="M 0 0 C 30 -20 40 -50 20 -80 C -10 -90 -40 -50 -20 -20 Z" fill="url(#og-leaf)" />
      <g transform="translate(-15, -30)">
        <path d="M 0 22 C 18 32 28 12 12 -2 C 0 -8 -12 -2 -28 12 C -18 32 0 22 0 22 Z" fill="url(#og-orchid)" />
        <ellipse cx="18" cy="-8" rx="15" ry="9" transform="rotate(-30 18 -8)" fill="#FA78B0" />
        <ellipse cx="-18" cy="-8" rx="15" ry="9" transform="rotate(30 -18 -8)" fill="#FA78B0" />
        <circle cx="0" cy="-8" r="4" fill="#FFDE59" />
      </g>
    </g>
  </g>

  <!-- Typography Content -->
  <g>
    <!-- Header -->
    <text x="300" y="210" class="font-sans" font-size="11" font-weight="700" fill="#913B56" letter-spacing="3.5">A BABY SHOWER CELEBRATION FOR</text>

    <!-- Celebrant Name -->
    <text x="300" y="280" class="font-script" font-size="46" font-weight="700" fill="#7E1343" letter-spacing="1">Brittany Anderson</text>

    <!-- Subtitle -->
    <text x="300" y="325" class="font-sans" font-size="12" font-weight="600" fill="#8F3255" letter-spacing="1.5">LET'S SHOWER BRITTANY WITH LOVE BEFORE BABY ARRIVES!</text>

    <!-- Date & Time -->
    <text x="300" y="415" class="font-serif" font-size="18" font-weight="700" fill="#3D1222" letter-spacing="1">SATURDAY, OCTOBER 10TH</text>
    <text x="300" y="445" class="font-sans" font-size="13" font-weight="500" fill="#782E47" letter-spacing="1">AT 1:00 IN THE AFTERNOON</text>

    <!-- Venue & Address -->
    <text x="300" y="525" class="font-serif" font-size="17" font-weight="700" fill="#800D41" letter-spacing="0.8">The Palm Terrace Pavilion</text>
    <text x="300" y="552" class="font-sans" font-size="12" font-weight="400" fill="#6E2C42" letter-spacing="0.5">510 Coral Way, Miami, FL</text>

    <!-- RSVP -->
    <text x="300" y="625" class="font-sans" font-size="11" font-weight="500" fill="#A82855" letter-spacing="0.5">RSVP by Sept 25 to 555-0139 • Light bites &amp; cocktails served</text>
  </g>
</svg>
