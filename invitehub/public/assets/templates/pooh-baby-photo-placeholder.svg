<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="photo-ph-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="50%" stop-color="#FCEFD2"/>
      <stop offset="100%" stop-color="#F5DFAB"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#photo-ph-bg)"/>
  <circle cx="100" cy="100" r="92" fill="none" stroke="#DCA245" stroke-width="1.8" stroke-dasharray="6,4"/>
  
  <!-- Baby Stroller / Sweet Baby Silhouette Icon -->
  <g transform="translate(100, 85)" fill="#9E6723" opacity="0.85">
    <!-- Sweet Baby Rattle / Pacifier / Heart Silhouette -->
    <path d="M 0 -22 C -12 -34 -30 -22 -30 -8 C -30 12 0 32 0 32 C 0 32 30 12 30 -8 C 30 -22 12 -34 0 -22 Z" fill="#D98A28"/>
    <circle cx="0" cy="-6" r="8" fill="#FFF8E7"/>
    <path d="M -4 -6 L 4 -6 M 0 -10 L 0 -2" stroke="#9E6723" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Upload Photo Indicator Text -->
  <text x="100" y="145" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#825114" letter-spacing="1">ADD PHOTO</text>
  <text x="100" y="162" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#A87330">Click to replace</text>
</svg>
