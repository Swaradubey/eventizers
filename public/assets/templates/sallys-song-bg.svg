<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="100%" height="100%">
  <defs>
    <linearGradient id="ss-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3A1630"/>
      <stop offset="55%" stop-color="#2A1026"/>
      <stop offset="100%" stop-color="#1A0A18"/>
    </linearGradient>
    <linearGradient id="ss-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15111F"/>
      <stop offset="55%" stop-color="#100C19"/>
      <stop offset="100%" stop-color="#0B0813"/>
    </linearGradient>
    <linearGradient id="ss-rose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E7A9C4"/>
      <stop offset="100%" stop-color="#C77E9F"/>
    </linearGradient>
    <radialGradient id="ss-vignette" cx="50%" cy="48%" r="72%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>

    <!-- Dark damask floral wallpaper motif -->
    <g id="ss-floral" fill="none" stroke="#6C3358" stroke-width="2.1" stroke-linecap="round" opacity="0.85">
      <path d="M0,40 C0,22 8,10 20,0 C32,10 40,22 40,40 C40,56 32,66 20,72 C8,66 0,56 0,40 Z"/>
      <path d="M20,72 C20,86 20,96 20,104"/>
      <path d="M20,86 C10,82 4,74 2,64"/>
      <path d="M20,86 C30,82 36,74 38,64"/>
      <path d="M20,40 C14,32 14,22 20,14 C26,22 26,32 20,40 Z"/>
      <path d="M8,46 C4,52 4,60 8,66 M32,46 C36,52 36,60 32,66"/>
      <circle cx="20" cy="40" r="4.4"/>
    </g>
    <pattern id="ss-damask" width="112" height="132" patternUnits="userSpaceOnUse">
      <rect width="112" height="132" fill="none"/>
      <use href="#ss-floral" transform="translate(36,20)"/>
      <use href="#ss-floral" transform="translate(-20,86) scale(0.7)"/>
      <use href="#ss-floral" transform="translate(92,86) scale(0.7)"/>
      <circle cx="92" cy="34" r="2.6" fill="#6C3358" opacity="0.7"/>
      <circle cx="16" cy="34" r="2.6" fill="#6C3358" opacity="0.7"/>
    </pattern>

    <!-- Sketch stroke style -->
    <g id="ss-heart">
      <path d="M0,7 C-3,-2 -12,-3 -12,5 C-12,12 -4,17 0,21 C4,17 12,12 12,5 C12,-3 3,-2 0,7 Z"/>
    </g>
  </defs>

  <!-- Floral wallpaper backdrop -->
  <rect width="500" height="700" fill="url(#ss-bg)"/>
  <rect width="500" height="700" fill="url(#ss-damask)" opacity="0.62"/>

  <!-- Inner charcoal panel (the card surface) -->
  <rect x="34" y="34" width="432" height="632" rx="10" fill="url(#ss-panel)"/>
  <rect x="34" y="34" width="432" height="632" rx="10" fill="url(#ss-damask)" opacity="0.2"/>
  <rect x="46" y="46" width="408" height="608" rx="6" fill="none" stroke="#4B2C46" stroke-width="1.6"/>
  <rect x="53" y="53" width="394" height="594" rx="4" fill="none" stroke="#4B2C46" stroke-width="0.9" stroke-dasharray="3 7"/>

  <!-- Crescent moon + stars -->
  <path d="M108,116 A26,26 0 1 0 138,146 A21,21 0 1 1 108,116 Z" fill="url(#ss-rose)" opacity="0.9"/>
  <g fill="#E7A9C4">
    <path d="M400,104 l3,7 l7,3 l-7,3 l-3,7 l-3,-7 l-7,-3 l7,-3 z" opacity="0.9"/>
    <path d="M362,168 l2,5 l5,2 l-5,2 l-2,5 l-2,-5 l-5,-2 l5,-2 z" opacity="0.7"/>
    <path d="M152,196 l2,5 l5,2 l-5,2 l-2,5 l-2,-5 l-5,-2 l5,-2 z" opacity="0.7"/>
    <circle cx="330" cy="126" r="2.4" opacity="0.8"/>
    <circle cx="178" cy="140" r="2" opacity="0.7"/>
    <circle cx="430" cy="206" r="2.2" opacity="0.6"/>
  </g>

  <!-- Sketchy foliage growing up the sides -->
  <g fill="none" stroke="#EDE6F2" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <path d="M78,646 C70,570 84,510 74,452 C66,404 84,362 78,320"/>
    <path d="M74,540 C60,532 52,518 50,502 M74,540 C88,534 96,520 98,504"/>
    <path d="M76,452 C62,446 54,432 52,416 M76,452 C90,446 98,432 100,416"/>
    <path d="M76,368 C64,362 56,350 54,336 M76,368 C88,362 96,350 98,336"/>
    <path d="M422,646 C430,574 416,512 426,456 C434,410 416,368 422,330"/>
    <path d="M426,548 C440,540 448,526 450,510 M426,548 C412,542 404,528 402,512"/>
    <path d="M424,462 C438,456 446,442 448,426 M424,462 C410,456 402,442 400,426"/>
    <path d="M424,378 C436,372 444,360 446,346 M424,378 C412,372 404,360 402,346"/>
  </g>
  <!-- little leaves -->
  <g fill="#D9CDE4" opacity="0.85">
    <ellipse cx="60" cy="516" rx="9" ry="5" transform="rotate(-32 60 516)"/>
    <ellipse cx="94" cy="512" rx="9" ry="5" transform="rotate(28 94 512)"/>
    <ellipse cx="58" cy="428" rx="8" ry="4.6" transform="rotate(-30 58 428)"/>
    <ellipse cx="96" cy="426" rx="8" ry="4.6" transform="rotate(30 96 426)"/>
    <ellipse cx="442" cy="522" rx="9" ry="5" transform="rotate(32 442 522)"/>
    <ellipse cx="408" cy="518" rx="9" ry="5" transform="rotate(-28 408 518)"/>
    <ellipse cx="444" cy="436" rx="8" ry="4.6" transform="rotate(30 444 436)"/>
    <ellipse cx="406" cy="434" rx="8" ry="4.6" transform="rotate(-30 406 434)"/>
  </g>

  <!-- Sally: stitched ragdoll girl, sketch line art -->
  <g transform="translate(250,470)" stroke-linecap="round" stroke-linejoin="round">
    <!-- dress -->
    <path d="M-46,6 C-56,54 -60,92 -54,124 L54,124 C60,92 56,54 46,6 Z"
          fill="#2C1A3A" stroke="url(#ss-rose)" stroke-width="2.6"/>
    <!-- dress patch stitches -->
    <path d="M-34,44 h26 M-30,58 h22 M-36,72 h30" stroke="#E7A9C4" stroke-width="1.6" opacity="0.9"/>
    <rect x="6" y="40" width="26" height="22" rx="3" fill="none" stroke="#E7A9C4" stroke-width="1.5"/>
    <path d="M6,40 l26,22 M32,40 l-26,22" stroke="#E7A9C4" stroke-width="1" opacity="0.7"/>
    <!-- torso seam -->
    <path d="M0,6 C-6,34 -6,66 0,120" fill="none" stroke="#E7A9C4" stroke-width="1.6" stroke-dasharray="6 5"/>
    <!-- arms -->
    <path d="M-46,16 C-70,44 -78,74 -72,104" fill="none" stroke="url(#ss-rose)" stroke-width="8"/>
    <path d="M46,16 C70,44 78,74 72,104" fill="none" stroke="url(#ss-rose)" stroke-width="8"/>
    <path d="M-60,66 h16 M56,66 h16" stroke="#F4D9E6" stroke-width="1.7"/>
    <!-- legs -->
    <path d="M-26,124 C-30,158 -30,182 -26,206" fill="none" stroke="url(#ss-rose)" stroke-width="9"/>
    <path d="M26,124 C30,158 30,182 26,206" fill="none" stroke="url(#ss-rose)" stroke-width="9"/>
    <path d="M-34,150 h16 M18,150 h16 M-34,176 h16 M18,176 h16" stroke="#F4D9E6" stroke-width="1.6"/>
    <!-- shoes -->
    <path d="M-34,206 c-8,4 -10,12 -2,14 h24 c6,-2 4,-10 -4,-14 z" fill="#E7A9C4"/>
    <path d="M34,206 c8,4 10,12 2,14 h-24 c-6,-2 -4,-10 4,-14 z" fill="#E7A9C4"/>
    <!-- head -->
    <circle cx="0" cy="-34" r="42" fill="#F6EDE4" stroke="#E7A9C4" stroke-width="2.6"/>
    <!-- hair -->
    <path d="M-42,-38 C-46,-84 -18,-104 0,-104 C18,-104 46,-84 42,-38
             C36,-58 24,-70 0,-72 C-24,-70 -36,-58 -42,-38 Z" fill="#B7223A" stroke="#E7A9C4" stroke-width="2"/>
    <path d="M-42,-38 C-52,-14 -52,10 -44,30 C-50,4 -50,-20 -44,-40 Z" fill="#B7223A"/>
    <path d="M42,-38 C52,-14 52,10 44,30 C50,4 50,-20 44,-40 Z" fill="#B7223A"/>
    <path d="M-30,-76 C-24,-60 -26,-46 -32,-34 M0,-92 C4,-74 2,-56 -4,-44 M28,-76 C22,-60 24,-46 30,-34"
          fill="none" stroke="#8E4E6E" stroke-width="2"/>
    <!-- face -->
    <g fill="#2C1A3A">
      <circle cx="-15" cy="-40" r="5.4"/>
      <circle cx="15" cy="-40" r="5.4"/>
      <path d="M-12,-18 C-6,-12 6,-12 12,-18" fill="none" stroke="#2C1A3A" stroke-width="2.6"/>
      <path d="M-8,-18 a2,2 0 1,0 0.1,0" />
      <path d="M8,-18 a2,2 0 1,0 0.1,0" />
    </g>
    <!-- cheek stitches -->
    <path d="M-34,-24 l-10,4 M-33,-18 l-10,4 M-32,-12 l-10,4" stroke="#B3607F" stroke-width="1.8"/>
    <path d="M34,-24 l10,4 M33,-18 l10,4 M32,-12 l10,4" stroke="#B3607F" stroke-width="1.8"/>
    <!-- neck stitch -->
    <path d="M-12,4 h24" stroke="#B3607F" stroke-width="2" stroke-dasharray="4 4"/>
  </g>

  <!-- Black cat companion -->
  <g transform="translate(370,556)">
    <path d="M0,86 C-30,86 -44,64 -44,40 C-44,18 -32,4 -14,-4 L-24,-34 L-4,-18 C4,-20 12,-20 20,-16 L38,-34 L32,-2 C46,10 52,28 50,46 C48,68 30,86 0,86 Z"
          fill="#0C0910" stroke="#E7A9C4" stroke-width="2.2"/>
    <!-- tail -->
    <path d="M46,74 C74,78 88,58 82,36 C78,22 66,18 60,26 C68,26 72,36 68,46 C64,58 56,66 44,66"
          fill="#0C0910" stroke="#E7A9C4" stroke-width="2.2"/>
    <!-- eyes -->
    <g fill="#F2E27A">
      <ellipse cx="-14" cy="26" rx="7" ry="8"/>
      <ellipse cx="14" cy="26" rx="7" ry="8"/>
    </g>
    <g fill="#14100F">
      <ellipse cx="-14" cy="26" rx="2.2" ry="7"/>
      <ellipse cx="14" cy="26" rx="2.2" ry="7"/>
    </g>
    <!-- nose + whiskers -->
    <path d="M0,40 l-5,-6 h10 z" fill="#E7A9C4"/>
    <g stroke="#EDE6F2" stroke-width="1.4" opacity="0.8">
      <path d="M-10,44 C-24,42 -34,38 -42,34 M-10,48 C-24,48 -34,50 -42,52"/>
      <path d="M10,44 C24,42 34,38 42,34 M10,48 C24,48 34,50 42,52"/>
    </g>
    <!-- chest stitch -->
    <path d="M-8,64 C-2,70 6,70 12,64" fill="none" stroke="#E7A9C4" stroke-width="1.6" stroke-dasharray="4 4"/>
  </g>

  <!-- Floating hearts -->
  <g fill="url(#ss-rose)" opacity="0.9">
    <g transform="translate(150,300) scale(1.1)"><use href="#ss-heart"/></g>
    <g transform="translate(360,268) scale(0.8)"><use href="#ss-heart"/></g>
    <g transform="translate(316,336) scale(0.55)"><use href="#ss-heart"/></g>
  </g>

  <!-- Ground line -->
  <path d="M64,616 H436" stroke="#4B2C46" stroke-width="2" stroke-dasharray="8 8"/>

  <rect width="500" height="700" fill="url(#ss-vignette)"/>
</svg>
