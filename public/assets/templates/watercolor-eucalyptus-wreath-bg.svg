<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="euc-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCFCFA"/>
      <stop offset="60%" stop-color="#F7F8F5"/>
      <stop offset="100%" stop-color="#F2F4EF"/>
    </linearGradient>
    <linearGradient id="euc-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EED798"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B28C22"/>
    </linearGradient>
    <filter id="euc-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="800" rx="16" fill="url(#euc-bg)" />

  <!-- Elegant Fine Line Geometric Border -->
  <rect x="24" y="24" width="552" height="752" rx="10" fill="none" stroke="#E2E6DF" stroke-width="1.2" />
  <rect x="30" y="30" width="540" height="740" rx="8" fill="none" stroke="#B8C5B6" stroke-width="0.7" opacity="0.6" />

  <!-- Sage Watercolor Eucalyptus Circular Wreath (Center ~ cx: 300, cy: 260) -->
  <g id="eucalyptus-wreath" filter="url(#euc-soft)">
    <!-- Base Circular Vine Branches -->
    <g fill="none" stroke="#728A73" stroke-width="1.6" stroke-linecap="round" opacity="0.85">
      <!-- Main circular vines -->
      <path d="M 300 95 C 400 95 470 170 470 260 C 470 350 400 425 300 425 C 200 425 130 350 130 260 C 130 170 200 95 300 95 Z" />
      <path d="M 300 105 C 410 105 460 180 460 260 C 460 340 410 415 300 415 C 190 415 140 340 140 260 C 140 180 190 105 300 105 Z" opacity="0.6" stroke-dasharray="8,6" />
    </g>

    <!-- Top Leaves (12 o'clock) -->
    <g fill="#7A947B" opacity="0.9">
      <ellipse cx="280" cy="92" rx="16" ry="9" transform="rotate(-15 280 92)" />
      <ellipse cx="320" cy="92" rx="16" ry="9" transform="rotate(15 320 92)" />
      <ellipse cx="300" cy="85" rx="13" ry="7" transform="rotate(5 300 85)" fill="#688369" />
      <ellipse cx="255" cy="102" rx="14" ry="8" transform="rotate(-30 255 102)" fill="#8FA990" />
      <ellipse cx="345" cy="102" rx="14" ry="8" transform="rotate(30 345 102)" fill="#8FA990" />
    </g>

    <!-- Top Right Leaves (1 - 3 o'clock) -->
    <g fill="#6B856C" opacity="0.9">
      <ellipse cx="385" cy="122" rx="17" ry="10" transform="rotate(40 385 122)" />
      <ellipse cx="405" cy="140" rx="15" ry="9" transform="rotate(45 405 140)" fill="#849F85" />
      <ellipse cx="435" cy="175" rx="18" ry="10" transform="rotate(60 435 175)" />
      <ellipse cx="445" cy="205" rx="16" ry="9" transform="rotate(70 445 205)" fill="#9CB49D" />
      <ellipse cx="465" cy="235" rx="18" ry="11" transform="rotate(85 465 235)" fill="#607B61" />
      <ellipse cx="468" cy="270" rx="18" ry="11" transform="rotate(95 468 270)" fill="#789279" />
    </g>

    <!-- Bottom Right Leaves (4 - 5 o'clock) -->
    <g fill="#728D73" opacity="0.9">
      <ellipse cx="455" cy="310" rx="17" ry="10" transform="rotate(115 455 310)" />
      <ellipse cx="440" cy="340" rx="16" ry="9" transform="rotate(130 440 340)" fill="#8FA990" />
      <ellipse cx="410" cy="375" rx="18" ry="10" transform="rotate(145 410 375)" fill="#5A745B" />
      <ellipse cx="375" cy="405" rx="17" ry="9" transform="rotate(160 375 405)" />
      <ellipse cx="340" cy="420" rx="15" ry="8" transform="rotate(170 340 420)" fill="#8CA68D" />
    </g>

    <!-- Bottom Leaves (6 o'clock) -->
    <g fill="#6E8A6F" opacity="0.9">
      <ellipse cx="300" cy="428" rx="16" ry="8" transform="rotate(0 300 428)" />
      <ellipse cx="270" cy="422" rx="16" ry="9" transform="rotate(-15 270 422)" fill="#85A086" />
      <ellipse cx="330" cy="422" rx="16" ry="9" transform="rotate(15 330 422)" fill="#85A086" />
    </g>

    <!-- Bottom Left Leaves (7 - 8 o'clock) -->
    <g fill="#7A967B" opacity="0.9">
      <ellipse cx="225" cy="405" rx="17" ry="9" transform="rotate(-160 225 405)" />
      <ellipse cx="190" cy="375" rx="18" ry="10" transform="rotate(-145 190 375)" fill="#5E795F" />
      <ellipse cx="160" cy="340" rx="16" ry="9" transform="rotate(-130 160 340)" fill="#8CA68D" />
      <ellipse cx="145" cy="310" rx="17" ry="10" transform="rotate(-115 145 310)" />
    </g>

    <!-- Top Left Leaves (9 - 11 o'clock) -->
    <g fill="#6B856C" opacity="0.9">
      <ellipse cx="132" cy="270" rx="18" ry="11" transform="rotate(-95 132 270)" fill="#789279" />
      <ellipse cx="135" cy="235" rx="18" ry="11" transform="rotate(-85 135 235)" fill="#5E775F" />
      <ellipse cx="155" cy="205" rx="16" ry="9" transform="rotate(-70 155 205)" fill="#98B199" />
      <ellipse cx="165" cy="175" rx="18" ry="10" transform="rotate(-60 165 175)" />
      <ellipse cx="195" cy="140" rx="15" ry="9" transform="rotate(-45 195 140)" fill="#849F85" />
      <ellipse cx="215" cy="122" rx="17" ry="10" transform="rotate(-40 215 122)" />
    </g>

    <!-- Silver Dollar Rounded Eucalyptus Leaf Clusters (Layer 2) -->
    <g fill="#9FB8A0" opacity="0.75">
      <circle cx="270" cy="108" r="11" />
      <circle cx="330" cy="108" r="11" />
      <circle cx="420" cy="160" r="12" />
      <circle cx="452" cy="250" r="12" />
      <circle cx="428" cy="355" r="11" />
      <circle cx="360" cy="412" r="11" />
      <circle cx="240" cy="412" r="11" />
      <circle cx="172" cy="355" r="11" />
      <circle cx="148" cy="250" r="12" />
      <circle cx="180" cy="160" r="12" />
    </g>

    <!-- Delicate Olive Twigs & Tiny Berries -->
    <g stroke="#566C57" stroke-width="1.2" stroke-linecap="round" fill="none">
      <path d="M 230 110 Q 210 100 200 90" />
      <path d="M 370 110 Q 390 100 400 90" />
      <path d="M 440 210 Q 460 215 475 220" />
      <path d="M 450 300 Q 470 310 480 325" />
      <path d="M 160 210 Q 140 215 125 220" />
      <path d="M 150 300 Q 130 310 120 325" />
    </g>

    <!-- Gold Foil Botanical Accents & Seed Pods -->
    <g fill="url(#euc-gold)" opacity="0.85">
      <circle cx="288" cy="100" r="3.2" />
      <circle cx="312" cy="100" r="3.2" />
      <circle cx="395" cy="130" r="3" />
      <circle cx="445" cy="190" r="3.2" />
      <circle cx="462" cy="285" r="3" />
      <circle cx="425" cy="368" r="3" />
      <circle cx="320" cy="418" r="3" />
      <circle cx="280" cy="418" r="3" />
      <circle cx="175" cy="368" r="3" />
      <circle cx="138" cy="285" r="3" />
      <circle cx="155" cy="190" r="3.2" />
      <circle cx="205" cy="130" r="3" />
    </g>

    <!-- Gold Foil Splatter Micro-dots -->
    <g fill="url(#euc-gold)" opacity="0.7">
      <circle cx="220" cy="85" r="1.5" />
      <circle cx="380" cy="85" r="1.5" />
      <circle cx="485" cy="180" r="1.2" />
      <circle cx="480" cy="340" r="1.4" />
      <circle cx="115" cy="180" r="1.2" />
      <circle cx="120" cy="340" r="1.4" />
      <circle cx="300" cy="445" r="1.5" />
    </g>
  </g>

  <!-- Bottom Corner Soft Eucalyptus Sprigs -->
  <g id="bottom-eucalyptus" opacity="0.75">
    <g transform="translate(60, 710)">
      <path d="M 0 35 Q 25 15 65 20" fill="none" stroke="#728A73" stroke-width="1.4" stroke-linecap="round" />
      <ellipse cx="25" cy="22" rx="11" ry="6" transform="rotate(-20 25 22)" fill="#85A086" />
      <ellipse cx="50" cy="18" rx="10" ry="5" transform="rotate(-10 50 18)" fill="#6E8A6F" />
      <circle cx="38" cy="15" r="2.2" fill="url(#euc-gold)" />
    </g>
    <g transform="translate(540, 710) scale(-1, 1)">
      <path d="M 0 35 Q 25 15 65 20" fill="none" stroke="#728A73" stroke-width="1.4" stroke-linecap="round" />
      <ellipse cx="25" cy="22" rx="11" ry="6" transform="rotate(-20 25 22)" fill="#85A086" />
      <ellipse cx="50" cy="18" rx="10" ry="5" transform="rotate(-10 50 18)" fill="#6E8A6F" />
      <circle cx="38" cy="15" r="2.2" fill="url(#euc-gold)" />
    </g>
  </g>
</svg>
