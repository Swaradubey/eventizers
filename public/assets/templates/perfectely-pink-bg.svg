<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 840" width="100%" height="100%">
  <defs>
    <!-- Card Base Gradients -->
    <linearGradient id="pp-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9C0D50"/>
      <stop offset="40%" stop-color="#840A43"/>
      <stop offset="100%" stop-color="#670533"/>
    </linearGradient>

    <!-- Glitter Pattern -->
    <linearGradient id="pp-glitter-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4097"/>
      <stop offset="25%" stop-color="#FF82BC"/>
      <stop offset="50%" stop-color="#FF1F80"/>
      <stop offset="75%" stop-color="#FFA8D3"/>
      <stop offset="100%" stop-color="#E0106B"/>
    </linearGradient>

    <pattern id="pp-glitter-pattern" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="url(#pp-glitter-base)"/>
      <circle cx="3" cy="4" r="1.2" fill="#FFFFFF" opacity="0.9"/>
      <circle cx="11" cy="2" r="0.8" fill="#FFF0F7" opacity="0.85"/>
      <circle cx="8" cy="9" r="1.4" fill="#FFFFFF" opacity="0.95"/>
      <circle cx="14" cy="12" r="1" fill="#FFE0F0" opacity="0.8"/>
      <circle cx="2" cy="13" r="0.9" fill="#FFFFFF" opacity="0.75"/>
      <circle cx="12" cy="7" r="0.7" fill="#FFB3D9" opacity="0.9"/>
    </pattern>

    <!-- Glossy Highlight Filter -->
    <filter id="pp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="pp-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#3D001C" flood-opacity="0.45"/>
    </filter>

    <clipPath id="pp-card-clip">
      <rect width="600" height="840" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#pp-card-clip)">
    <!-- 1. Outer Glitter Border (Barbie Pink Sparkle) -->
    <rect width="600" height="840" fill="url(#pp-glitter-pattern)"/>
    <rect width="600" height="840" fill="none" stroke="#FFA3D0" stroke-width="2" opacity="0.6"/>

    <!-- 2. Inner Ivory Border & Shadow Frame -->
    <rect x="32" y="32" width="536" height="776" rx="6" fill="#FFF2F8" filter="url(#pp-shadow)"/>
    <rect x="38" y="38" width="524" height="764" rx="4" fill="none" stroke="#E5AFC8" stroke-width="1.5"/>

    <!-- 3. Inner Magenta Card Canvas -->
    <rect x="42" y="42" width="516" height="756" rx="4" fill="url(#pp-bg)"/>

    <!-- Soft Vignette / Inner Depth -->
    <rect x="42" y="42" width="516" height="756" rx="4" fill="none" stroke="#480222" stroke-width="12" opacity="0.35"/>

    <!-- 4. Decorative Fashion Illustrations Around Card (Center is empty for editable text) -->

    <!-- Sparkle Stars (✦) Background Accents -->
    <g fill="#FFFFFF" opacity="0.75">
      <path d="M120 110 Q120 125 105 125 Q120 125 120 140 Q120 125 135 125 Q120 125 120 110 Z"/>
      <path d="M470 120 Q470 132 458 132 Q470 132 470 144 Q470 132 482 132 Q470 132 470 120 Z" transform="scale(0.8) translate(100, 20)"/>
      <path d="M90 420 Q90 432 78 432 Q90 432 90 444 Q90 432 102 432 Q90 432 90 420 Z" transform="scale(0.7) translate(30, 180)"/>
      <path d="M510 380 Q510 392 498 392 Q510 392 510 404 Q510 392 522 392 Q510 392 510 380 Z" transform="scale(0.8) translate(110, 80)"/>
      <path d="M110 660 Q110 672 98 672 Q110 672 110 684 Q110 672 122 672 Q110 672 110 660 Z" transform="scale(0.85) translate(15, 100)"/>
      <path d="M490 680 Q490 692 478 692 Q490 692 490 704 Q490 692 502 692 Q490 692 490 680 Z" transform="scale(0.9) translate(40, 60)"/>
      <!-- Tiny Diamond Glimmers -->
      <polygon points="170,85 173,90 170,95 167,90"/>
      <polygon points="420,95 423,100 420,105 417,100"/>
      <polygon points="140,510 143,514 140,518 137,514"/>
      <polygon points="460,500 463,504 460,508 457,504"/>
    </g>

    <!-- Top Center: Pink Heart/Cat-Eye Sunglasses -->
    <g transform="translate(245, 95)" filter="url(#pp-shadow)">
      <!-- Left Lens/Rim -->
      <path d="M0 20 C-18 5 -42 12 -42 32 C-42 50 -10 62 0 72 C10 62 42 50 42 32 C42 12 18 5 0 20 Z" 
            transform="translate(-32, 0) rotate(-10)" fill="#FF2688" stroke="#FFA3CE" stroke-width="3"/>
      <path d="M0 25 C-12 14 -32 20 -32 35 C-32 46 -8 54 0 62 C8 54 32 46 32 35 C32 20 12 14 0 25 Z" 
            transform="translate(-32, 0) rotate(-10)" fill="#D4146C"/>
      <!-- Left Glass Glare -->
      <path d="M-44 32 Q-40 46 -32 50" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.8"/>

      <!-- Bridge -->
      <path d="M-15 32 Q0 26 15 32" stroke="#FFA3CE" stroke-width="4.5" fill="none" stroke-linecap="round"/>

      <!-- Right Lens/Rim -->
      <path d="M0 20 C-18 5 -42 12 -42 32 C-42 50 -10 62 0 72 C10 62 42 50 42 32 C42 12 18 5 0 20 Z" 
            transform="translate(32, 0) rotate(10)" fill="#FF2688" stroke="#FFA3CE" stroke-width="3"/>
      <path d="M0 25 C-12 14 -32 20 -32 35 C-32 46 -8 54 0 62 C8 54 32 46 32 35 C32 20 12 14 0 25 Z" 
            transform="translate(32, 0) rotate(10)" fill="#D4146C"/>
      <!-- Right Glass Glare -->
      <path d="M20 32 Q24 46 32 50" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.8"/>
    </g>

    <!-- Top Right: Pink Quilted Heart Handbag -->
    <g transform="translate(435, 105)" filter="url(#pp-shadow)">
      <!-- Chain/Strap -->
      <path d="M-8 0 C-15 -35 45 -35 38 0" fill="none" stroke="#FFD700" stroke-width="2.5" stroke-dasharray="4 2"/>
      <!-- Heart Purse Body -->
      <path d="M15 15 C-5 -5 -35 5 -35 28 C-35 52 0 70 15 85 C30 70 65 52 65 28 C65 5 35 -5 15 15 Z" 
            fill="#FF3399" stroke="#FFA8D8" stroke-width="3"/>
      <!-- Quilted Lines on Purse -->
      <path d="M-20 20 L40 60 M-30 35 L30 75 M-10 10 L50 50 M-20 60 L40 20 M-30 45 L30 5 M-10 70 L50 30" 
            stroke="#FF80BF" stroke-width="1.2" opacity="0.75"/>
      <!-- Pearl/Gold Clasp -->
      <circle cx="15" cy="18" r="5" fill="#FFF2B2" stroke="#E5A800" stroke-width="1.5"/>
      <circle cx="15" cy="18" r="2" fill="#FFFFFF"/>
    </g>

    <!-- Top Left: Heart Earrings / Dangles -->
    <g transform="translate(105, 155)" filter="url(#pp-shadow)">
      <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
      <line x1="0" y1="3" x2="0" y2="16" stroke="#FFA8D8" stroke-width="1.5"/>
      <path d="M0 16 C-5 11 -12 13 -12 19 C-12 25 0 31 0 35 C0 31 12 25 12 19 C12 13 5 11 0 16 Z" fill="#FF4097" stroke="#FFFFFF" stroke-width="1"/>
      <!-- Second earring -->
      <circle cx="18" cy="4" r="3" fill="#FFFFFF"/>
      <line x1="18" y1="7" x2="18" y2="20" stroke="#FFA8D8" stroke-width="1.5"/>
      <path d="M18 20 C13 15 6 17 6 23 C6 29 18 35 18 39 C18 35 30 29 30 23 C30 17 23 15 18 20 Z" fill="#FF4097" stroke="#FFFFFF" stroke-width="1"/>
    </g>

    <!-- Mid Left: Glamour Pink Lipstick -->
    <g transform="translate(90, 310) rotate(15)" filter="url(#pp-shadow)">
      <!-- Black/Gold Case Base -->
      <rect x="0" y="45" width="22" height="42" rx="3" fill="#FF2688" stroke="#FFA3CE" stroke-width="1.5"/>
      <rect x="0" y="45" width="22" height="10" fill="#FFD700" stroke="#E5A800" stroke-width="1"/>
      <!-- Inner Silver Tube -->
      <rect x="3" y="24" width="16" height="22" rx="1" fill="#E6E8EA" stroke="#A8ADB2" stroke-width="1"/>
      <line x1="7" y1="24" x2="7" y2="45" stroke="#FFFFFF" stroke-width="2"/>
      <!-- Angled Lipstick Bullet -->
      <path d="M4 24 L4 10 Q11 0 18 6 L18 24 Z" fill="#E60067"/>
      <!-- Gloss highlight -->
      <path d="M6 22 L6 12 Q10 4 15 8" stroke="#FF85B8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Mid Right: Little Perfume Bottle / Sparkle Cluster -->
    <g transform="translate(485, 360)" filter="url(#pp-shadow)">
      <circle cx="12" cy="12" r="14" fill="#FF52A3" stroke="#FFBADC" stroke-width="2"/>
      <circle cx="10" cy="9" r="4" fill="#FFFFFF" opacity="0.7"/>
      <rect x="7" y="-5" width="10" height="7" rx="1" fill="#FFD700"/>
      <circle cx="12" cy="-9" r="4" fill="#FF2688"/>
    </g>

    <!-- Bottom Left: Hot Pink Stiletto High Heels -->
    <g transform="translate(95, 500)" filter="url(#pp-shadow)">
      <!-- First Shoe (Back) -->
      <path d="M15 45 C35 45 42 25 50 15 C54 10 58 12 55 20 C50 32 46 52 75 58 C85 60 92 68 85 70 C60 75 35 72 20 65 L18 85 L14 85 L12 52 Z" 
            fill="#D4146C" opacity="0.8" transform="translate(8, -8)"/>
      <!-- Second Shoe (Front) -->
      <path d="M15 45 C35 45 42 25 50 15 C54 10 58 12 55 20 C50 32 46 52 75 58 C85 60 92 68 85 70 C60 75 35 72 20 65 L18 88 L13 88 L12 52 Z" 
            fill="#FF2E88" stroke="#FF99C8" stroke-width="2"/>
      <!-- Gloss Highlight on Sole and Arch -->
      <path d="M22 49 C38 49 44 32 50 20" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85"/>
      <path d="M46 55 C55 58 68 62 76 63" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85"/>
    </g>

    <!-- Bottom Right: Heart Vanity Mirror / Compact -->
    <g transform="translate(435, 475) rotate(-12)" filter="url(#pp-shadow)">
      <!-- Open Base -->
      <path d="M18 16 C0 -4 -30 6 -30 28 C-30 52 5 70 18 84 C31 70 66 52 66 28 C66 6 36 -4 18 16 Z" 
            fill="#FF2E88" stroke="#FFA3CE" stroke-width="3"/>
      <!-- Mirror Insert (Shiny glass) -->
      <path d="M18 22 C4 6 -20 14 -20 30 C-20 48 8 62 18 74 C28 62 56 48 56 30 C56 14 32 6 18 22 Z" 
            fill="#C2E8FF" stroke="#FFFFFF" stroke-width="2"/>
      <!-- Mirror Glare -->
      <path d="M-6 26 L12 65 M5 22 L24 62" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
      <!-- Heart Puff / Powder -->
      <circle cx="52" cy="74" r="14" fill="#FFE0F0" stroke="#FF80BF" stroke-width="1.5"/>
      <path d="M44 74 Q52 70 60 74" stroke="#FF54A5" stroke-width="2" fill="none"/>
    </g>
  </g>
</svg>
