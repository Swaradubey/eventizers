  <g id="corner-br" transform="translate(570, 770) scale(-1, -1)" filter="url(#bb-shadow)">
    <path d="M 5 5 Q 45 15 85 45" fill="none" stroke="#667C65" stroke-width="1.3" stroke-linecap="round" />
    <path d="M 5 5 Q 15 45 45 85" fill="none" stroke="#667C65" stroke-width="1.3" stroke-linecap="round" />
    <path d="M 5 5 L 60 60" fill="none" stroke="#4F644E" stroke-width="1.5" stroke-linecap="round" />
    <ellipse cx="25" cy="40" rx="11" ry="6" transform="rotate(35 25 40)" fill="#8EA88D" opacity="0.85" />
    <ellipse cx="40" cy="25" rx="11" ry="6" transform="rotate(55 40 25)" fill="#8EA88D" opacity="0.85" />
    <ellipse cx="48" cy="70" rx="13" ry="7" transform="rotate(25 48 70)" fill="#789677" opacity="0.9" />
    <ellipse cx="70" cy="48" rx="13" ry="7" transform="rotate(65 70 48)" fill="#789677" opacity="0.9" />
    <g transform="translate(32, 32)">
      <circle cx="0" cy="0" r="18" fill="url(#bb-petal)" />
      <circle cx="-3" cy="-2" r="13" fill="#FFF2EB" opacity="0.9" />
      <circle cx="2" cy="1" r="10" fill="url(#bb-petal)" opacity="0.85" />
      <circle cx="0" cy="0" r="5" fill="#E8A68B" />
      <circle cx="0" cy="0" r="2" fill="#D4AF37" />
    </g>
    <g transform="translate(68, 30)">
      <circle cx="0" cy="0" r="8" fill="#FCEEE6" stroke="#E0A792" stroke-width="0.8" />
      <circle cx="0" cy="0" r="3" fill="#D4AF37" />
    </g>
    <g transform="translate(30, 68)">
      <circle cx="0" cy="0" r="8" fill="#FCEEE6" stroke="#E0A792" stroke-width="0.8" />
      <circle cx="0" cy="0" r="3" fill="#D4AF37" />
