<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bb-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCFCFA"/>
      <stop offset="60%" stop-color="#F9F9F6"/>
      <stop offset="100%" stop-color="#F4F4EE"/>
    </linearGradient>
    <linearGradient id="bb-petal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCEEE6"/>
      <stop offset="50%" stop-color="#F5CEBC"/>
      <stop offset="100%" stop-color="#DE987C"/>
    </linearGradient>
    <linearGradient id="bb-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0DFB0"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A8811A"/>
    </linearGradient>
    <filter id="bb-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="600" height="800" rx="16" fill="url(#bb-bg)" />

  <!-- Ultra Clean Minimalist Inner Border -->
  <rect x="24" y="24" width="552" height="752" rx="10" fill="none" stroke="#E5E4DC" stroke-width="1.2" />
  <rect x="30" y="30" width="540" height="740" rx="8" fill="none" stroke="#CECDBF" stroke-width="0.6" opacity="0.6" />

  <!-- 4-Corner Minimalist Botanical Accents -->

  <!-- Top-Left Corner Bouquet -->
  <g id="corner-tl" transform="translate(30, 30)" filter="url(#bb-shadow)">
    <!-- Delicate Stems -->
    <path d="M 5 5 Q 45 15 85 45" fill="none" stroke="#667C65" stroke-width="1.3" stroke-linecap="round" />
    <path d="M 5 5 Q 15 45 45 85" fill="none" stroke="#667C65" stroke-width="1.3" stroke-linecap="round" />
    <path d="M 5 5 L 60 60" fill="none" stroke="#4F644E" stroke-width="1.5" stroke-linecap="round" />

    <!-- Sage Eucalyptus Leaves -->
    <ellipse cx="25" cy="40" rx="11" ry="6" transform="rotate(35 25 40)" fill="#8EA88D" opacity="0.85" />
    <ellipse cx="40" cy="25" rx="11" ry="6" transform="rotate(55 40 25)" fill="#8EA88D" opacity="0.85" />
    <ellipse cx="48" cy="70" rx="13" ry="7" transform="rotate(25 48 70)" fill="#789677" opacity="0.9" />
    <ellipse cx="70" cy="48" rx="13" ry="7" transform="rotate(65 70 48)" fill="#789677" opacity="0.9" />

    <!-- Ranunculus / Wild Blossom in Corner (cx: 30, cy: 30) -->
    <g transform="translate(32, 32)">
      <circle cx="0" cy="0" r="18" fill="url(#bb-petal)" />
      <circle cx="-3" cy="-2" r="13" fill="#FFF2EB" opacity="0.9" />
      <circle cx="2" cy="1" r="10" fill="url(#bb-petal)" opacity="0.85" />
      <circle cx="0" cy="0" r="5" fill="#E8A68B" />
      <circle cx="0" cy="0" r="2" fill="#D4AF37" />
    </g>

    <!-- Sweet Pea / Baby Bud (65, 30) -->
    <g transform="translate(68, 30)">
      <circle cx="0" cy="0" r="8" fill="#FCEEE6" stroke="#E0A792" stroke-width="0.8" />
      <circle cx="0" cy="0" r="3" fill="#D4AF37" />
    </g>
    <!-- Sweet Pea / Baby Bud (30, 68) -->
    <g transform="translate(30, 68)">
      <circle cx="0" cy="0" r="8" fill="#FCEEE6" stroke="#E0A792" stroke-width="0.8" />
      <circle cx="0" cy="0" r="3" fill="#D4AF37" />
    </g>
  </g>

  <!-- Top-Right Corner Bouquet -->
