<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 840" width="100%" height="100%">
  <defs>
    <!-- Dark Arcade Space Background -->
    <linearGradient id="lgg-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#120D2C"/>
      <stop offset="50%" stop-color="#0E0A24"/>
      <stop offset="100%" stop-color="#080518"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neon-glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur1"/>
      <feGaussianBlur stdDeviation="7" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neon-glow-pink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur1"/>
      <feGaussianBlur stdDeviation="7" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neon-glow-yellow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur1"/>
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="lgg-card-clip">
      <rect width="600" height="840" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#lgg-card-clip)">
    <!-- 1. Deep Midnight Base -->
    <rect width="600" height="840" fill="url(#lgg-bg)"/>
    <rect x="10" y="10" width="580" height="820" rx="8" fill="none" stroke="#2D1A54" stroke-width="1.5"/>

    <!-- Subtle Retro Grid on Background -->
    <g stroke="#1F1542" stroke-width="1" opacity="0.35">
      <line x1="0" y1="140" x2="600" y2="140"/>
      <line x1="0" y1="280" x2="600" y2="280"/>
      <line x1="0" y1="420" x2="600" y2="420"/>
      <line x1="0" y1="560" x2="600" y2="560"/>
      <line x1="0" y1="700" x2="600" y2="700"/>
      <line x1="120" y1="0" x2="120" y2="840"/>
      <line x1="240" y1="0" x2="240" y2="840"/>
      <line x1="360" y1="0" x2="360" y2="840"/>
      <line x1="480" y1="0" x2="480" y2="840"/>
    </g>

    <!-- 2. Neon Stars Scattered on Card -->
    <g fill="#FFE600" filter="url(#neon-glow-yellow)" opacity="0.85">
      <!-- 4-point Stars -->
      <path d="M70 120 Q70 132 58 132 Q70 132 70 144 Q70 132 82 132 Q70 132 70 120 Z" transform="scale(0.8) translate(10, 20)"/>
      <path d="M530 110 Q530 122 518 122 Q530 122 530 134 Q530 122 542 122 Q530 122 530 110 Z" transform="scale(0.8) translate(50, 20)"/>
      <path d="M110 380 Q110 390 100 390 Q110 390 110 400 Q110 390 120 390 Q110 390 110 380 Z" transform="scale(0.8) translate(10, 40)"/>
      <path d="M510 360 Q510 370 500 370 Q510 370 510 380 Q510 370 520 370 Q510 370 510 360 Z" transform="scale(0.8) translate(40, 40)"/>
      <path d="M90 620 Q90 630 80 630 Q90 630 90 640 Q90 630 100 630 Q90 630 90 620 Z" transform="scale(0.7) translate(30, 110)"/>
      <path d="M510 640 Q510 650 500 650 Q510 650 510 660 Q510 650 520 650 Q510 650 510 640 Z" transform="scale(0.7) translate(80, 100)"/>
    </g>

    <!-- Cyan Sparkle Crosses -->
    <g stroke="#00F5FF" stroke-width="2" stroke-linecap="round" filter="url(#neon-glow-cyan)" opacity="0.75">
      <line x1="140" y1="210" x2="140" y2="222"/><line x1="134" y1="216" x2="146" y2="216"/>
      <line x1="470" y1="220" x2="470" y2="232"/><line x1="464" y1="226" x2="476" y2="226"/>
      <line x1="160" y1="520" x2="160" y2="532"/><line x1="154" y1="526" x2="166" y2="526"/>
      <line x1="440" y1="530" x2="440" y2="542"/><line x1="434" y1="536" x2="446" y2="536"/>
    </g>

    <!-- 3. Neon Arcade Elements Around Edges -->
    <!-- Top-Left: Neon Cyan Pacman Ghost -->
    <g transform="translate(60, 270)" filter="url(#neon-glow-cyan)">
      <path d="M0 45 C0 10 44 10 44 45 L44 55 L37 48 L30 55 L22 48 L15 55 L7 48 L0 55 Z" 
            fill="none" stroke="#00F5FF" stroke-width="3.5" stroke-linejoin="round"/>
      <circle cx="14" cy="28" r="4.5" fill="#00F5FF"/>
      <circle cx="30" cy="28" r="4.5" fill="#00F5FF"/>
      <circle cx="16" cy="28" r="2" fill="#0A0818"/>
      <circle cx="32" cy="28" r="2" fill="#0A0818"/>
    </g>

    <!-- Top-Right: Neon Cyan D-Pad (+) -->
    <g transform="translate(480, 265)" filter="url(#neon-glow-cyan)">
      <path d="M15 0 L30 0 L30 15 L45 15 L45 30 L30 30 L30 45 L15 45 L15 30 L0 30 L0 15 L15 15 Z" 
            fill="none" stroke="#00F5FF" stroke-width="3" stroke-linejoin="round"/>
    </g>

    <!-- Mid-Left: Neon Magenta Joystick Console -->
    <g transform="translate(65, 410)" filter="url(#neon-glow-pink)">
      <!-- Base Plate -->
      <path d="M0 45 L40 45 L35 25 L5 25 Z" fill="none" stroke="#FF2A85" stroke-width="3"/>
      <!-- Stick -->
      <line x1="20" y1="25" x2="20" y2="10" stroke="#FF2A85" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="20" cy="8" r="8" fill="none" stroke="#FF2A85" stroke-width="3"/>
    </g>

    <!-- Mid-Right: Neon Magenta Pac-Man -->
    <g transform="translate(480, 420)" filter="url(#neon-glow-pink)">
      <path d="M38 18 A 22 22 0 1 0 38 32 L 20 25 Z" 
            fill="none" stroke="#FF2A85" stroke-width="3.5" stroke-linejoin="round"/>
    </g>

    <!-- Bottom-Left: Arcade Button Diamonds / Crosses -->
    <g transform="translate(60, 560)" filter="url(#neon-glow-cyan)">
      <circle cx="16" cy="16" r="14" fill="none" stroke="#00F5FF" stroke-width="2.5"/>
      <polygon points="16,6 23,16 16,26 9,16" fill="none" stroke="#00F5FF" stroke-width="2"/>
      <circle cx="16" cy="48" r="12" fill="none" stroke="#FF2A85" stroke-width="2.5" filter="url(#neon-glow-pink)"/>
      <line x1="10" y1="48" x2="22" y2="48" stroke="#FF2A85" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="16" y1="42" x2="16" y2="54" stroke="#FF2A85" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Bottom-Right: Neon Lightning Bolt -->
    <g transform="translate(495, 540)" filter="url(#neon-glow-pink)">
      <path d="M18 0 L0 32 L15 32 L6 62 L32 24 L16 24 Z" 
            fill="none" stroke="#E040FB" stroke-width="3.5" stroke-linejoin="round"/>
    </g>

    <!-- 4. CENTER RETRO ARCADE CABINET MACHINE (Lower Half) -->
    <g transform="translate(170, 390)">
      <!-- Outer Cabinet Glow Outlines -->
      <!-- Marquee Top -->
      <path d="M20 0 L240 0 L240 35 L20 35 Z" 
            fill="#181136" stroke="#00F5FF" stroke-width="3" filter="url(#neon-glow-cyan)"/>
      <line x1="30" y1="12" x2="120" y2="12" stroke="#FF2A85" stroke-width="2.5" stroke-linecap="round" filter="url(#neon-glow-pink)"/>
      <line x1="140" y1="12" x2="230" y2="12" stroke="#FF2A85" stroke-width="2.5" stroke-linecap="round" filter="url(#neon-glow-pink)"/>
      <line x1="30" y1="22" x2="120" y2="22" stroke="#39FF14" stroke-width="2" stroke-linecap="round"/>
      <line x1="140" y1="22" x2="230" y2="22" stroke="#39FF14" stroke-width="2" stroke-linecap="round"/>

      <!-- Cabinet Bevel Sides -->
      <path d="M20 35 L35 75 L35 220 L225 220 L225 75 L240 35" 
            fill="none" stroke="#00F5FF" stroke-width="3" filter="url(#neon-glow-cyan)"/>

      <!-- Inner Monitor Bezel -->
      <rect x="42" y="55" width="176" height="150" rx="8" 
            fill="#090616" stroke="#FFE600" stroke-width="3" filter="url(#neon-glow-yellow)"/>

      <!-- Arcade Control Panel Shelf -->
      <path d="M15 220 L245 220 L255 255 L5 255 Z" 
            fill="#1E1442" stroke="#00F5FF" stroke-width="3" filter="url(#neon-glow-cyan)"/>

      <!-- Dual Joysticks & Buttons on Panel -->
      <circle cx="50" cy="242" r="5" fill="#E040FB" filter="url(#neon-glow-pink)"/>
      <line x1="50" y1="242" x2="50" y2="232" stroke="#E040FB" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="50" cy="230" r="4" fill="#E040FB" filter="url(#neon-glow-pink)"/>

      <circle cx="80" cy="242" r="5" fill="#E040FB" filter="url(#neon-glow-pink)"/>
      <line x1="80" y1="242" x2="80" y2="232" stroke="#E040FB" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="80" cy="230" r="4" fill="#E040FB" filter="url(#neon-glow-pink)"/>

      <circle cx="180" cy="240" r="4.5" fill="#FFE600" filter="url(#neon-glow-yellow)"/>
      <circle cx="195" cy="238" r="4.5" fill="#FF2A85" filter="url(#neon-glow-pink)"/>
      <circle cx="210" cy="240" r="4.5" fill="#00F5FF" filter="url(#neon-glow-cyan)"/>

      <!-- Lower Coin Base -->
      <path d="M5 255 L255 255 L255 350 L5 350 Z" 
            fill="#120D2C" stroke="#00F5FF" stroke-width="3" filter="url(#neon-glow-cyan)"/>
      <!-- Coin Door Outlines -->
      <rect x="85" y="275" width="90" height="60" rx="4" fill="none" stroke="#2D1A54" stroke-width="2"/>
      <rect x="105" y="290" width="18" height="25" rx="2" fill="none" stroke="#FFE600" stroke-width="1.5"/>
      <line x1="114" y1="294" x2="114" y2="304" stroke="#FFE600" stroke-width="2"/>
      <rect x="137" y="290" width="18" height="25" rx="2" fill="none" stroke="#FFE600" stroke-width="1.5"/>
      <line x1="146" y1="294" x2="146" y2="304" stroke="#FFE600" stroke-width="2"/>
    </g>
  </g>
</svg>
