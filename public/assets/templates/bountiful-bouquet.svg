      .font-cinzel { font-family: 'Cinzel', serif; text-anchor: middle; }
      .font-sans { font-family: 'Inter', -apple-system, sans-serif; text-anchor: middle; }
      .font-serif { font-family: 'Playfair Display', Georgia, serif; text-anchor: middle; }
    </style>
    <linearGradient id="bb-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCFCFA"/>
      <stop offset="60%" stop-color="#F9F9F6"/>
      <stop offset="100%" stop-color="#F4F4EE"/>
    </linearGradient>
    <linearGradient id="bb-petal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCEEE6"/>
      <stop offset="50%" stop-color="#F5CEBC"/>
      <stop offset="100%" stop-color="#DE987C"/>
    </linearGradient>
    <linearGradient id="bb-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0DFB0"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A8811A"/>
    </linearGradient>
    <filter id="bb-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06"/>
    </filter>
  </defs>

