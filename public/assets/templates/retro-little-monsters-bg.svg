    <use href="#rmm-dia" x="20" y="64" fill="#F5B694"/>
    <use href="#rmm-dia" x="20" y="108" fill="#C9B6E8"/>
    <use href="#rmm-dia" x="20" y="152" fill="#1C1A19"/>
    <use href="#rmm-dia" x="20" y="196" fill="#9FD8C0"/>
    <use href="#rmm-dia" x="20" y="240" fill="#F5B694"/>
    <use href="#rmm-dia" x="20" y="284" fill="#C9B6E8"/>
