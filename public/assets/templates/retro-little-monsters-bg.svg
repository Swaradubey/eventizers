    <use href="#rmm-dia" x="26" y="20" fill="#9FD8C0"/>
    <use href="#rmm-dia" x="70" y="20" fill="#F5B694"/>
    <use href="#rmm-dia" x="114" y="20" fill="#C9B6E8"/>
    <use href="#rmm-dia" x="158" y="20" fill="#1C1A19"/>
    <use href="#rmm-dia" x="202" y="20" fill="#9FD8C0"/>
    <use href="#rmm-dia" x="246" y="20" fill="#F5B694"/>
    <use href="#rmm-dia" x="290" y="20" fill="#C9B6E8"/>
    <use href="#rmm-dia" x="334" y="20" fill="#1C1A19"/>
    <use href="#rmm-dia" x="378" y="20" fill="#9FD8C0"/>
    <use href="#rmm-dia" x="422" y="20" fill="#F5B694"/>
    <use href="#rmm-dia" x="466" y="20" fill="#C9B6E8"/>
  </g>
  <!-- ===================== RETRO DIAMOND BORDER (BOTTOM) ===================== -->
  <g>
    <use href="#rmm-dia" x="26" y="680" fill="#C9B6E8"/>
    <use href="#rmm-dia" x="70" y="680" fill="#1C1A19"/>
    <use href="#rmm-dia" x="114" y="680" fill="#9FD8C0"/>
    <use href="#rmm-dia" x="158" y="680" fill="#F5B694"/>
    <use href="#rmm-dia" x="202" y="680" fill="#C9B6E8"/>
    <use href="#rmm-dia" x="246" y="680" fill="#1C1A19"/>
    <use href="#rmm-dia" x="290" y="680" fill="#9FD8C0"/>
    <use href="#rmm-dia" x="334" y="680" fill="#F5B694"/>
    <use href="#rmm-dia" x="378" y="680" fill="#C9B6E8"/>
    <use href="#rmm-dia" x="422" y="680" fill="#1C1A19"/>
    <use href="#rmm-dia" x="466" y="680" fill="#9FD8C0"/>
  </g>
