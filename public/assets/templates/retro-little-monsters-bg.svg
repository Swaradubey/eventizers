    <use href="#rmm-dia" x="480" y="108" fill="#1C1A19"/>
    <use href="#rmm-dia" x="480" y="152" fill="#9FD8C0"/>
    <use href="#rmm-dia" x="480" y="196" fill="#F5B694"/>
    <use href="#rmm-dia" x="480" y="240" fill="#C9B6E8"/>
    <use href="#rmm-dia" x="480" y="284" fill="#1C1A19"/>
    <use href="#rmm-dia" x="480" y="328" fill="#9FD8C0"/>
    <use href="#rmm-dia" x="480" y="372" fill="#F5B694"/>
    <use href="#rmm-dia" x="480" y="416" fill="#C9B6E8"/>
