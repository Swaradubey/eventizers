  <!-- 5. FRANKENSTEIN -->
  <g transform="translate(348,112)">
    <rect x="-7" y="14" width="14" height="10" fill="#7FB069"/>
    <rect x="-16" y="-16" width="32" height="32" rx="5" fill="#9CCB79"/>
    <path d="M-16,-16 h32 v-4 a6,6 0 0 0 -6,-6 h-20 a6,6 0 0 0 -6,6 z" fill="#1C1A19"/>
    <path d="M-16,-13 l4,7 3,-6 4,6 3,-6 4,6 3,-6 4,6 3,-6 4,7" fill="#1C1A19"/>
    <circle cx="-7" cy="-3" r="3.4" fill="#FDFCF7" stroke="#1C1A19" stroke-width="1.4"/>
    <circle cx="7" cy="-3" r="3.4" fill="#FDFCF7" stroke="#1C1A19" stroke-width="1.4"/>
    <circle cx="-7" cy="-3" r="1.4" fill="#1C1A19"/>
    <circle cx="7" cy="-3" r="1.4" fill="#1C1A19"/>
    <path d="M-8,9 h16" stroke="#1C1A19" stroke-width="2" stroke-linecap="round"/>
    <path d="M-4,6 v6 M2,6 v6" stroke="#1C1A19" stroke-width="1.2"/>
    <rect x="-24" y="4" width="9" height="5" rx="2" fill="#8B8B8B"/>
    <rect x="15" y="4" width="9" height="5" rx="2" fill="#8B8B8B"/>
  </g>

  <!-- 6. BAT -->
  <g transform="translate(416,112)">
    <path d="M-30,-6 q10,-14 18,-4 q6,-8 12,0 q6,-8 12,0 q8,-10 18,4 q-8,4 -10,14 q-8,-6 -14,-1 q-6,-6 -12,0 q-6,-5 -14,1 q-2,-10 -10,-14 z" fill="#1C1A19"/>
    <ellipse cx="0" cy="2" rx="9" ry="11" fill="#1C1A19"/>
    <path d="M-7,-7 l-2,-8 6,4 z M7,-7 l2,-8 -6,4 z" fill="#1C1A19"/>
    <circle cx="-3.5" cy="0" r="2" fill="#F5E27A"/>
    <circle cx="3.5" cy="0" r="2" fill="#F5E27A"/>
  </g>

  <!-- Ambient retro sparkles around the monster row -->
  <use href="#rmm-spark" x="46" y="66" fill="#E8B93C" opacity="0.9"/>
  <use href="#rmm-spark" x="454" y="70" fill="#C9B6E8" opacity="0.9"/>
  <use href="#rmm-spark" x="48" y="164" fill="#1C1A19" opacity="0.55"/>
  <use href="#rmm-spark" x="452" y="160" fill="#9FD8C0" opacity="0.95"/>
  <circle cx="130" cy="60" r="2.4" fill="#E8721B" opacity="0.8"/>
  <circle cx="372" cy="58" r="2.4" fill="#9FD8C0" opacity="0.9"/>

  <!-- Small decorative divider under the illustration row -->
  <g opacity="0.75">
    <path d="M170,196 h64 M266,196 h64" stroke="#1C1A19" stroke-width="1.4" stroke-linecap="round"/>
    <use href="#rmm-dia-sm" x="250" y="196" fill="#E8721B"/>
    <use href="#rmm-dia-sm" x="156" y="196" fill="#1C1A19"/>
    <use href="#rmm-dia-sm" x="344" y="196" fill="#1C1A19"/>
  </g>

  <!-- Lower-corner retro confetti diamonds (kept clear of the editable text area) -->
  <use href="#rmm-dia-sm" x="72" y="612" fill="#9FD8C0"/>
  <use href="#rmm-dia-sm" x="428" y="612" fill="#F5B694"/>
  <use href="#rmm-dia-sm" x="96" y="646" fill="#C9B6E8"/>
  <use href="#rmm-dia-sm" x="404" y="646" fill="#1C1A19"/>
  <use href="#rmm-spark" x="132" y="596" fill="#C9B6E8" opacity="0.85"/>
