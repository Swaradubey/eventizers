    <path d="M-2.5,9 h5 l-2.5,3 z" fill="#F5B694"/>
    <path d="M-16,7 l-9,-3 M-16,12 l-9,3 M16,7 l9,-3 M16,12 l9,3" stroke="#FDFCF7" stroke-width="1.4" stroke-linecap="round"/>
