  <!-- ===================================================================== -->
  <!-- TOP ROW OF RETRO MONSTERS: witch, ghost, pumpkin, cat, frank, bat     -->
  <!-- ===================================================================== -->

  <!-- 1. WITCH -->
  <g transform="translate(76,112)">
    <circle cx="0" cy="8" r="17" fill="#9CCB79"/>
    <path d="M-17,6 a17,17 0 0 0 34,0 z" fill="#8CBB6A"/>
    <circle cx="-6" cy="6" r="2.6" fill="#1C1A19"/>
    <circle cx="6" cy="6" r="2.6" fill="#1C1A19"/>
    <path d="M-7,14 q7,7 14,0" stroke="#1C1A19" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M-15,-8 L0,-38 L15,-8 Z" fill="#1C1A19"/>
    <rect x="-16" y="-11" width="32" height="6" fill="#E8721B"/>
    <ellipse cx="0" cy="-6" rx="23" ry="5" fill="#1C1A19"/>
    <circle cx="7" cy="-24" r="3" fill="#F5B694"/>
  </g>

  <!-- 2. GHOST -->
  <g transform="translate(144,112)">
    <path d="M-16,22 L-16,-2 a16,16 0 0 1 32,0 L16,22 l-8,-7 -8,7 -8,-7 -8,7 z" fill="#FDFCF7" stroke="#1C1A19" stroke-width="2.4" stroke-linejoin="round"/>
    <ellipse cx="-6" cy="-2" rx="3" ry="4" fill="#1C1A19"/>
    <ellipse cx="6" cy="-2" rx="3" ry="4" fill="#1C1A19"/>
    <ellipse cx="0" cy="10" rx="4" ry="5" fill="#1C1A19"/>
  </g>

  <!-- 3. JACK-O-LANTERN -->
  <g transform="translate(212,112)">
    <rect x="-3" y="-24" width="6" height="9" rx="2" fill="#4E7A3A"/>
    <ellipse cx="0" cy="0" rx="24" ry="20" fill="#E8721B"/>
    <path d="M-8,-19 q-8,19 0,38 M8,-19 q8,19 0,38" stroke="#C65D10" stroke-width="2" fill="none"/>
    <path d="M-13,-6 l7,-6 4,7 z M13,-6 l-7,-6 -4,7 z" fill="#1C1A19"/>
    <path d="M-11,6 l4,5 3,-4 3,4 3,-4 3,4 4,-5 -4,7 z" fill="#1C1A19"/>
  </g>

  <!-- 4. BLACK CAT -->
  <g transform="translate(280,112)">
    <path d="M-17,-8 L-15,-25 L-3,-16 Z M17,-8 L15,-25 L3,-16 Z" fill="#1C1A19"/>
    <circle cx="0" cy="3" r="18" fill="#1C1A19"/>
    <ellipse cx="-6.5" cy="0" rx="3.6" ry="4.6" fill="#F5E27A"/>
    <ellipse cx="6.5" cy="0" rx="3.6" ry="4.6" fill="#F5E27A"/>
    <circle cx="-6.5" cy="0" r="1.4" fill="#1C1A19"/>
