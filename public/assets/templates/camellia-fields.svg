<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&amp;family=Inter:wght@400;500;600;700&amp;family=Dancing+Script:wght@600;700&amp;display=swap');
      .font-serif { font-family: 'Playfair Display', Georgia, serif; text-anchor: middle; }
      .font-sans { font-family: 'Inter', -apple-system, sans-serif; text-anchor: middle; }
      .font-script { font-family: 'Dancing Script', cursive; text-anchor: middle; }
    </style>
    <linearGradient id="cam-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCF8F7"/>
      <stop offset="50%" stop-color="#F9F2F0"/>
      <stop offset="100%" stop-color="#F3E9E7"/>
    </linearGradient>
    <linearGradient id="cam-petal-pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCD5DA"/>
      <stop offset="50%" stop-color="#EAA0A9"/>
      <stop offset="100%" stop-color="#D47380"/>
    </linearGradient>
    <linearGradient id="cam-petal-deep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E58490"/>
      <stop offset="50%" stop-color="#C55666"/>
      <stop offset="100%" stop-color="#9C2C3C"/>
    </linearGradient>
    <linearGradient id="cam-leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#557C60"/>
      <stop offset="50%" stop-color="#365B40"/>
      <stop offset="100%" stop-color="#1E3825"/>
    </linearGradient>
    <filter id="cam-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="600" height="800" rx="16" fill="url(#cam-bg)" />
  
  <rect x="22" y="22" width="556" height="756" rx="10" fill="none" stroke="#E8DCDA" stroke-width="1.2" />
  <rect x="28" y="28" width="544" height="744" rx="8" fill="none" stroke="#D8B5BA" stroke-width="0.7" stroke-dasharray="6,4" opacity="0.5" />

  <!-- Perimeter Camellia Botanical Frame -->
  <g id="top-border-camellias" filter="url(#cam-shadow)">
    <g transform="translate(70, 50)">
      <path d="M 0 0 C -25 15 -35 45 -15 65 C 10 75 35 45 20 20 Z" fill="url(#cam-leaf)" opacity="0.9" />
      <path d="M 15 -10 C -5 -30 -35 -20 -30 10 C -25 30 5 15 15 -10 Z" fill="url(#cam-leaf)" opacity="0.85" />
      <circle cx="0" cy="25" r="28" fill="url(#cam-petal-pink)" />
      <circle cx="-6" cy="20" r="20" fill="#FCE4E8" opacity="0.9" />
      <circle cx="6" cy="24" r="18" fill="url(#cam-petal-pink)" opacity="0.85" />
      <circle cx="0" cy="25" r="12" fill="url(#cam-petal-deep)" opacity="0.7" />
      <circle cx="0" cy="25" r="5" fill="#F9D776" />
    </g>

    <g transform="translate(300, 45)">
      <ellipse cx="-40" cy="8" rx="22" ry="10" transform="rotate(-15 -40 8)" fill="url(#cam-leaf)" />
      <ellipse cx="40" cy="8" rx="22" ry="10" transform="rotate(15 40 8)" fill="url(#cam-leaf)" />
      <circle cx="0" cy="18" r="32" fill="url(#cam-petal-pink)" />
      <circle cx="-8" cy="14" r="24" fill="#FCEBED" opacity="0.9" />
      <circle cx="8" cy="16" r="22" fill="url(#cam-petal-pink)" opacity="0.85" />
      <circle cx="0" cy="18" r="14" fill="url(#cam-petal-deep)" opacity="0.75" />
      <circle cx="0" cy="18" r="6" fill="#F9D776" />
    </g>

    <g transform="translate(530, 50)">
      <path d="M 0 0 C 25 15 35 45 15 65 C -10 75 -35 45 -20 20 Z" fill="url(#cam-leaf)" opacity="0.9" />
      <path d="M -15 -10 C 5 -30 35 -20 30 10 C 25 30 -5 15 -15 -10 Z" fill="url(#cam-leaf)" opacity="0.85" />
      <circle cx="0" cy="25" r="28" fill="url(#cam-petal-pink)" />
      <circle cx="6" cy="20" r="20" fill="#FCE4E8" opacity="0.9" />
      <circle cx="-6" cy="24" r="18" fill="url(#cam-petal-pink)" opacity="0.85" />
      <circle cx="0" cy="25" r="12" fill="url(#cam-petal-deep)" opacity="0.7" />
      <circle cx="0" cy="25" r="5" fill="#F9D776" />
    </g>

    <g transform="translate(185, 38)">
      <ellipse cx="0" cy="0" rx="14" ry="7" transform="rotate(-25)" fill="url(#cam-leaf)" />
      <circle cx="8" cy="4" r="11" fill="url(#cam-petal-pink)" />
      <circle cx="8" cy="4" r="3" fill="#F9D776" />
    </g>
    <g transform="translate(415, 38)">
      <ellipse cx="0" cy="0" rx="14" ry="7" transform="rotate(25)" fill="url(#cam-leaf)" />
      <circle cx="-8" cy="4" r="11" fill="url(#cam-petal-pink)" />
      <circle cx="-8" cy="4" r="3" fill="#F9D776" />
    </g>
  </g>

  <g id="left-border-camellias" filter="url(#cam-shadow)">
    <g transform="translate(35, 260)">
      <ellipse cx="8" cy="-15" rx="18" ry="8" transform="rotate(-65 8 -15)" fill="url(#cam-leaf)" />
      <circle cx="15" cy="0" r="20" fill="url(#cam-petal-pink)" />
      <circle cx="12" cy="0" r="12" fill="#FCE4E8" opacity="0.9" />
      <circle cx="15" cy="0" r="5" fill="#F9D776" />
    </g>
    <g transform="translate(35, 480)">
      <ellipse cx="8" cy="15" rx="18" ry="8" transform="rotate(65 8 15)" fill="url(#cam-leaf)" />
      <circle cx="15" cy="0" r="20" fill="url(#cam-petal-pink)" />
      <circle cx="12" cy="0" r="12" fill="#FCE4E8" opacity="0.9" />
      <circle cx="15" cy="0" r="5" fill="#F9D776" />
    </g>
  </g>

  <g id="right-border-camellias" filter="url(#cam-shadow)">
    <g transform="translate(565, 260)">
      <ellipse cx="-8" cy="-15" rx="18" ry="8" transform="rotate(65 -8 -15)" fill="url(#cam-leaf)" />
      <circle cx="-15" cy="0" r="20" fill="url(#cam-petal-pink)" />
      <circle cx="-12" cy="0" r="12" fill="#FCE4E8" opacity="0.9" />
      <circle cx="-15" cy="0" r="5" fill="#F9D776" />
    </g>
    <g transform="translate(565, 480)">
      <ellipse cx="-8" cy="15" rx="18" ry="8" transform="rotate(-65 -8 15)" fill="url(#cam-leaf)" />
      <circle cx="-15" cy="0" r="20" fill="url(#cam-petal-pink)" />
      <circle cx="-12" cy="0" r="12" fill="#FCE4E8" opacity="0.9" />
      <circle cx="-15" cy="0" r="5" fill="#F9D776" />
    </g>
  </g>

  <g id="bottom-border-camellias" filter="url(#cam-shadow)">
    <g transform="translate(70, 750)">
      <path d="M 0 0 C -25 -15 -35 -45 -15 -65 C 10 -75 35 -45 20 -20 Z" fill="url(#cam-leaf)" opacity="0.9" />
      <circle cx="0" cy="-25" r="28" fill="url(#cam-petal-pink)" />
      <circle cx="-6" cy="-20" r="20" fill="#FCE4E8" opacity="0.9" />
      <circle cx="0" cy="-25" r="12" fill="url(#cam-petal-deep)" opacity="0.7" />
      <circle cx="0" cy="-25" r="5" fill="#F9D776" />
    </g>
    <g transform="translate(300, 755)">
      <ellipse cx="-40" cy="-8" rx="22" ry="10" transform="rotate(15 -40 -8)" fill="url(#cam-leaf)" />
      <ellipse cx="40" cy="-8" rx="22" ry="10" transform="rotate(-15 40 -8)" fill="url(#cam-leaf)" />
      <circle cx="0" cy="-18" r="32" fill="url(#cam-petal-pink)" />
      <circle cx="-8" cy="-14" r="24" fill="#FCEBED" opacity="0.9" />
      <circle cx="8" cy="-16" r="22" fill="url(#cam-petal-pink)" opacity="0.85" />
      <circle cx="0" cy="-18" r="14" fill="url(#cam-petal-deep)" opacity="0.75" />
      <circle cx="0" cy="-18" r="6" fill="#F9D776" />
    </g>
    <g transform="translate(530, 750)">
      <path d="M 0 0 C 25 -15 35 -45 15 -65 C -10 -75 -35 -45 -20 -20 Z" fill="url(#cam-leaf)" opacity="0.9" />
      <circle cx="0" cy="-25" r="28" fill="url(#cam-petal-pink)" />
      <circle cx="6" cy="-20" r="20" fill="#FCE4E8" opacity="0.9" />
      <circle cx="0" cy="-25" r="12" fill="url(#cam-petal-deep)" opacity="0.7" />
      <circle cx="0" cy="-25" r="5" fill="#F9D776" />
    </g>
  </g>

  <!-- Typography Content -->
  <g>
    <!-- Greeting -->
    <text x="300" y="210" class="font-sans" font-size="11" font-weight="600" fill="#8C5C64" letter-spacing="3">PLEASE JOIN US TO CELEBRATE</text>

    <!-- Honoree Celebrant Name -->
    <text x="300" y="280" class="font-serif" font-size="44" font-weight="700" fill="#421E25" letter-spacing="1">Cassidy Anderson</text>

    <!-- Subtitle -->
    <text x="300" y="325" class="font-sans" font-size="12.5" font-weight="500" fill="#7C4B54" letter-spacing="1.5">AND THE UPCOMING ARRIVAL OF HER BABY GIRL</text>

    <!-- Date & Time -->
    <text x="300" y="415" class="font-serif" font-size="18" font-weight="600" fill="#3D1C23" letter-spacing="1">SATURDAY, JUNE 20TH</text>
    <text x="300" y="445" class="font-sans" font-size="13" font-weight="500" fill="#6B3F47" letter-spacing="1">AT 11:30 IN THE MORNING</text>

    <!-- Venue & Address -->
    <text x="300" y="525" class="font-serif" font-size="17" font-weight="700" fill="#59252F" letter-spacing="0.8">The Rosewood Manor Garden</text>
    <text x="300" y="552" class="font-sans" font-size="12" font-weight="400" fill="#7D4B54" letter-spacing="0.5">324 Camellia Drive, Charleston, SC</text>

    <!-- RSVP & Registry -->
    <text x="300" y="625" class="font-sans" font-size="11" font-weight="500" fill="#8A4854" letter-spacing="0.5">RSVP to Chloe at 555-0167 • Registered at Pottery Barn Kids</text>
  </g>
</svg>
