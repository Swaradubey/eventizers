<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="100%" height="100%">
  <defs>
    <!-- Dark vertical wood plank texture -->
    <pattern id="cc-planks" width="56" height="140" patternUnits="userSpaceOnUse">
      <rect width="56" height="140" fill="#1A1619"/>
      <rect x="52" width="4" height="140" fill="#0B090C"/>
      <path d="M13,0 v140 M36,0 v140" stroke="#241E23" stroke-width="1" opacity="0.75"/>
      <ellipse cx="24" cy="70" rx="6" ry="30" fill="#221C22" opacity="0.55"/>
      <ellipse cx="46" cy="24" rx="3" ry="14" fill="#121014" opacity="0.7"/>
    </pattern>
    <!-- Soft vignette for the black card -->
    <radialGradient id="cc-vignette" cx="50%" cy="46%" r="72%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <!-- Icing drip used on the cake tiers -->
    <path id="cc-drip" d="M0,0 q10,0 14,16 q3,14 14,14 q11,0 14,-14 q4,-16 14,-16 q10,0 14,14 q4,16 15,16 q11,0 14,-16 q3,-14 13,-14 l0,-10 -112,0 z"/>
  </defs>

  <!-- Textured black wood-plank card -->
  <rect width="500" height="700" fill="url(#cc-planks)"/>
  <rect width="500" height="700" fill="url(#cc-vignette)"/>

  <!-- Faint orange keyline around the card face -->
  <rect x="16" y="16" width="468" height="668" rx="6" fill="none" stroke="#E8721B" stroke-width="1.4" stroke-opacity="0.45"/>
  <rect x="24" y="24" width="452" height="652" rx="4" fill="none" stroke="#E8721B" stroke-width="0.6" stroke-opacity="0.28"/>

  <!-- Hanging spider (top-right, clear of editable text) -->
  <g stroke="#F3ECDD" stroke-width="1.1" fill="none" opacity="0.75">
    <path d="M430,24 v58"/>
  </g>
  <g transform="translate(430,96)">
    <ellipse cx="0" cy="0" rx="9" ry="7.5" fill="#0B090C" stroke="#F3ECDD" stroke-width="1.1"/>
    <circle cx="-8" cy="-6" r="4" fill="#0B090C" stroke="#F3ECDD" stroke-width="1"/>
    <path d="M-9,-2 l-10,-6 M-9,2 l-11,2 M-8,5 l-9,7 M9,-2 l10,-6 M9,2 l11,2 M8,5 l9,7" stroke="#0B090C" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Scattered embers / confetti -->
  <g fill="#E8721B" opacity="0.7">
    <circle cx="62" cy="300" r="2.6"/>
    <circle cx="452" cy="330" r="2"/>
    <circle cx="86" cy="238" r="1.8"/>
    <circle cx="418" cy="210" r="2.4"/>
  </g>
  <g fill="#F3ECDD" opacity="0.55">
    <path d="M446,262 q1,-6 8,0 q-7,1 -8,6 q-1,-5 -8,-6 q7,-1 8,0 z"/>
    <path d="M58,352 q1,-6 8,0 q-7,1 -8,6 q-1,-5 -8,-6 q7,-1 8,0 z"/>
  </g>

  <!-- Ground shadow beneath the cake -->
  <ellipse cx="150" cy="576" rx="104" ry="12" fill="#000000" opacity="0.45"/>

  <!-- ===================================================================== -->
  <!-- 3-TIER HAUNTED HALLOWEEN CAKE: skull toppers, spiderweb frosting,     -->
  <!-- pumpkin tier and dripping glaze                                       -->
  <!-- ===================================================================== -->
  <g transform="translate(150,560)">
    <!-- Cake stand -->
    <ellipse cx="0" cy="0" rx="94" ry="15" fill="#2A2530" stroke="#E7C877" stroke-width="2"/>
    <path d="M-94,0 q94,26 188,0" fill="#17131C" stroke="#E7C877" stroke-width="1.4"/>

    <!-- BOTTOM TIER: black with white spiderweb frosting -->
    <ellipse cx="0" cy="-84" rx="72" ry="14" fill="#17131F"/>
    <rect x="-72" y="-84" width="144" height="84" fill="#12101A"/>
    <path d="M-72,-84 q72,20 144,0" fill="none" stroke="#241F30" stroke-width="2"/>
    <!-- Spiderweb piping on the front of the bottom tier -->
    <g stroke="#F3ECDD" stroke-width="1.3" fill="none" opacity="0.9">
      <path d="M0,-76 L0,-6 M0,-76 L-52,-40 M0,-76 L52,-40 M0,-76 L-40,-8 M0,-76 L40,-8"/>
      <path d="M0,-56 q-16,-8 -30,-2 M0,-56 q16,-8 30,-2"/>
      <path d="M0,-38 q-24,-10 -44,-2 M0,-38 q24,-10 44,-2"/>
      <path d="M0,-20 q-30,-8 -54,0 M0,-20 q30,-8 54,0"/>
    </g>
    <!-- White icing drip collar on the bottom tier -->
    <g transform="translate(-65,-84) scale(1.17,0.62)">
      <use href="#cc-drip" fill="#F3ECDD"/>
    </g>

    <!-- MIDDLE TIER: orange pumpkin tier -->
    <ellipse cx="0" cy="-150" rx="52" ry="11" fill="#F08A31"/>
    <rect x="-52" y="-150" width="104" height="66" fill="#E8721B"/>
    <path d="M-30,-148 q-8,34 0,64 M0,-149 q-9,34 0,65 M30,-148 q8,34 0,64" stroke="#C65D10" stroke-width="2.2" fill="none"/>
    <path d="M-52,-150 q52,16 104,0" fill="none" stroke="#FFB067" stroke-width="1.6" opacity="0.7"/>
    <!-- Tiny jack-o'-lantern faces on the pumpkin tier -->
    <g fill="#12101A">
      <path d="M-22,-118 l7,-6 3,6 z M-4,-118 l-7,-6 -3,6 z"/>
      <path d="M-24,-108 l4,4 3,-3 3,3 3,-3 3,3 4,-4 -4,6 z"/>
      <path d="M13,-118 l7,-6 3,6 z M-1,-118 l-5,-4 -2,5 z" transform="translate(6,0)"/>
    </g>

    <!-- TOP TIER: cream with dark dripping glaze -->
    <ellipse cx="0" cy="-196" rx="34" ry="9" fill="#FBF6EA"/>
    <rect x="-34" y="-196" width="68" height="46" fill="#F1E9DA"/>
    <g transform="translate(-34,-196) scale(0.61,0.5)">
      <use href="#cc-drip" fill="#2C2436"/>
    </g>
    <path d="M-34,-200 q34,10 68,0" fill="none" stroke="#D9CFBB" stroke-width="1.4"/>

    <!-- Skull toppers on sticks -->
    <g stroke="#C9A227" stroke-width="2">
      <path d="M-14,-206 v-16 M16,-206 v-20"/>
    </g>
    <g transform="translate(-14,-232)">
      <path d="M0,-12 a13,12 0 0 1 13,12 q0,7 -5,9 l0,4 -16,0 0,-4 q-5,-2 -5,-9 a13,12 0 0 1 13,-12 z" fill="#FBF6EA" stroke="#C9BFAC" stroke-width="1.2"/>
      <ellipse cx="-5" cy="-1" rx="3.6" ry="4.2" fill="#12101A"/>
      <ellipse cx="5" cy="-1" rx="3.6" ry="4.2" fill="#12101A"/>
      <path d="M-2,6 h4 M-6,11 v3 M-2,11 v3 M2,11 v3 M6,11 v3" stroke="#12101A" stroke-width="1.4"/>
    </g>
    <g transform="translate(16,-240)">
      <path d="M0,-12 a13,12 0 0 1 13,12 q0,7 -5,9 l0,4 -16,0 0,-4 q-5,-2 -5,-9 a13,12 0 0 1 13,-12 z" fill="#FBF6EA" stroke="#C9BFAC" stroke-width="1.2"/>
      <ellipse cx="-5" cy="-1" rx="3.6" ry="4.2" fill="#12101A"/>
      <ellipse cx="5" cy="-1" rx="3.6" ry="4.2" fill="#12101A"/>
      <path d="M-2,6 h4 M-6,11 v3 M-2,11 v3 M2,11 v3 M6,11 v3" stroke="#12101A" stroke-width="1.4"/>
    </g>
    <!-- Candles standing on the shoulders of the pumpkin tier -->
    <g>
      <rect x="-50" y="-178" width="6" height="28" fill="#F1E9DA" stroke="#C9BFAC" stroke-width="1"/>
      <path d="M-47,-186 q-5,7 0,11 q5,-4 0,-11 z" fill="#F5A623"/>
      <rect x="44" y="-184" width="6" height="34" fill="#F1E9DA" stroke="#C9BFAC" stroke-width="1"/>
      <path d="M47,-192 q-5,7 0,11 q5,-4 0,-11 z" fill="#F5A623"/>
    </g>
  </g>
</svg>
