<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&amp;family=Inter:wght@400;600;700&amp;display=swap');
      .txt-pink-bold { font-family: 'Montserrat', sans-serif; font-weight: 800; fill: #EC4899; letter-spacing: 1.5px; }
      .txt-sub-lavender { font-family: 'Inter', sans-serif; font-weight: 600; fill: #A78BFA; letter-spacing: 2px; }
      .txt-white { font-family: 'Inter', sans-serif; font-weight: 700; fill: #F8FAFC; letter-spacing: 1.5px; }
      .txt-gray { font-family: 'Inter', sans-serif; font-weight: 600; fill: #94A3B8; letter-spacing: 1.5px; }
    </style>

    <!-- 3D Bubble Paint Gradients -->
    <linearGradient id="bubble-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="40%" stop-color="#EC4899" />
      <stop offset="70%" stop-color="#C026D3" />
      <stop offset="100%" stop-color="#7E22CE" />
    </linearGradient>
    <linearGradient id="bubble-grad-2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="50%" stop-color="#DB2777" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>

    <!-- Specular highlight filter -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Midnight Background -->
  <rect width="800" height="500" rx="16" fill="#14131A" />

  <!-- Subtle ambient purple back-glow behind bubble text -->
  <circle cx="260" cy="250" r="180" fill="#9333EA" opacity="0.15" filter="url(#soft-glow)" />
  <circle cx="180" cy="320" r="140" fill="#EC4899" opacity="0.12" filter="url(#soft-glow)" />

  <!-- LEFT SIDE: 3D Bubbly "let's party" Painted Graffiti Typography -->
  <g transform="translate(40, 60)">
    <!-- Back / 3D Shadow Layers for "let's" -->
    <g fill="#4A0E4E" opacity="0.6" transform="translate(10, 14)">
      <!-- L -->
      <path d="M 60 40 C 40 40 30 65 30 110 C 30 155 45 170 85 170 C 110 170 120 155 110 145 C 95 140 70 145 68 120 L 68 60 C 68 45 60 40 60 40 Z"/>
      <!-- E -->
      <ellipse cx="150" cy="120" rx="36" ry="42"/>
      <!-- T -->
      <path d="M 200 65 L 260 65 M 230 45 L 230 165 C 230 175 250 175 255 165"/>
      <!-- ' -->
      <ellipse cx="275" cy="55" rx="10" ry="16"/>
      <!-- S -->
      <path d="M 345 80 C 330 60 280 65 295 105 C 310 145 350 135 340 165 C 330 190 280 175 285 155"/>
    </g>

    <!-- Main Front 3D Lettering "let's" -->
    <!-- 'l' -->
    <path d="M 75 35 C 50 35 38 65 38 105 C 38 150 55 165 95 165 C 118 165 125 150 115 140 C 95 135 76 138 74 115 L 74 55 C 74 42 66 35 75 35 Z" fill="url(#bubble-grad-1)" stroke="#FDF2F8" stroke-width="2"/>
    <!-- 'e' -->
    <path d="M 125 120 C 125 85 145 70 172 70 C 198 70 212 88 210 115 L 148 115 C 148 145 165 155 185 152 C 198 150 205 142 208 135 C 215 142 210 165 185 168 C 145 170 125 155 125 120 Z M 150 100 L 190 100 C 188 85 178 82 170 82 C 160 82 152 88 150 100 Z" fill="url(#bubble-grad-2)" stroke="#FDF2F8" stroke-width="2"/>
    <!-- 't' -->
    <path d="M 215 72 L 265 72 L 265 88 L 248 88 L 248 140 C 248 155 258 158 268 152 C 270 162 265 170 252 170 C 232 170 228 155 228 138 L 228 88 L 215 88 Z" fill="url(#bubble-grad-1)" stroke="#FDF2F8" stroke-width="2"/>
    <!-- apostrophe -->
    <ellipse cx="282" cy="55" rx="9" ry="14" fill="url(#bubble-grad-2)" stroke="#FDF2F8" stroke-width="1.5" transform="rotate(15, 282, 55)"/>
    <!-- 's' -->
    <path d="M 345 82 C 330 65 295 68 295 95 C 295 120 348 118 345 148 C 342 172 305 172 290 155 C 292 142 305 145 312 152 C 322 158 332 155 332 145 C 332 125 278 125 280 95 C 282 72 315 55 345 68 Z" fill="url(#bubble-grad-1)" stroke="#FDF2F8" stroke-width="2"/>

    <!-- Glossy Highlights on "let's" -->
    <ellipse cx="62" cy="58" rx="5" ry="18" fill="#FFF" opacity="0.8" transform="rotate(-10, 62, 58)"/>
    <ellipse cx="170" cy="80" rx="14" ry="4" fill="#FFF" opacity="0.75"/>
    <ellipse cx="240" cy="80" rx="4" ry="12" fill="#FFF" opacity="0.75"/>
    <ellipse cx="318" cy="74" rx="10" ry="4" fill="#FFF" opacity="0.75"/>

    <!-- "party" (Bottom Line of Bubbly Graffiti) -->
    <g transform="translate(15, 125)">
      <!-- 3D Shadow -->
      <g fill="#4A0E4E" opacity="0.5" transform="translate(8, 12)">
        <ellipse cx="55" cy="110" rx="35" ry="45"/>
        <ellipse cx="140" cy="110" rx="35" ry="40"/>
        <path d="M 195 80 L 250 80 M 215 80 L 215 160"/>
        <path d="M 260 70 L 285 70 L 285 160"/>
        <path d="M 330 70 L 355 120 L 380 70 M 355 120 L 340 180"/>
      </g>

      <!-- 'p' -->
      <path d="M 45 70 L 68 70 L 68 85 C 75 75 90 70 102 75 C 122 82 128 105 125 125 C 122 150 105 165 85 162 C 72 160 66 150 64 145 L 64 195 L 45 195 Z M 68 118 C 68 135 80 145 92 145 C 105 145 110 132 110 120 C 110 105 102 92 90 92 C 78 92 68 102 68 118 Z" fill="url(#bubble-grad-2)" stroke="#FDF2F8" stroke-width="2"/>

      <!-- 'a' -->
      <path d="M 140 75 C 165 72 185 85 188 110 L 188 160 L 170 160 L 170 148 C 162 158 150 165 135 162 C 115 160 105 145 108 128 C 110 110 128 100 155 102 L 170 102 L 170 98 C 170 88 160 84 148 85 C 135 86 128 92 125 98 L 115 88 C 120 78 130 75 140 75 Z M 170 118 L 158 118 C 140 118 130 125 130 135 C 130 145 140 150 150 148 C 162 146 170 136 170 125 Z" fill="url(#bubble-grad-1)" stroke="#FDF2F8" stroke-width="2"/>

      <!-- 'r' -->
      <path d="M 200 78 L 220 78 L 220 95 C 228 82 242 75 255 78 L 250 98 C 238 95 224 100 220 115 L 220 160 L 200 160 Z" fill="url(#bubble-grad-2)" stroke="#FDF2F8" stroke-width="2"/>

      <!-- 't' -->
      <path d="M 255 60 L 275 60 L 275 78 L 295 78 L 295 94 L 275 94 L 275 138 C 275 148 282 150 292 145 C 294 154 288 162 278 162 C 262 162 255 152 255 135 L 255 94 L 245 94 L 245 78 L 255 78 Z" fill="url(#bubble-grad-1)" stroke="#FDF2F8" stroke-width="2"/>

      <!-- 'y' -->
      <path d="M 298 78 L 320 78 L 338 125 L 358 78 L 380 78 L 350 148 C 340 172 328 190 305 188 C 298 186 292 180 292 172 C 292 164 300 165 308 165 C 318 165 325 158 330 145 L 332 138 Z" fill="url(#bubble-grad-2)" stroke="#FDF2F8" stroke-width="2"/>

      <!-- Glossy Highlights on "party" -->
      <ellipse cx="98" cy="95" rx="12" ry="5" fill="#FFF" opacity="0.8"/>
      <ellipse cx="54" cy="98" rx="4" ry="14" fill="#FFF" opacity="0.75" transform="rotate(-15, 54, 98)"/>
      <ellipse cx="155" cy="85" rx="14" ry="4" fill="#FFF" opacity="0.75"/>
      <ellipse cx="235" cy="88" rx="6" ry="3" fill="#FFF" opacity="0.75"/>
      <ellipse cx="266" cy="70" rx="3" ry="8" fill="#FFF" opacity="0.75"/>
      <ellipse cx="310" cy="90" rx="4" ry="10" fill="#FFF" opacity="0.75" transform="rotate(20, 310, 90)"/>
    </g>
  </g>

  <!-- RIGHT SIDE: Clean Modern Event Invitation Typography -->
  <g transform="translate(480, 70)">
    <!-- Subheader -->
    <text x="0" y="70" class="txt-sub-lavender" font-size="12">PLEASE JOIN US TO</text>
    <text x="0" y="92" class="txt-sub-lavender" font-size="12">CELEBRATE</text>

    <!-- Name & Age -->
    <text x="0" y="145" class="txt-pink-bold" font-size="24">ALEXANDER&apos;S</text>
    <text x="0" y="175" class="txt-pink-bold" font-size="24">8TH BIRTHDAY</text>

    <!-- Date & Time -->
    <text x="0" y="240" class="txt-white" font-size="14">SUNDAY, OCTOBER 12TH</text>
    <text x="0" y="265" class="txt-white" font-size="14">AT 2 PM</text>

    <!-- Venue Location -->
    <text x="0" y="325" class="txt-gray" font-size="13">ZERO GRAVITY</text>
    <text x="0" y="348" class="txt-gray" font-size="13">ADVENTURE PARK</text>
  </g>

  <!-- BOTTOM RIGHT: "Viewed" pill badge -->
  <g transform="translate(640, 430)">
    <rect width="110" height="38" rx="19" fill="#FFFFFF" opacity="0.95" />
    <circle cx="28" cy="19" r="4" fill="#10B981" />
    <text x="44" y="24" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#1E293B">Viewed</text>
  </g>
</svg>
