<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="100%" height="100%">
  <defs>
    <linearGradient id="dd-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8C1116"/>
      <stop offset="52%" stop-color="#6C0C11"/>
      <stop offset="100%" stop-color="#43060A"/>
    </linearGradient>
    <radialGradient id="dd-stage" cx="50%" cy="44%" r="58%">
      <stop offset="0%" stop-color="#A81C22" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#A81C22" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dd-flame" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE0A8" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#FFB347" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF8C2A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dd-vignette" cx="50%" cy="48%" r="70%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>
    <radialGradient id="dd-paper" cx="50%" cy="44%" r="62%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="70%" stop-color="#F8F2E6"/>
      <stop offset="100%" stop-color="#EDE3D2"/>
    </radialGradient>
    <g id="dd-candle">
      <rect x="-7" y="0" width="14" height="96" rx="5" fill="#F4EADA"/>
      <rect x="-7" y="0" width="5" height="96" rx="3" fill="#DCCFB8"/>
      <path d="M0,-4 C6,-14 4,-24 0,-30 C-4,-24 -6,-14 0,-4 Z" fill="#FFC24A"/>
      <path d="M0,-8 C3,-14 2,-20 0,-24 C-2,-20 -3,-14 0,-8 Z" fill="#FFF0C2"/>
      <rect x="-2.5" y="-4" width="5" height="8" fill="#6B5B45"/>
    </g>
  </defs>

  <!-- Gothic red stage -->
  <rect width="500" height="700" fill="url(#dd-red)"/>
  <rect width="500" height="700" fill="url(#dd-stage)"/>

  <!-- Rose silhouettes in the corners -->
  <g fill="#3C050A" opacity="0.85">
    <path d="M0,700 L0,560 C40,575 70,610 78,655 C86,610 118,585 160,600 C130,625 112,660 108,700 Z"/>
    <path d="M500,700 L500,545 C455,560 425,600 418,650 C404,605 372,580 330,598 C362,620 382,660 386,700 Z"/>
    <circle cx="66" cy="622" r="26"/>
    <circle cx="432" cy="614" r="30"/>
    <circle cx="118" cy="672" r="20"/>
    <circle cx="384" cy="676" r="22"/>
  </g>
  <g fill="#5E0A10" opacity="0.9">
    <circle cx="66" cy="622" r="14"/>
    <circle cx="432" cy="614" r="16"/>
    <circle cx="118" cy="672" r="11"/>
    <circle cx="384" cy="676" r="12"/>
  </g>

  <!-- Candlesticks: warm glow behind the doily -->
  <circle cx="52" cy="250" r="120" fill="url(#dd-flame)"/>
  <circle cx="452" cy="228" r="130" fill="url(#dd-flame)"/>
  <circle cx="34" cy="430" r="95" fill="url(#dd-flame)"/>
  <circle cx="470" cy="452" r="95" fill="url(#dd-flame)"/>

  <g opacity="0.95">
    <g transform="translate(52,250)">
      <rect x="-9" y="70" width="18" height="34" rx="4" fill="#B99B62"/>
      <rect x="-20" y="98" width="40" height="10" rx="4" fill="#8E7444"/>
      <use href="#dd-candle"/>
      <use href="#dd-candle" transform="translate(28,26) scale(0.82)"/>
      <use href="#dd-candle" transform="translate(-26,40) scale(0.72)"/>
    </g>
    <g transform="translate(452,228)">
      <rect x="-9" y="70" width="18" height="34" rx="4" fill="#B99B62"/>
      <rect x="-20" y="98" width="40" height="10" rx="4" fill="#8E7444"/>
      <use href="#dd-candle"/>
      <use href="#dd-candle" transform="translate(-30,30) scale(0.8)"/>
      <use href="#dd-candle" transform="translate(26,44) scale(0.7)"/>
    </g>
    <g transform="translate(34,430) scale(0.8)">
      <use href="#dd-candle"/>
      <use href="#dd-candle" transform="translate(26,34) scale(0.78)"/>
    </g>
    <g transform="translate(470,452) scale(0.8)">
      <use href="#dd-candle"/>
      <use href="#dd-candle" transform="translate(-26,34) scale(0.78)"/>
    </g>
  </g>

  <!-- Ornate white lace doily -->
  <g transform="translate(250,338)">
    <!-- scalloped lace petals -->
    <circle r="176" fill="none" stroke="#FFFDF7" stroke-width="34" stroke-linecap="round" stroke-dasharray="0.1 27.9" opacity="0.98"/>
    <circle r="176" fill="none" stroke="#EFE6D6" stroke-width="34" stroke-linecap="round" stroke-dasharray="13.8 14.1" opacity="0.35"/>
    <!-- outer stitched rings -->
    <circle r="157" fill="none" stroke="#FFFDF7" stroke-width="2.5"/>
    <circle r="150" fill="none" stroke="#FFFDF7" stroke-width="7" stroke-dasharray="0.1 11" stroke-linecap="round"/>
    <circle r="143" fill="none" stroke="#E7DCC8" stroke-width="1.6"/>
    <!-- lace radial spokes -->
    <circle r="134" fill="none" stroke="#FFFDF7" stroke-width="16" stroke-dasharray="1.4 9.4" opacity="0.85"/>
    <!-- paper disc -->
    <circle r="126" fill="url(#dd-paper)"/>
    <circle r="118" fill="none" stroke="#C9B99A" stroke-width="1.2" stroke-dasharray="3 6"/>
    <circle r="110" fill="none" stroke="#D8CCB4" stroke-width="1"/>
    <!-- inner lace rosette -->
    <circle r="103" fill="none" stroke="#C4B092" stroke-width="5" stroke-dasharray="0.1 9" stroke-linecap="round" opacity="0.7"/>
    <!-- tiny heart motifs around the rim -->
    <g fill="#8C1116" opacity="0.75">
      <path d="M0,-92 c-4,-6 -12,-4 -12,3 c0,6 8,11 12,15 c4,-4 12,-9 12,-15 c0,-7 -8,-9 -12,-3 z"/>
      <path d="M0,-92 c-4,-6 -12,-4 -12,3 c0,6 8,11 12,15 c4,-4 12,-9 12,-15 c0,-7 -8,-9 -12,-3 z" transform="rotate(45)"/>
      <path d="M0,-92 c-4,-6 -12,-4 -12,3 c0,6 8,11 12,15 c4,-4 12,-9 12,-15 c0,-7 -8,-9 -12,-3 z" transform="rotate(90)"/>
      <path d="M0,-92 c-4,-6 -12,-4 -12,3 c0,6 8,11 12,15 c4,-4 12,-9 12,-15 c0,-7 -8,-9 -12,-3 z" transform="rotate(135)"/>
      <path d="M0,-92 c-4,-6 -12,-4 -12,3 c0,6 8,11 12,15 c4,-4 12,-9 12,-15 c0,-7 -8,-9 -12,-3 z" transform="rotate(180)"/>
      <path d="M0,-92 c-4,-6 -12,-4 -12,3 c0,6 8,11 12,15 c4,-4 12,-9 12,-15 c0,-7 -8,-9 -12,-3 z" transform="rotate(225)"/>
      <path d="M0,-92 c-4,-6 -12,-4 -12,3 c0,6 8,11 12,15 c4,-4 12,-9 12,-15 c0,-7 -8,-9 -12,-3 z" transform="rotate(270)"/>
      <path d="M0,-92 c-4,-6 -12,-4 -12,3 c0,6 8,11 12,15 c4,-4 12,-9 12,-15 c0,-7 -8,-9 -12,-3 z" transform="rotate(315)"/>
    </g>
  </g>

  <!-- Soft candlelight haze over everything -->
  <rect width="500" height="700" fill="url(#dd-vignette)"/>
</svg>
