<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 840" width="100%" height="100%">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="rg-card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="60%" stop-color="#FFF9F5"/>
      <stop offset="100%" stop-color="#FFF2EC"/>
    </linearGradient>

    <!-- Soft Vignette Shadow -->
    <radialGradient id="rg-vignette" cx="50%" cy="40%" r="65%">
      <stop offset="65%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#EED8CB" stop-opacity="0.35"/>
    </radialGradient>

    <!-- Soft Princess Drop Shadow Filter -->
    <filter id="rg-soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#552D37" flood-opacity="0.18"/>
    </filter>

    <clipPath id="rg-card-clip">
      <rect width="600" height="840" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rg-card-clip)">
    <!-- 1. Cream Paper Card Base -->
    <rect width="600" height="840" fill="url(#rg-card-bg)"/>
    <rect width="600" height="840" fill="url(#rg-vignette)"/>

    <!-- Subtle Bevel Border -->
    <rect x="14" y="14" width="572" height="812" rx="6" fill="none" stroke="#F5DFD5" stroke-width="1.5" opacity="0.8"/>
    <rect x="20" y="20" width="560" height="800" rx="4" fill="none" stroke="#EACCC0" stroke-width="0.8" stroke-dasharray="6 3" opacity="0.6"/>

    <!-- 2. Floral Accents & Vines Framing Upper Card -->
    <!-- Top-Left Flower Cluster -->
    <g transform="translate(60, 60)" filter="url(#rg-soft-shadow)">
      <!-- Green Leaves & Vines -->
      <path d="M0 0 C15 -25 35 -15 35 10 C20 15 5 15 0 0 Z" fill="#69995D" opacity="0.85"/>
      <path d="M-15 15 C-35 5 -30 -15 -10 -15 C-5 0 -5 10 -15 15 Z" fill="#7EAE6E" opacity="0.8"/>
      <path d="M20 25 C45 35 35 55 15 45 C10 35 15 25 20 25 Z" fill="#58854D" opacity="0.85"/>
      <!-- Pink Blossom 1 -->
      <g transform="translate(10, 15)">
        <circle cx="-10" cy="-6" r="10" fill="#FFAEC9"/>
        <circle cx="10" cy="-6" r="10" fill="#FFAEC9"/>
        <circle cx="-7" cy="10" r="10" fill="#FF94B8"/>
        <circle cx="7" cy="10" r="10" fill="#FF94B8"/>
        <circle cx="0" cy="-12" r="10" fill="#FFBCD3"/>
        <circle cx="0" cy="2" r="6" fill="#FFF2B2"/>
        <circle cx="0" cy="2" r="3" fill="#E69500"/>
      </g>
    </g>

    <!-- Top-Right Flower Cluster -->
    <g transform="translate(530, 80)" filter="url(#rg-soft-shadow)">
      <path d="M0 0 C-15 -25 -35 -15 -35 10 C-20 15 -5 15 0 0 Z" fill="#69995D" opacity="0.85"/>
      <path d="M15 15 C35 5 30 -15 10 -15 C5 0 5 10 15 15 Z" fill="#7EAE6E" opacity="0.8"/>
      <path d="M-20 25 C-45 35 -35 55 -15 45 C-10 35 -15 25 -20 25 Z" fill="#58854D" opacity="0.85"/>
      <g transform="translate(-15, 15)">
        <circle cx="-9" cy="-5" r="9" fill="#FFAEC9"/>
        <circle cx="9" cy="-5" r="9" fill="#FFAEC9"/>
        <circle cx="-6" cy="9" r="9" fill="#FF94B8"/>
        <circle cx="6" cy="9" r="9" fill="#FF94B8"/>
        <circle cx="0" cy="-11" r="9" fill="#FFBCD3"/>
        <circle cx="0" cy="2" r="5.5" fill="#FFF2B2"/>
        <circle cx="0" cy="2" r="2.5" fill="#E69500"/>
      </g>
    </g>

    <!-- Mid-Left Flower Bush -->
    <g transform="translate(45, 260)" filter="url(#rg-soft-shadow)">
      <path d="M0 0 C-15 10 -20 30 0 45 C15 35 10 10 0 0 Z" fill="#69995D"/>
      <circle cx="-12" cy="18" r="8" fill="#FFAEC9"/>
      <circle cx="2" cy="12" r="8" fill="#FF94B8"/>
      <circle cx="-6" cy="28" r="8" fill="#FF80A6"/>
      <circle cx="-5" cy="19" r="4" fill="#FFF2B2"/>
    </g>

    <!-- Mid-Right Flower Bush -->
    <g transform="translate(545, 240)" filter="url(#rg-soft-shadow)">
      <path d="M0 0 C15 10 20 30 0 45 C-15 35 -10 10 0 0 Z" fill="#69995D"/>
      <circle cx="12" cy="18" r="8" fill="#FFAEC9"/>
      <circle cx="-2" cy="12" r="8" fill="#FF94B8"/>
      <circle cx="6" cy="28" r="8" fill="#FF80A6"/>
      <circle cx="5" cy="19" r="4" fill="#FFF2B2"/>
    </g>

    <!-- Butterflies and Golden Sparkles -->
    <g fill="#FFA3C2" opacity="0.85" filter="url(#rg-soft-shadow)">
      <!-- Top-Left Butterfly -->
      <g transform="translate(140, 95) rotate(-20) scale(0.75)">
        <path d="M0 0 C-12 -18 -22 2 0 6 C22 2 12 -18 0 0 Z"/>
        <path d="M0 6 C-14 12 -16 26 0 16 C16 26 14 12 0 6 Z"/>
        <line x1="0" y1="-2" x2="0" y2="18" stroke="#8C4456" stroke-width="1.5"/>
      </g>
      <!-- Mid-Right Butterfly -->
      <g transform="translate(460, 185) rotate(15) scale(0.65)">
        <path d="M0 0 C-12 -18 -22 2 0 6 C22 2 12 -18 0 0 Z"/>
        <path d="M0 6 C-14 12 -16 26 0 16 C16 26 14 12 0 6 Z"/>
        <line x1="0" y1="-2" x2="0" y2="18" stroke="#8C4456" stroke-width="1.5"/>
      </g>
    </g>

    <g fill="#F5B800" opacity="0.8">
      <polygon points="120,180 123,186 130,187 124,192 126,198 120,194 114,198 116,192 110,187 117,186" transform="scale(0.8) translate(20, 30)"/>
      <polygon points="480,110 483,116 490,117 484,122 486,128 480,124 474,128 476,122 470,117 477,116" transform="scale(0.75) translate(140, 20)"/>
      <circle cx="105" cy="140" r="2.5"/>
      <circle cx="495" cy="150" r="2.5"/>
      <circle cx="150" cy="310" r="2"/>
      <circle cx="450" cy="320" r="2"/>
    </g>

    <!-- 3. DISNEY PRINCESSES ILLUSTRATIONS (Lower Half & Sides) -->
    <!-- (Center between Y=80 and Y=390 is left open for editable invitation text) -->

    <!-- Princess 1: BELLE (Middle-Left, yellow off-shoulder gown, brown updo) -->
    <g transform="translate(45, 290)" filter="url(#rg-soft-shadow)">
      <!-- Gown Shoulders & Bodice -->
      <path d="M30 180 C10 220 0 280 -10 340 L160 340 C150 280 140 220 120 180 C100 170 80 165 75 165 C70 165 50 170 30 180 Z" fill="#FDD835"/>
      <!-- Yellow Draped Ruffle -->
      <path d="M25 185 Q75 210 125 185 Q115 170 75 175 Q35 170 25 185 Z" fill="#FFEE58"/>
      <!-- Neck & Collarbone -->
      <path d="M55 130 L55 170 C65 175 85 175 95 170 L95 130 Z" fill="#FDDCB5"/>
      <!-- Face -->
      <path d="M50 85 C50 130 100 130 100 85 C100 65 50 65 50 85 Z" fill="#FDDCB5"/>
      <!-- Brown Hair (Half-up with yellow hairband) -->
      <path d="M42 80 C35 125 45 160 40 190 C38 200 48 200 52 185 C55 145 52 120 54 95 Z" fill="#5D3A1A"/>
      <path d="M108 80 C115 125 105 160 110 190 C112 200 102 200 98 185 C95 145 98 120 96 95 Z" fill="#5D3A1A"/>
      <path d="M45 75 C45 35 105 35 105 75 C105 50 45 50 45 75 Z" fill="#6D4322"/>
      <circle cx="75" cy="40" r="22" fill="#5D3A1A"/>
      <!-- Yellow Hairband -->
      <path d="M54 58 Q75 50 96 58" stroke="#FDD835" stroke-width="5" fill="none" stroke-linecap="round"/>
      <!-- Eyes, Smile, Blush -->
      <ellipse cx="63" cy="92" rx="4" ry="5.5" fill="#3E2723"/>
      <ellipse cx="87" cy="92" rx="4" ry="5.5" fill="#3E2723"/>
      <circle cx="62" cy="90" r="1.5" fill="#FFFFFF"/>
      <circle cx="86" cy="90" r="1.5" fill="#FFFFFF"/>
      <path d="M70 108 Q75 114 80 108" stroke="#D81B60" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="58" cy="102" r="5" fill="#FF8DA1" opacity="0.45"/>
      <circle cx="92" cy="102" r="5" fill="#FF8DA1" opacity="0.45"/>
    </g>

    <!-- Princess 2: JASMINE (Middle-Right, turquoise/teal top, raven hair, headband jewel) -->
    <g transform="translate(415, 290)" filter="url(#rg-soft-shadow)">
      <!-- Teal Bodice -->
      <path d="M25 180 C5 220 -5 280 -15 340 L155 340 C145 280 135 220 115 180 C95 170 75 165 70 165 C65 165 45 170 25 180 Z" fill="#26A69A"/>
      <path d="M20 185 Q70 205 120 185 Q110 172 70 178 Q30 172 20 185 Z" fill="#4DB6AC"/>
      <!-- Gold Neck Choker -->
      <path d="M50 155 Q70 164 90 155" stroke="#FBC02D" stroke-width="7" fill="none" stroke-linecap="round"/>
      <!-- Neck & Face (Warm Tan Tone) -->
      <path d="M52 130 L52 165 C62 170 78 170 88 165 L88 130 Z" fill="#E0A97E"/>
      <path d="M48 85 C48 130 92 130 92 85 C92 65 48 65 48 85 Z" fill="#E0A97E"/>
      <!-- Raven Hair (Billowy high pony & sides) -->
      <path d="M38 75 C30 115 38 150 32 185 C30 195 40 195 44 180 C48 145 44 115 48 85 Z" fill="#1A1A1A"/>
      <path d="M102 75 C110 115 102 150 108 185 C110 195 100 195 96 180 C92 145 96 115 92 85 Z" fill="#1A1A1A"/>
      <path d="M40 70 C40 30 100 30 100 70 C100 45 40 45 40 70 Z" fill="#1A1A1A"/>
      <!-- Teal Headband with Oval Sapphire Jewel -->
      <path d="M46 56 Q70 48 94 56" stroke="#26A69A" stroke-width="6" fill="none" stroke-linecap="round"/>
      <ellipse cx="70" cy="51" rx="5" ry="6" fill="#00ACC1" stroke="#FBC02D" stroke-width="1.8"/>
      <!-- Gold Earrings -->
      <polygon points="36,95 42,105 32,105" fill="#FBC02D"/>
      <polygon points="104,95 110,105 100,105" fill="#FBC02D"/>
      <!-- Eyes & Features -->
      <ellipse cx="58" cy="90" rx="4.5" ry="5.5" fill="#212121"/>
      <ellipse cx="82" cy="90" rx="4.5" ry="5.5" fill="#212121"/>
      <circle cx="57" cy="88" r="1.5" fill="#FFFFFF"/>
      <circle cx="81" cy="88" r="1.5" fill="#FFFFFF"/>
      <path d="M65 108 Q70 114 75 108" stroke="#C2185B" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="54" cy="100" r="5" fill="#FF8A80" opacity="0.4"/>
      <circle cx="86" cy="100" r="5" fill="#FF8A80" opacity="0.4"/>
    </g>

    <!-- Princess 3: ARIEL (Bottom-Left, red hair, purple seashell bustier) -->
    <g transform="translate(15, 520)" filter="url(#rg-soft-shadow)">
      <!-- Torso / Green Mermaid Waist -->
      <path d="M30 160 C10 200 0 260 -10 320 L160 320 C150 260 140 200 120 160 Z" fill="#66BB6A"/>
      <!-- Purple Seashell Bustier -->
      <ellipse cx="55" cy="165" rx="20" ry="16" fill="#AB47BC" stroke="#8E24AA" stroke-width="2"/>
      <ellipse cx="95" cy="165" rx="20" ry="16" fill="#AB47BC" stroke="#8E24AA" stroke-width="2"/>
      <!-- Neck & Face -->
      <path d="M60 115 L60 155 C70 160 80 160 90 155 L90 115 Z" fill="#FDDCB5"/>
      <path d="M52 75 C52 120 98 120 98 75 C98 55 52 55 52 75 Z" fill="#FDDCB5"/>
      <!-- Iconic Voluminous Red Hair -->
      <path d="M25 60 C10 110 15 180 5 240 C3 250 18 245 22 220 C28 170 35 120 40 80 Z" fill="#E53935"/>
      <path d="M105 60 C130 110 125 180 140 240 C142 250 128 245 124 220 C118 170 112 120 108 80 Z" fill="#E53935"/>
      <path d="M40 55 C30 15 110 10 115 55 C120 30 50 25 40 55 Z" fill="#D32F2F"/>
      <!-- Big Soft Bangs -->
      <path d="M45 55 Q75 35 105 65 Q85 60 45 55 Z" fill="#EF5350"/>
      <!-- Big Blue Eyes -->
      <ellipse cx="64" cy="84" rx="4.5" ry="5.5" fill="#1E88E5"/>
      <ellipse cx="86" cy="84" rx="4.5" ry="5.5" fill="#1E88E5"/>
      <circle cx="63" cy="82" r="1.5" fill="#FFFFFF"/>
      <circle cx="85" cy="82" r="1.5" fill="#FFFFFF"/>
      <path d="M70 100 Q75 106 80 100" stroke="#E91E63" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="58" cy="94" r="5" fill="#FF8DA1" opacity="0.45"/>
      <circle cx="92" cy="94" r="5" fill="#FF8DA1" opacity="0.45"/>
    </g>

    <!-- Princess 4: CINDERELLA (Bottom-Center, sparkling blue gown, blonde updo & blue headband) -->
    <g transform="translate(195, 490)" filter="url(#rg-soft-shadow)">
      <!-- Ballgown Skirt & Bodice -->
      <path d="M15 150 C-15 190 -30 250 -40 320 L180 320 C170 250 155 190 125 150 C105 140 85 135 70 135 C55 135 35 140 15 150 Z" fill="#B3E5FC"/>
      <path d="M35 155 Q70 175 105 155 Q95 142 70 148 Q45 142 35 155 Z" fill="#E1F5FE"/>
      <!-- White Shoulder Caps -->
      <circle cx="20" cy="155" r="15" fill="#FFFFFF" stroke="#B3E5FC" stroke-width="1.5"/>
      <circle cx="120" cy="155" r="15" fill="#FFFFFF" stroke="#B3E5FC" stroke-width="1.5"/>
      <!-- Blue Choker -->
      <path d="M55 125 Q70 130 85 125" stroke="#0288D1" stroke-width="4" fill="none" stroke-linecap="round"/>
      <!-- Neck & Face -->
      <path d="M55 100 L55 130 C65 135 75 135 85 130 L85 100 Z" fill="#FDDCB5"/>
      <path d="M48 60 C48 105 92 105 92 60 C92 40 48 40 48 60 Z" fill="#FDDCB5"/>
      <!-- Blonde Updo & Bangs -->
      <circle cx="70" cy="30" r="24" fill="#FDD835"/>
      <path d="M44 55 C40 25 100 25 96 55 C96 35 44 35 44 55 Z" fill="#FBC02D"/>
      <!-- Blue Headband -->
      <path d="M46 45 Q70 36 94 45" stroke="#0288D1" stroke-width="5" fill="none" stroke-linecap="round"/>
      <!-- Soft Eyes & Smile -->
      <ellipse cx="60" cy="72" rx="4" ry="5.5" fill="#0288D1"/>
      <ellipse cx="80" cy="72" rx="4" ry="5.5" fill="#0288D1"/>
      <circle cx="59" cy="70" r="1.5" fill="#FFFFFF"/>
      <circle cx="79" cy="70" r="1.5" fill="#FFFFFF"/>
      <path d="M66 88 Q70 93 74 88" stroke="#E91E63" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="54" cy="80" r="5" fill="#FF8DA1" opacity="0.45"/>
      <circle cx="86" cy="80" r="5" fill="#FF8DA1" opacity="0.45"/>
    </g>

    <!-- Princess 5: TIANA (Bottom Mid-Right, pale green gown & tiara) -->
    <g transform="translate(295, 500)" filter="url(#rg-soft-shadow)">
      <!-- Pale Green Waterlily Gown -->
      <path d="M20 160 C0 200 -10 260 -20 320 L160 320 C150 260 140 200 120 160 Z" fill="#A5D6A7"/>
      <path d="M35 165 Q70 185 105 165 Q95 152 70 158 Q45 152 35 165 Z" fill="#C8E6C9"/>
      <!-- Neck & Face (Rich Caramel Tone) -->
      <path d="M55 110 L55 145 C65 150 75 150 85 145 L85 110 Z" fill="#BA7A50"/>
      <path d="M48 70 C48 115 92 115 92 70 C92 50 48 50 48 70 Z" fill="#BA7A50"/>
      <!-- Dark Updo Hair -->
      <circle cx="70" cy="38" r="22" fill="#212121"/>
      <path d="M44 65 C40 35 100 35 96 65 C96 45 44 45 44 65 Z" fill="#1A1A1A"/>
      <!-- Green Tiara -->
      <polygon points="62,40 70,30 78,40 84,34 70,44 56,34" fill="#81C784" stroke="#FFF" stroke-width="0.8"/>
      <!-- Eyes & Smile -->
      <ellipse cx="60" cy="80" rx="4" ry="5.5" fill="#3E2723"/>
      <ellipse cx="80" cy="80" rx="4" ry="5.5" fill="#3E2723"/>
      <circle cx="59" cy="78" r="1.5" fill="#FFFFFF"/>
      <circle cx="79" cy="78" r="1.5" fill="#FFFFFF"/>
      <path d="M66 96 Q70 102 74 96" stroke="#D81B60" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="54" cy="88" r="5" fill="#FF8A80" opacity="0.4"/>
      <circle cx="86" cy="88" r="5" fill="#FF8A80" opacity="0.4"/>
    </g>

    <!-- Princess 6: RAPUNZEL (Bottom-Right, long golden hair, lavender corset gown) -->
    <g transform="translate(390, 510)" filter="url(#rg-soft-shadow)">
      <!-- Lavender/Purple Gown Bodice -->
      <path d="M25 150 C5 190 -5 250 -15 320 L165 320 C155 250 145 190 125 150 C105 140 85 135 75 135 C65 135 45 140 25 150 Z" fill="#BA68C8"/>
      <!-- Corset Lace Detail -->
      <path d="M60 150 L90 170 M90 150 L60 170 M60 170 L90 190 M90 170 L60 190" stroke="#F8BBD0" stroke-width="1.8"/>
      <!-- Neck & Face -->
      <path d="M60 105 L60 140 C70 145 80 145 90 140 L90 105 Z" fill="#FDDCB5"/>
      <path d="M52 65 C52 110 98 110 98 65 C98 45 52 45 52 65 Z" fill="#FDDCB5"/>
      <!-- Long Flowing Golden Hair Draped in Front -->
      <path d="M35 55 C20 105 25 175 15 240 C10 270 25 310 40 320 C50 320 40 270 45 220 C50 170 52 110 52 75 Z" fill="#FDD835"/>
      <path d="M102 55 C125 105 120 175 135 240 C138 250 125 245 120 220 C115 170 110 110 105 75 Z" fill="#FDD835"/>
      <path d="M48 55 C40 20 110 20 102 55 C102 35 48 35 48 55 Z" fill="#FBC02D"/>
      <!-- Big Green Eyes -->
      <ellipse cx="64" cy="76" rx="4.5" ry="5.5" fill="#43A047"/>
      <ellipse cx="86" cy="76" rx="4.5" ry="5.5" fill="#43A047"/>
      <circle cx="63" cy="74" r="1.5" fill="#FFFFFF"/>
      <circle cx="85" cy="74" r="1.5" fill="#FFFFFF"/>
      <path d="M70 92 Q75 98 80 92" stroke="#E91E63" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="58" cy="85" r="5" fill="#FF8DA1" opacity="0.45"/>
      <circle cx="92" cy="85" r="5" fill="#FF8DA1" opacity="0.45"/>
    </g>
  </g>
</svg>
