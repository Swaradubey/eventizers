<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="wf-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCFAF5"/>
      <stop offset="50%" stop-color="#F7F3E9"/>
      <stop offset="100%" stop-color="#F2ECE0"/>
    </linearGradient>
    <linearGradient id="wf-ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#991B2B"/>
      <stop offset="50%" stop-color="#7B111F"/>
      <stop offset="100%" stop-color="#5E0B16"/>
    </linearGradient>
    <linearGradient id="wf-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EED596"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A57F1E"/>
    </linearGradient>
    <filter id="wf-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="600" height="800" rx="16" fill="url(#wf-bg)" />
  
  <!-- Festive Outer & Inner Frame Borders -->
  <rect x="20" y="20" width="560" height="760" rx="12" fill="none" stroke="#D8CDBA" stroke-width="1.2" />
  <rect x="26" y="26" width="548" height="748" rx="8" fill="none" stroke="#8E2430" stroke-width="0.8" stroke-dasharray="6,4" opacity="0.45" />

  <!-- Holiday Botanical Top Wreath Garland -->
  <g id="holiday-wreath" filter="url(#wf-shadow)">
    <!-- Cedar & Pine Needle Branches (Left Arch) -->
    <g stroke="#2C4831" stroke-width="2.2" stroke-linecap="round">
      <path d="M 300 80 Q 210 75 160 120 Q 130 160 135 220" fill="none" />
      <path d="M 270 77 Q 200 95 150 150" fill="none" />
    </g>
    <!-- Cedar & Pine Needles (Right Arch) -->
    <g stroke="#2C4831" stroke-width="2.2" stroke-linecap="round">
      <path d="M 300 80 Q 390 75 440 120 Q 470 160 465 220" fill="none" />
      <path d="M 330 77 Q 400 95 450 150" fill="none" />
    </g>

    <!-- Pine Needles Clusters (Left) -->
    <g stroke="#375D3D" stroke-width="1.3" stroke-linecap="round" opacity="0.9">
      <path d="M 230 78 L 220 62 M 230 78 L 225 58 M 230 78 L 235 59 M 230 78 L 240 64" />
      <path d="M 190 92 L 175 80 M 190 92 L 180 74 M 190 92 L 188 72 M 190 92 L 196 75" />
      <path d="M 155 125 L 138 116 M 155 125 L 142 110 M 155 125 L 148 106 M 155 125 L 158 108" />
      <path d="M 136 170 L 118 165 M 136 170 L 120 156 M 136 170 L 126 150 M 136 170 L 135 150" />
    </g>

    <!-- Pine Needles Clusters (Right) -->
    <g stroke="#375D3D" stroke-width="1.3" stroke-linecap="round" opacity="0.9">
      <path d="M 370 78 L 380 62 M 370 78 L 375 58 M 370 78 L 365 59 M 370 78 L 360 64" />
      <path d="M 410 92 L 425 80 M 410 92 L 420 74 M 410 92 L 412 72 M 410 92 L 404 75" />
      <path d="M 445 125 L 462 116 M 445 125 L 458 110 M 445 125 L 452 106 M 445 125 L 442 108" />
      <path d="M 464 170 L 482 165 M 464 170 L 480 156 M 464 170 L 474 150 M 464 170 L 465 150" />
    </g>

    <!-- Sage & Eucalyptus Leaves (Left) -->
    <g fill="#5F7D65" opacity="0.92">
      <path d="M 255 75 C 242 60 228 65 238 78 C 248 88 260 82 255 75 Z" />
      <path d="M 205 88 C 190 74 178 82 190 94 C 200 102 212 96 205 88 Z" />
      <path d="M 165 118 C 148 108 140 120 152 130 C 164 138 174 126 165 118 Z" />
      <path d="M 140 155 C 122 148 118 162 130 170 C 142 176 150 164 140 155 Z" />
      <path d="M 132 200 C 115 198 116 214 128 218 C 140 220 144 206 132 200 Z" />
    </g>

    <!-- Sage & Eucalyptus Leaves (Right) -->
    <g fill="#5F7D65" opacity="0.92">
      <path d="M 345 75 C 358 60 372 65 362 78 C 352 88 340 82 345 75 Z" />
      <path d="M 395 88 C 410 74 422 82 410 94 C 400 102 388 96 395 88 Z" />
      <path d="M 435 118 C 452 108 460 120 448 130 C 436 138 426 126 435 118 Z" />
      <path d="M 460 155 C 478 148 482 162 470 170 C 458 176 450 164 460 155 Z" />
      <path d="M 468 200 C 485 198 484 214 472 218 C 460 220 456 206 468 200 Z" />
    </g>

    <!-- Deep Holly Leaves with Jagged Edge Accents -->
    <g fill="#1E3924">
      <path d="M 220 70 Q 212 58 202 62 Q 206 72 196 76 Q 210 82 220 70 Z" />
      <path d="M 175 105 Q 165 92 155 98 Q 160 108 150 114 Q 164 120 175 105 Z" />
      <path d="M 380 70 Q 388 58 398 62 Q 394 72 404 76 Q 390 82 380 70 Z" />
      <path d="M 425 105 Q 435 92 445 98 Q 440 108 450 114 Q 436 120 425 105 Z" />
    </g>

    <!-- Festive Red Winter Berries Clusters -->
    <g fill="#A61C2C" stroke="#750E1B" stroke-width="0.7">
      <!-- Top Center Cluster -->
      <circle cx="280" cy="85" r="4.5" />
      <circle cx="287" cy="81" r="4" />
      <circle cx="292" cy="88" r="4.2" />
      <circle cx="308" cy="88" r="4.2" />
      <circle cx="313" cy="81" r="4" />
      <circle cx="320" cy="85" r="4.5" />

      <!-- Left Cluster 1 -->
      <circle cx="215" cy="82" r="4.5" />
      <circle cx="221" cy="76" r="3.8" />
      <circle cx="210" cy="76" r="4" />

      <!-- Left Cluster 2 -->
      <circle cx="160" cy="112" r="4.5" />
      <circle cx="152" cy="118" r="4" />
      <circle cx="156" cy="125" r="4.2" />

      <!-- Left Cluster 3 -->
      <circle cx="132" cy="180" r="4.2" />
      <circle cx="125" cy="186" r="4.5" />
      <circle cx="134" cy="192" r="3.8" />

      <!-- Right Cluster 1 -->
      <circle cx="385" cy="82" r="4.5" />
      <circle cx="379" cy="76" r="3.8" />
      <circle cx="390" cy="76" r="4" />

      <!-- Right Cluster 2 -->
      <circle cx="440" cy="112" r="4.5" />
      <circle cx="448" cy="118" r="4" />
      <circle cx="444" cy="125" r="4.2" />

      <!-- Right Cluster 3 -->
      <circle cx="468" cy="180" r="4.2" />
      <circle cx="475" cy="186" r="4.5" />
      <circle cx="466" cy="192" r="3.8" />
    </g>

    <!-- Berry White Highlight Dots -->
    <g fill="#FFFFFF" opacity="0.65">
      <circle cx="279" cy="83" r="1.2" />
      <circle cx="321" cy="83" r="1.2" />
      <circle cx="213" cy="80" r="1.2" />
      <circle cx="387" cy="80" r="1.2" />
      <circle cx="158" cy="110" r="1.2" />
      <circle cx="442" cy="110" r="1.2" />
    </g>

    <!-- Gold Foil Foliage Accents -->
    <g fill="url(#wf-gold)" opacity="0.85">
      <circle cx="245" cy="95" r="3" />
      <circle cx="180" cy="135" r="2.8" />
      <circle cx="145" cy="210" r="2.5" />
      <circle cx="355" cy="95" r="3" />
      <circle cx="420" cy="135" r="2.8" />
      <circle cx="455" cy="210" r="2.5" />
    </g>

    <!-- Elegant Velvet Ribbon & Bow at Top Center (y: 60) -->
    <g id="velvet-bow">
      <!-- Ribbon Tails draping left & right -->
      <path d="M 292 72 C 275 90 265 125 260 160 C 258 175 262 178 268 170 C 275 140 285 105 296 82 Z" fill="url(#wf-ribbon)" />
      <path d="M 308 72 C 325 90 335 125 340 160 C 342 175 338 178 332 170 C 325 140 315 105 304 82 Z" fill="url(#wf-ribbon)" />
      
      <!-- Left Bow Loop -->
      <path d="M 300 68 C 285 45 250 42 245 60 C 240 75 265 82 298 72 Z" fill="url(#wf-ribbon)" />
      <path d="M 288 64 C 276 50 256 50 252 60 C 250 68 266 72 288 66 Z" fill="#6B0C17" opacity="0.45" />

      <!-- Right Bow Loop -->
      <path d="M 300 68 C 315 45 350 42 355 60 C 360 75 335 82 302 72 Z" fill="url(#wf-ribbon)" />
      <path d="M 312 64 C 324 50 344 50 348 60 C 350 68 334 72 312 66 Z" fill="#6B0C17" opacity="0.45" />

      <!-- Center Knot -->
      <ellipse cx="300" cy="69" rx="9" ry="8" fill="#8B1422" stroke="#5A0A14" stroke-width="1" />
      <ellipse cx="299" cy="67" rx="6" ry="4" fill="#B32134" opacity="0.6" />
    </g>
  </g>

  <!-- Bottom Corner Subtle Botanical Accents -->
  <g id="bottom-accents" opacity="0.8">
    <!-- Bottom Left Pine & Berries -->
    <g transform="translate(50, 720)">
      <path d="M 0 30 Q 30 10 70 20" fill="none" stroke="#2C4831" stroke-width="1.6" stroke-linecap="round" />
      <path d="M 20 22 L 14 12 M 20 22 L 20 8 M 20 22 L 28 10" stroke="#375D3D" stroke-width="1.2" stroke-linecap="round" />
      <path d="M 45 16 L 38 4 M 45 16 L 46 2 M 45 16 L 54 5" stroke="#375D3D" stroke-width="1.2" stroke-linecap="round" />
      <circle cx="30" cy="20" r="3.5" fill="#A61C2C" />
      <circle cx="36" cy="16" r="3" fill="#A61C2C" />
      <circle cx="55" cy="18" r="3.2" fill="#D4AF37" opacity="0.9" />
    </g>
    <!-- Bottom Right Pine & Berries -->
    <g transform="translate(550, 720) scale(-1, 1)">
      <path d="M 0 30 Q 30 10 70 20" fill="none" stroke="#2C4831" stroke-width="1.6" stroke-linecap="round" />
      <path d="M 20 22 L 14 12 M 20 22 L 20 8 M 20 22 L 28 10" stroke="#375D3D" stroke-width="1.2" stroke-linecap="round" />
      <path d="M 45 16 L 38 4 M 45 16 L 46 2 M 45 16 L 54 5" stroke="#375D3D" stroke-width="1.2" stroke-linecap="round" />
      <circle cx="30" cy="20" r="3.5" fill="#A61C2C" />
      <circle cx="36" cy="16" r="3" fill="#A61C2C" />
      <circle cx="55" cy="18" r="3.2" fill="#D4AF37" opacity="0.9" />
    </g>
  </g>
</svg>
