<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400;1,600&amp;family=Inter:wght@400;500;600&amp;display=swap');
      .serif-main { font-family: 'Playfair Display', Georgia, serif; fill: #2B2118; }
      .serif-sub { font-family: 'Playfair Display', Georgia, serif; font-style: italic; fill: #5C4A3E; }
      .sans-sub { font-family: 'Inter', sans-serif; font-weight: 500; fill: #3D2D24; letter-spacing: 2px; }
    </style>
  </defs>

  <!-- Background Warm Textured Paper -->
  <rect width="600" height="800" rx="16" fill="#FAF6EE" />
  <!-- Delicate subtle border -->
  <rect x="20" y="20" width="560" height="760" rx="10" fill="none" stroke="#EFE6D6" stroke-width="1.5" />

  <!-- Confetti sprinkles scattered -->
  <g opacity="0.85">
    <circle cx="90" cy="180" r="3" fill="#E87A5D"/>
    <circle cx="210" cy="110" r="3.5" fill="#58A4B0"/>
    <circle cx="340" cy="120" r="3" fill="#F4A261"/>
    <circle cx="470" cy="190" r="3" fill="#E76F51"/>
    <circle cx="150" cy="300" r="3" fill="#2A9D8F"/>
    <circle cx="480" cy="330" r="3.5" fill="#E9C46A"/>
    <circle cx="110" cy="460" r="3" fill="#F4A261"/>
    <circle cx="510" cy="460" r="3" fill="#58A4B0"/>
    <circle cx="130" cy="620" r="3.5" fill="#E76F51"/>
    <circle cx="470" cy="630" r="3" fill="#2A9D8F"/>
    <circle cx="210" cy="730" r="3" fill="#E87A5D"/>
    <circle cx="390" cy="740" r="3.5" fill="#F4A261"/>
    <!-- Confetti dashes -->
    <rect x="160" y="160" width="8" height="3" rx="1.5" transform="rotate(25, 160, 160)" fill="#E9C46A"/>
    <rect x="420" y="150" width="8" height="3" rx="1.5" transform="rotate(-30, 420, 150)" fill="#2A9D8F"/>
    <rect x="180" y="700" width="8" height="3" rx="1.5" transform="rotate(40, 180, 700)" fill="#58A4B0"/>
    <rect x="360" y="690" width="8" height="3" rx="1.5" transform="rotate(-20, 360, 690)" fill="#E76F51"/>
  </g>

  <!-- Top Left: Tall Confetti Layer Cake with candle -->
  <g transform="translate(60, 80)">
    <!-- Plate -->
    <ellipse cx="60" cy="160" rx="55" ry="8" fill="#E2DCD2"/>
    <!-- Cake layers -->
    <rect x="25" y="60" width="70" height="95" rx="3" fill="#FFFDF8" stroke="#D8CDBE" stroke-width="1.5"/>
    <!-- Layer stripes -->
    <rect x="25" y="85" width="70" height="6" fill="#F4A261"/>
    <rect x="25" y="115" width="70" height="6" fill="#E76F51"/>
    <rect x="25" y="140" width="70" height="6" fill="#58A4B0"/>
    <!-- Colorful sprinkle dots on cake icing -->
    <circle cx="40" cy="75" r="2" fill="#E76F51"/>
    <circle cx="55" cy="72" r="2" fill="#2A9D8F"/>
    <circle cx="70" cy="78" r="2" fill="#F4A261"/>
    <circle cx="82" cy="74" r="2" fill="#E87A5D"/>
    <circle cx="35" cy="102" r="2" fill="#58A4B0"/>
    <circle cx="50" cy="100" r="2" fill="#E76F51"/>
    <circle cx="68" cy="103" r="2" fill="#E9C46A"/>
    <circle cx="85" cy="101" r="2" fill="#2A9D8F"/>
    <circle cx="42" cy="130" r="2" fill="#F4A261"/>
    <circle cx="60" cy="128" r="2" fill="#58A4B0"/>
    <circle cx="78" cy="132" r="2" fill="#E76F51"/>
    <!-- Frosting top drips -->
    <path d="M 25 60 Q 35 68 45 60 T 65 60 T 85 60 T 95 60" fill="#FFFDF8" stroke="#D8CDBE" stroke-width="1.5"/>
    <!-- Single candle -->
    <rect x="58" y="32" width="5" height="28" fill="#58A4B0" rx="2"/>
    <!-- Flame -->
    <path d="M 60.5 18 C 65 24, 63 30, 60.5 32 C 58 30, 56 24, 60.5 18 Z" fill="#F4A261"/>
    <circle cx="60.5" cy="27" r="2.5" fill="#FFEE55"/>
  </g>

  <!-- Top Center: Little Chocolate Bundt / Cupcake -->
  <g transform="translate(250, 60)">
    <ellipse cx="40" cy="75" rx="30" ry="6" fill="#E2DCD2"/>
    <!-- Cake body -->
    <path d="M 20 72 Q 22 45 40 45 Q 58 45 60 72 Z" fill="#5A3E2D"/>
    <!-- Glaze drips -->
    <path d="M 22 60 Q 30 68 40 58 Q 50 68 58 60" stroke="#FFF" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Strawberry / Cherry on top -->
    <circle cx="40" cy="40" r="6" fill="#E63946"/>
    <path d="M 40 34 Q 44 26 48 24" stroke="#457B9D" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Top Right: Balloons & Party Hat -->
  <g transform="translate(430, 60)">
    <!-- Balloons on strings -->
    <g>
      <!-- Strings -->
      <path d="M 50 85 Q 40 120 45 160" stroke="#B8AEA0" stroke-width="1" fill="none"/>
      <path d="M 75 75 Q 60 115 50 160" stroke="#B8AEA0" stroke-width="1" fill="none"/>
      <path d="M 95 90 Q 75 125 55 160" stroke="#B8AEA0" stroke-width="1" fill="none"/>
      <!-- Yellow Balloon -->
      <ellipse cx="48" cy="65" rx="20" ry="24" fill="#F4A261" opacity="0.95"/>
      <polygon points="46,89 50,89 48,93" fill="#E76F51"/>
      <!-- Blue Balloon -->
      <ellipse cx="78" cy="55" rx="22" ry="26" fill="#58A4B0" opacity="0.92"/>
      <polygon points="76,81 80,81 78,85" fill="#2A9D8F"/>
      <!-- Green Balloon -->
      <ellipse cx="98" cy="72" rx="19" ry="23" fill="#2A9D8F" opacity="0.9"/>
      <polygon points="96,95 100,95 98,99" fill="#1D7068"/>
    </g>
    <!-- Party Hat -->
    <g transform="translate(10, 85)">
      <polygon points="25,10 5,60 45,60" fill="#E76F51"/>
      <path d="M 10 48 L 40 48 M 15 36 L 35 36 M 20 24 L 30 24" stroke="#FFE3A8" stroke-width="2.5"/>
      <circle cx="25" cy="8" r="4" fill="#E9C46A"/>
    </g>
  </g>

  <!-- Left Side: Green Candle & Stand -->
  <g transform="translate(60, 440)">
    <!-- Tall striped green candle -->
    <rect x="25" y="30" width="7" height="110" fill="#2A9D8F" rx="3"/>
    <path d="M 25 50 L 32 55 M 25 75 L 32 80 M 25 100 L 32 105" stroke="#FAF6EE" stroke-width="2"/>
    <!-- Flame -->
    <path d="M 28.5 14 C 33 20, 31 26, 28.5 28 C 26 26, 24 20, 28.5 14 Z" fill="#F4A261"/>
    <circle cx="28.5" cy="23" r="2" fill="#FFEE55"/>

    <!-- Party hat below candle -->
    <g transform="translate(5, 170)">
      <polygon points="25,5 5,55 45,55" fill="#E9C46A"/>
      <circle cx="15" cy="45" r="3" fill="#E76F51"/>
      <circle cx="35" cy="45" r="3" fill="#2A9D8F"/>
      <circle cx="25" cy="30" r="3" fill="#58A4B0"/>
      <circle cx="25" cy="4" r="3.5" fill="#E76F51"/>
    </g>
  </g>

  <!-- Bottom Left: Mint Cake Stand with treat -->
  <g transform="translate(60, 680)">
    <path d="M 20 40 Q 35 30 50 40 L 45 42 L 38 60 L 45 65 L 25 65 L 32 60 L 25 42 Z" fill="#74C69D"/>
    <!-- Tart / Cake on top -->
    <rect x="23" y="24" width="24" height="16" rx="2" fill="#E76F51"/>
    <circle cx="35" cy="18" r="4" fill="#FFEE55"/>
  </g>

  <!-- Right Side: Yellow Gift Box & Pink Candle -->
  <g transform="translate(480, 440)">
    <!-- Tall Pink Candle -->
    <rect x="20" y="20" width="7" height="120" fill="#E76F51" rx="3"/>
    <!-- Flame -->
    <path d="M 23.5 6 C 28 12, 26 18, 23.5 20 C 21 18, 19 12, 23.5 6 Z" fill="#F4A261"/>
    <circle cx="23.5" cy="14" r="2" fill="#FFEE55"/>

    <!-- Gift box with ribbon -->
    <g transform="translate(-15, 170)">
      <rect x="5" y="15" width="55" height="55" rx="3" fill="#F4A261"/>
      <rect x="3" y="10" width="59" height="10" rx="2" fill="#E76F51"/>
      <!-- Vertical ribbon -->
      <rect x="29" y="10" width="7" height="60" fill="#E76F51"/>
      <!-- Bow -->
      <circle cx="26" cy="7" r="5" fill="#E76F51"/>
      <circle cx="39" cy="7" r="5" fill="#E76F51"/>
    </g>
  </g>

  <!-- Bottom Center: Cupcake with candle -->
  <g transform="translate(250, 650)">
    <!-- Cupcake wrapper -->
    <polygon points="35,60 25,100 75,100 65,60" fill="#E9C46A"/>
    <!-- Frosting dome -->
    <circle cx="50" cy="55" r="24" fill="#FFFDF8" stroke="#D8CDBE" stroke-width="1.5"/>
    <circle cx="40" cy="50" r="2" fill="#E76F51"/>
    <circle cx="50" cy="45" r="2" fill="#58A4B0"/>
    <circle cx="60" cy="52" r="2" fill="#2A9D8F"/>
    <circle cx="45" cy="62" r="2" fill="#F4A261"/>
    <circle cx="55" cy="60" r="2" fill="#E76F51"/>
    <!-- Candle -->
    <rect x="48" y="18" width="4" height="20" fill="#E76F51" rx="2"/>
    <!-- Flame -->
    <path d="M 50 6 C 53 11, 52 16, 50 18 C 48 16, 47 11, 50 6 Z" fill="#F4A261"/>
    <circle cx="50" cy="13" r="1.5" fill="#FFEE55"/>
    <!-- Candies on sides -->
    <g transform="translate(-5, 90)">
      <circle cx="10" cy="5" r="6" fill="#F4A261"/>
      <polygon points="10,5 3,0 3,10" fill="#F4A261"/>
      <polygon points="10,5 17,0 17,10" fill="#F4A261"/>
    </g>
    <g transform="translate(85, 90)">
      <circle cx="10" cy="5" r="6" fill="#58A4B0"/>
      <polygon points="10,5 3,0 3,10" fill="#58A4B0"/>
      <polygon points="10,5 17,0 17,10" fill="#58A4B0"/>
    </g>
  </g>

  </svg>
