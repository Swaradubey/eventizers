<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="100%" height="100%">
  <defs>
    <linearGradient id="sp-black" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111113"/>
      <stop offset="50%" stop-color="#0A0A0C"/>
      <stop offset="100%" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="sp-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8C6B1F"/>
      <stop offset="22%" stop-color="#E8CE86"/>
      <stop offset="45%" stop-color="#F7EBC2"/>
      <stop offset="62%" stop-color="#C9A227"/>
      <stop offset="82%" stop-color="#F2DE9E"/>
      <stop offset="100%" stop-color="#9A7722"/>
    </linearGradient>
    <linearGradient id="sp-gold-soft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4E4AE"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9C7A24"/>
    </linearGradient>
    <radialGradient id="sp-vignette" cx="50%" cy="46%" r="70%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.65"/>
    </radialGradient>
    <radialGradient id="sp-candle-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD98A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFD98A" stop-opacity="0"/>
    </radialGradient>
    <!-- Ornate corner flourish -->
    <g id="sp-corner">
      <path d="M0,54 C0,26 22,6 52,4 C36,14 28,26 26,44 C34,32 46,26 60,26 C44,32 34,44 32,60 C40,50 52,46 64,48 C48,52 38,62 36,76"
            fill="none" stroke="url(#sp-gold)" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M14,66 C22,50 38,42 56,44" fill="none" stroke="url(#sp-gold)" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="66" cy="26" r="4.5" fill="url(#sp-gold)"/>
      <circle cx="34" cy="82" r="3.6" fill="url(#sp-gold)"/>
      <path d="M74,10 C82,16 84,26 78,34 C76,26 74,18 74,10 Z" fill="url(#sp-gold)"/>
    </g>
    <!-- Gold candle -->
    <g id="sp-candle">
      <rect x="-8" y="-86" width="16" height="86" rx="6" fill="url(#sp-gold-soft)"/>
      <rect x="-8" y="-86" width="5" height="86" rx="3" fill="#F7EBC2" opacity="0.55"/>
      <path d="M0,-96 C7,-108 5,-120 0,-128 C-5,-120 -7,-108 0,-96 Z" fill="#FFE7A8"/>
      <path d="M0,-100 C3,-107 2,-115 0,-120 C-2,-115 -3,-107 0,-100 Z" fill="#FFFBEA"/>
      <ellipse cx="0" cy="-40" rx="34" ry="60" fill="url(#sp-candle-glow)"/>
      <path d="M-18,0 h36 l6,10 h-48 z" fill="url(#sp-gold)"/>
      <path d="M-26,10 h52 v6 h-52 z" fill="url(#sp-gold)"/>
    </g>
    <!-- Bat -->
    <g id="sp-bat">
      <path d="M0,0 C-8,-12 -22,-18 -38,-14 C-32,-8 -30,-2 -32,4 C-24,0 -14,2 -6,8 C-2,4 2,4 6,8 C14,2 24,0 32,4 C30,-2 32,-8 38,-14 C22,-18 8,-12 0,0 Z"/>
      <path d="M-6,-4 l-4,-8 l6,3 z M6,-4 l4,-8 l-6,3 z"/>
    </g>
  </defs>

  <!-- Matte black card stock -->
  <rect width="500" height="700" fill="url(#sp-black)"/>
  <g opacity="0.06" fill="#FFFFFF">
    <circle cx="70" cy="90" r="1.4"/><circle cx="180" cy="46" r="1.1"/><circle cx="300" cy="120" r="1.3"/>
    <circle cx="430" cy="70" r="1.2"/><circle cx="120" cy="330" r="1.1"/><circle cx="410" cy="400" r="1.4"/>
    <circle cx="60" cy="560" r="1.2"/><circle cx="250" cy="640" r="1.3"/><circle cx="450" cy="600" r="1.1"/>
    <circle cx="340" cy="250" r="1"/><circle cx="160" cy="470" r="1.2"/>
  </g>

  <!-- Ornate gold double frame -->
  <rect x="20" y="20" width="460" height="660" rx="6" fill="none" stroke="url(#sp-gold)" stroke-width="5"/>
  <rect x="32" y="32" width="436" height="636" rx="4" fill="none" stroke="url(#sp-gold)" stroke-width="1.6"/>
  <rect x="39" y="39" width="422" height="622" rx="3" fill="none" stroke="url(#sp-gold)" stroke-width="1" stroke-dasharray="2 7"/>

  <!-- Corner flourishes -->
  <g transform="translate(46,46)"><use href="#sp-corner"/></g>
  <g transform="translate(454,46) scale(-1,1)"><use href="#sp-corner"/></g>
  <g transform="translate(46,654) scale(1,-1)"><use href="#sp-corner"/></g>
  <g transform="translate(454,654) scale(-1,-1)"><use href="#sp-corner"/></g>

  <!-- Gold skull crest -->
  <g transform="translate(250,116)">
    <ellipse cx="0" cy="4" rx="40" ry="44" fill="url(#sp-gold-soft)"/>
    <path d="M-30,32 C-26,50 -14,58 0,58 C14,58 26,50 30,32 Z" fill="url(#sp-gold-soft)"/>
    <!-- eye sockets -->
    <ellipse cx="-15" cy="0" rx="11" ry="13" fill="#08080A"/>
    <ellipse cx="15" cy="0" rx="11" ry="13" fill="#08080A"/>
    <ellipse cx="-15" cy="-2" rx="5" ry="6" fill="#1A1A1E"/>
    <ellipse cx="15" cy="-2" rx="5" ry="6" fill="#1A1A1E"/>
    <!-- nasal cavity -->
    <path d="M0,16 L-7,30 L7,30 Z" fill="#08080A"/>
    <!-- teeth -->
    <g fill="#08080A">
      <rect x="-19" y="34" width="3.4" height="18" rx="1.6"/>
      <rect x="-9" y="34" width="3.4" height="20" rx="1.6"/>
      <rect x="1" y="34" width="3.4" height="20" rx="1.6"/>
      <rect x="11" y="34" width="3.4" height="18" rx="1.6"/>
      <path d="M-24,38 h48 v3 h-48 z"/>
    </g>
    <!-- cheek shading -->
    <path d="M-34,10 C-30,-4 -26,-14 -18,-22" fill="none" stroke="#9C7A24" stroke-width="2.4" opacity="0.7"/>
    <path d="M34,10 C30,-4 26,-14 18,-22" fill="none" stroke="#9C7A24" stroke-width="2.4" opacity="0.7"/>
    <!-- crown thorns / laurel -->
    <path d="M-52,44 C-40,60 -20,70 0,72 C20,70 40,60 52,44" fill="none" stroke="url(#sp-gold)" stroke-width="3" stroke-linecap="round"/>
    <g fill="url(#sp-gold)">
      <path d="M-46,52 c-8,-2 -14,2 -16,8 c6,2 13,0 16,-8 z"/>
      <path d="M46,52 c8,-2 14,2 16,8 c-6,2 -13,0 -16,-8 z"/>
      <path d="M-24,66 c-6,4 -8,10 -6,15 c6,-2 9,-8 6,-15 z"/>
      <path d="M24,66 c6,4 8,10 6,15 c-6,-2 -9,-8 -6,-15 z"/>
    </g>
  </g>

  <!-- Serif rules that frame the headline block -->
  <g stroke="url(#sp-gold)" stroke-width="1.6">
    <path d="M96,214 H404"/>
    <path d="M140,224 H360" stroke-dasharray="1 6" stroke-linecap="round"/>
  </g>
  <g fill="url(#sp-gold)">
    <path d="M250,208 l7,7 l-7,7 l-7,-7 z"/>
    <path d="M92,214 l5,-6 l5,6 l-5,6 z"/>
    <path d="M404,214 l5,-6 l5,6 l-5,6 z"/>
  </g>

  <!-- Candlestick pair -->
  <g transform="translate(74,540) scale(0.78)"><use href="#sp-candle"/></g>
  <g transform="translate(426,540) scale(0.78) scale(-1,1)"><use href="#sp-candle"/></g>
  <g transform="translate(118,566) scale(0.58)"><use href="#sp-candle"/></g>
  <g transform="translate(382,566) scale(0.58) scale(-1,1)"><use href="#sp-candle"/></g>

  <!-- Filigree flourish under the candles -->
  <path d="M96,628 C150,612 200,616 250,634 C300,616 350,612 404,628"
        fill="none" stroke="url(#sp-gold)" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Bat line art -->
  <g fill="url(#sp-gold-soft)" transform="translate(250,646) scale(1.05)"><use href="#sp-bat"/></g>
  <g fill="url(#sp-gold)" opacity="0.9" transform="translate(150,652) scale(0.62)"><use href="#sp-bat"/></g>
  <g fill="url(#sp-gold)" opacity="0.9" transform="translate(350,652) scale(0.62) scale(-1,1)"><use href="#sp-bat"/></g>

  <rect width="500" height="700" fill="url(#sp-vignette)"/>
</svg>
