<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="100%" height="100%">
  <defs>
    <linearGradient id="st-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#07091A"/>
      <stop offset="45%" stop-color="#141033"/>
      <stop offset="78%" stop-color="#241241"/>
      <stop offset="100%" stop-color="#0A0716"/>
    </linearGradient>
    <radialGradient id="st-moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F4F1FF"/>
      <stop offset="72%" stop-color="#DDD8F2"/>
      <stop offset="100%" stop-color="#B9B2DA"/>
    </radialGradient>
    <radialGradient id="st-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#CFC9FF" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#8E86E0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8E86E0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="st-storm" cx="50%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#FF4D6D" stop-opacity="0.85"/>
      <stop offset="38%" stop-color="#C13BFF" stop-opacity="0.45"/>
      <stop offset="72%" stop-color="#3E7BFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3E7BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="st-vignette" cx="50%" cy="45%" r="72%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.72"/>
    </radialGradient>
    <linearGradient id="st-fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B9C4E8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#B9C4E8" stop-opacity="0.3"/>
    </linearGradient>
    <g id="st-tree">
      <path d="M0,0 C-4,-40 -3,-90 0,-140 C3,-95 5,-45 4,0 Z"/>
      <path d="M0,-60 C-18,-74 -30,-92 -36,-114 M0,-60 C16,-76 26,-96 30,-118 M0,-92 C-13,-104 -20,-120 -23,-138 M0,-92 C12,-106 18,-122 20,-140 M0,-118 C-8,-130 -11,-142 -12,-154 M0,-118 C7,-131 10,-143 11,-155"
            fill="none" stroke-width="3.4" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- Night sky -->
  <rect width="500" height="700" fill="url(#st-sky)"/>

  <!-- Stars -->
  <g fill="#EDEBFF">
    <circle cx="62" cy="58" r="1.7" opacity="0.9"/>
    <circle cx="130" cy="34" r="1.2" opacity="0.7"/>
    <circle cx="196" cy="76" r="1.5" opacity="0.8"/>
    <circle cx="258" cy="40" r="1.1" opacity="0.6"/>
    <circle cx="312" cy="96" r="1.4" opacity="0.75"/>
    <circle cx="446" cy="66" r="1.6" opacity="0.85"/>
    <circle cx="470" cy="150" r="1.2" opacity="0.6"/>
    <circle cx="40" cy="140" r="1.3" opacity="0.7"/>
    <circle cx="110" cy="118" r="1" opacity="0.55"/>
    <circle cx="366" cy="44" r="1.2" opacity="0.7"/>
  </g>

  <!-- Full moon with halo -->
  <circle cx="386" cy="120" r="140" fill="url(#st-halo)"/>
  <circle cx="386" cy="120" r="62" fill="url(#st-moon)"/>
  <g fill="#C9C2E4" opacity="0.55">
    <circle cx="366" cy="104" r="11"/>
    <circle cx="402" cy="132" r="8"/>
    <circle cx="374" cy="146" r="6"/>
    <circle cx="404" cy="96" r="5"/>
  </g>

  <!-- Storm glow behind the haunted house -->
  <ellipse cx="250" cy="352" rx="215" ry="165" fill="url(#st-storm)"/>
  <path d="M232,208 L262,258 L242,258 L272,318" fill="none" stroke="#FFD9E6" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>

  <!-- Haunted house silhouette -->
  <g fill="#0A0616">
    <path d="M250,196 L338,262 L338,430 L162,430 L162,262 Z"/>
    <path d="M150,268 L250,190 L350,268 L350,278 L150,278 Z"/>
    <rect x="286" y="206" width="26" height="52" rx="3"/>
    <path d="M282,206 L299,182 L316,206 Z"/>
    <rect x="206" y="300" width="34" height="46" rx="4"/>
    <rect x="262" y="300" width="34" height="46" rx="4"/>
    <rect x="230" y="366" width="42" height="64" rx="6"/>
    <rect x="176" y="304" width="26" height="34" rx="4"/>
    <rect x="300" y="304" width="26" height="34" rx="4"/>
  </g>
  <!-- Glowing windows -->
  <g fill="#FFB347" opacity="0.95">
    <rect x="210" y="304" width="26" height="38" rx="3"/>
    <rect x="266" y="304" width="26" height="38" rx="3"/>
    <rect x="180" y="308" width="18" height="26" rx="3"/>
    <rect x="304" y="308" width="18" height="26" rx="3"/>
  </g>
  <g fill="#FF6B6B" opacity="0.9">
    <rect x="236" y="376" width="30" height="54" rx="5"/>
  </g>
  <g stroke="#0A0616" stroke-width="3">
    <path d="M223,304 v38 M210,323 h26 M279,304 v38 M266,323 h26"/>
  </g>

  <!-- Bare tree silhouettes -->
  <g fill="#05040D" stroke="#05040D">
    <use href="#st-tree" transform="translate(58,560) scale(1.55)"/>
    <use href="#st-tree" transform="translate(140,545) scale(1.1) rotate(6)"/>
    <use href="#st-tree" transform="translate(452,572) scale(1.6) rotate(-5)"/>
    <use href="#st-tree" transform="translate(372,548) scale(1.05) rotate(-8)"/>
    <use href="#st-tree" transform="translate(244,536) scale(0.7)"/>
  </g>

  <!-- Ground -->
  <path d="M0,470 C90,452 170,486 250,480 C336,474 420,448 500,466 L500,700 L0,700 Z" fill="#05040D"/>
  <path d="M0,470 C90,452 170,486 250,480 C336,474 420,448 500,466" fill="none" stroke="#1E1740" stroke-width="3"/>

  <!-- Ground fog -->
  <ellipse cx="150" cy="520" rx="180" ry="34" fill="url(#st-fog)" opacity="0.5"/>
  <ellipse cx="360" cy="546" rx="190" ry="36" fill="url(#st-fog)" opacity="0.45"/>
  <ellipse cx="250" cy="600" rx="260" ry="52" fill="#8E9AC8" opacity="0.08"/>

  <!-- Gravestones -->
  <g fill="#0B0916">
    <path d="M96,566 a16,16 0 0 1 32,0 v44 h-32 z"/>
    <path d="M376,584 a14,14 0 0 1 28,0 v40 h-28 z"/>
    <rect x="140" y="598" width="26" height="34" rx="3"/>
  </g>

  <rect width="500" height="700" fill="url(#st-vignette)"/>
</svg>
