<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!--Antique gold foil-->
    <linearGradient id="gh-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7A5A16"/>
      <stop offset="18%" stop-color="#D8B45A"/>
      <stop offset="36%" stop-color="#FFF1BE"/>
      <stop offset="52%" stop-color="#C9A227"/>
      <stop offset="70%" stop-color="#8A6A22"/>
      <stop offset="86%" stop-color="#F3E1A4"/>
      <stop offset="100%" stop-color="#8A6A22"/>
    </linearGradient>
    <linearGradient id="gh-gold-soft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9A7A2A"/>
      <stop offset="50%" stop-color="#E8CE86"/>
      <stop offset="100%" stop-color="#7A5A16"/>
    </linearGradient>

    <!--Gray stone wall backdrop-->
    <pattern id="gh-stone" width="120" height="60" patternUnits="userSpaceOnUse">
      <rect width="120" height="60" fill="#6E7076"/>
      <rect y="0" width="120" height="28" fill="#75777D"/>
      <path d="M0,30 h120 M40,0 v30 M96,30 v30" stroke="#56585E" stroke-width="3"/>
      <ellipse cx="24" cy="15" rx="20" ry="9" fill="#7B7D83" opacity="0.5"/>
      <ellipse cx="80" cy="46" rx="26" ry="10" fill="#5F6167" opacity="0.5"/>
      <ellipse cx="110" cy="12" rx="14" ry="7" fill="#64666C" opacity="0.6"/>
    </pattern>

    <!--Card artwork patterns-->
    <pattern id="gh-damask" width="84" height="84" patternUnits="userSpaceOnUse">
      <rect width="84" height="84" fill="#23211D"/>
      <g fill="#2E2B25" opacity="0.95">
        <path d="M42,10 q10,14 0,26 q-10,-12 0,-26 z"/>
        <path d="M42,74 q10,-14 0,-26 q-10,12 0,26 z"/>
        <path d="M10,42 q14,10 26,0 q-12,-10 -26,0 z"/>
        <path d="M74,42 q-14,10 -26,0 q12,-10 26,0 z"/>
        <path d="M24,24 q10,-4 14,8 q-10,-2 -14,-8 z"/>
        <path d="M60,60 q-10,4 -14,-8 q10,2 14,8 z"/>
        <circle cx="42" cy="42" r="4"/>
        <circle cx="0" cy="0" r="3"/>
        <circle cx="84" cy="0" r="3"/>
        <circle cx="0" cy="84" r="3"/>
        <circle cx="84" cy="84" r="3"/>
      </g>
    </pattern>
    <radialGradient id="gh-vig" cx="50%" cy="46%" r="72%">
      <stop offset="50%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>
    <g id="gh-corner">
      <path d="M4,74 C4,44 24,16 58,10 C44,22 36,36 40,50 C44,64 58,72 72,68 C60,82 42,84 28,74 C18,66 14,54 16,42 C8,52 4,64 4,74 Z" fill="url(#gh-gold)"/>
      <path d="M66,14 C82,18 94,32 98,50 C86,42 74,38 62,40 Z" fill="url(#gh-gold-soft)"/>
      <path d="M14,66 C18,82 30,94 48,98 C40,86 36,74 38,62 Z" fill="url(#gh-gold-soft)"/>
      <path d="M30,44 q10,-8 20,0 q-10,8 -20,0 z" fill="#F6E7B2" opacity="0.9"/>
      <circle cx="24" cy="30" r="5" fill="#F6E7B2"/>
      <circle cx="56" cy="76" r="4" fill="#F6E7B2"/>
    </g>
    <g id="gh-web" fill="none" stroke="#C9A227" stroke-width="1.2" stroke-linecap="round" opacity="0.62">
      <path d="M0,0 L64,0 M0,0 L58,24 M0,0 L45,45 M0,0 L24,58 M0,0 L0,64"/>
      <path d="M22,0 Q12,12 0,22"/>
      <path d="M42,0 Q28,5 38,16 Q30,21 29,29 Q21,30 16,38 Q13,30 0,42"/>
      <path d="M64,0 Q45,6 58,24 Q46,32 45,45 Q32,46 24,58 Q6,45 0,64"/>
    </g>
    <g id="gh-shell">
      <path d="M0,0 q-24,-4 -34,16 q14,-6 24,-2 q-12,8 -8,20 q10,-10 20,-10 q10,0 20,10 q4,-12 -8,-20 q10,-4 24,2 q-10,-20 -34,-16 z" fill="url(#gh-gold)"/>
      <path d="M-16,10 q16,-8 32,0" stroke="#7A5A16" stroke-width="1.4" fill="none"/>
      <path d="M-10,18 q10,-6 20,0" stroke="#7A5A16" stroke-width="1.2" fill="none"/>
      <circle cx="0" cy="-6" r="4" fill="#F6E7B2"/>
    </g>

    <filter id="gh-cardShadow" x="-25%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="gh-envShadow" x="-25%" y="-25%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#2A2C31" flood-opacity="0.55"/>
    </filter>
    <radialGradient id="gh-backdropVig" cx="50%" cy="48%" r="72%">
      <stop offset="52%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1E2024" stop-opacity="0.7"/>
    </radialGradient>
  </defs>

  <!--============================ BACKDROP ============================-->
  <rect width="800" height="600" fill="url(#gh-stone)"/>
  <rect width="800" height="600" fill="url(#gh-backdropVig)"/>

  <!--============================ ENVELOPE ============================-->
  <g filter="url(#gh-envShadow)">
    <rect x="90" y="180" width="440" height="322" rx="8" fill="#C9A227"/>
    <path d="M90,184 L310,44 L530,184 Z" fill="#B08C1F"/>
    <path d="M124,180 L310,74 L496,180 Z" fill="url(#gh-gold-soft)"/>
    <path d="M124,180 L310,74 L310,180 Z" fill="#FFFFFF" opacity="0.22"/>
    <path d="M124,180 L310,74 L496,180" fill="none" stroke="#7A5A16" stroke-width="2.4"/>
    <path d="M90,184 h440" stroke="#8A6A22" stroke-width="3" opacity="0.8"/>
    <path d="M124,196 h372" stroke="#F3E1A4" stroke-width="1.6" opacity="0.7"/>
    <circle cx="310" cy="300" r="52" fill="none" stroke="#F3E1A4" stroke-width="2" opacity="0.55"/>
    <circle cx="310" cy="300" r="44" fill="none" stroke="#7A5A16" stroke-width="1.4" opacity="0.6"/>
  </g>

  <!--====================== INVITATION CARD (5x7) ======================-->
  <g filter="url(#gh-cardShadow)">
    <rect x="280" y="70" width="330" height="462" rx="6" fill="#23211D"/>
    <g transform="translate(280,70) scale(0.66)">
      <!--CARD ARTWORK (matches gildedhorrorbg.svg)-->
      <rect width="500" height="700" fill="url(#gh-damask)"/>
      <rect width="500" height="700" fill="url(#gh-vig)"/>

      <rect x="56" y="56" width="388" height="588" fill="#0A0908"/>
      <rect x="56" y="56" width="388" height="588" fill="none" stroke="#000000" stroke-width="6" opacity="0.6"/>
      <rect x="68" y="68" width="364" height="564" fill="none" stroke="#C9A227" stroke-width="1.2" stroke-opacity="0.55"/>
      <rect x="74" y="74" width="352" height="552" fill="none" stroke="#C9A227" stroke-width="0.6" stroke-opacity="0.35"/>

      <g transform="translate(70,70)"><use href="#gh-web"/></g>
      <g transform="translate(430,70) rotate(90)"><use href="#gh-web"/></g>
      <g transform="translate(430,630) rotate(180)"><use href="#gh-web"/></g>
      <g transform="translate(70,630) rotate(270)"><use href="#gh-web"/></g>

      <rect x="8" y="8" width="484" height="684" fill="none" stroke="url(#gh-gold)" stroke-width="3"/>
      <rect x="18" y="18" width="464" height="664" fill="none" stroke="url(#gh-gold)" stroke-width="16"/>
      <rect x="27" y="27" width="446" height="646" fill="none" stroke="#F6E7B2" stroke-width="1.6" stroke-dasharray="1 8" stroke-linecap="round" opacity="0.85"/>
      <rect x="40" y="40" width="420" height="620" fill="none" stroke="url(#gh-gold-soft)" stroke-width="5"/>
      <rect x="48" y="48" width="404" height="604" fill="none" stroke="#6B4E14" stroke-width="1.6" opacity="0.8"/>

      <g transform="translate(14,14)"><use href="#gh-corner"/></g>
      <g transform="translate(486,14) scale(-1,1)"><use href="#gh-corner"/></g>
      <g transform="translate(486,686) scale(-1,-1)"><use href="#gh-corner"/></g>
      <g transform="translate(14,686) scale(1,-1)"><use href="#gh-corner"/></g>

      <g transform="translate(250,16) rotate(180) scale(0.9)"><use href="#gh-shell"/></g>
      <g transform="translate(250,684) scale(0.9)"><use href="#gh-shell"/></g>
      <g transform="translate(10,350) rotate(-90) scale(0.72)"><use href="#gh-shell"/></g>
      <g transform="translate(490,350) rotate(90) scale(0.72)"><use href="#gh-shell"/></g>

      <!--BAKED TYPOGRAPHY (editable as layers in the editor)-->
      <g text-anchor="middle">
        <text x="250" y="231" font-family="'Playfair Display', serif" font-size="15" font-style="italic" fill="#E8CE86" dominant-baseline="central">You are cordially invited to</text>
        <text x="250" y="301" font-family="'Dancing Script', cursive" font-size="40" fill="#F6E7B2" dominant-baseline="central">A Ghastly Gathering</text>
        <text x="250" y="378" font-family="'Cinzel', serif" font-size="24" font-weight="700" letter-spacing="1.5" fill="#C9A227" dominant-baseline="central">HAUNTED HALLOWEEN</text>
        <text x="250" y="448" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#E8CE86" dominant-baseline="central">October 31st at 7 PM</text>
        <text x="250" y="497" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#BDB49A" dominant-baseline="central">1234 Zombie Way</text>
      </g>
    </g>
  </g>
</svg>
