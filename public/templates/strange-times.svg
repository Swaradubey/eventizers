<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="st-mSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12162F"/>
      <stop offset="55%" stop-color="#1D1440"/>
      <stop offset="100%" stop-color="#0A0716"/>
    </linearGradient>
    <pattern id="st-mTrees" width="150" height="300" patternUnits="userSpaceOnUse">
      <rect width="150" height="300" fill="#0A0A18"/>
      <g fill="#05040D">
        <path d="M30,300 C26,220 28,140 32,60 C36,140 40,220 38,300 Z"/>
        <path d="M96,300 C92,240 94,180 98,120 C102,180 106,240 104,300 Z"/>
      </g>
      <g stroke="#05040D" stroke-width="4" fill="none" stroke-linecap="round">
        <path d="M32,140 C16,126 8,110 4,92 M32,140 C48,124 56,108 60,88 M32,100 C20,88 14,74 12,60"/>
        <path d="M98,190 C84,178 76,164 72,146 M98,190 C112,176 120,162 124,142"/>
      </g>
    </pattern>
    <pattern id="st-liner" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#1A1030"/>
      <path d="M0,9 h18 M9,0 v18" stroke="#3E2A6E" stroke-width="2"/>
      <circle cx="9" cy="9" r="2.6" fill="#C13BFF" opacity="0.85"/>
    </pattern>
    <radialGradient id="st-mVig" cx="50%" cy="48%" r="72%">
      <stop offset="50%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.72"/>
    </radialGradient>
    <radialGradient id="st-mMoon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F4F1FF"/>
      <stop offset="72%" stop-color="#DDD8F2"/>
      <stop offset="100%" stop-color="#B9B2DA"/>
    </radialGradient>
    <radialGradient id="st-mStorm" cx="50%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#FF4D6D" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#C13BFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3E7BFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="st-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="st-cardShadow" x="-25%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="st-envShadow" x="-25%" y="-25%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#050310" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- BACKDROP: foggy haunted woods -->
  <rect width="800" height="600" fill="url(#st-mSky)"/>
  <circle cx="640" cy="120" r="150" fill="#CFC9FF" opacity="0.1"/>
  <circle cx="640" cy="120" r="56" fill="url(#st-mMoon)"/>
  <ellipse cx="400" cy="330" rx="300" ry="180" fill="url(#st-mStorm)" opacity="0.6"/>
  <rect y="240" width="800" height="360" fill="url(#st-mTrees)" opacity="0.9"/>
  <path d="M0,470 C120,452 240,486 400,478 C560,470 680,448 800,466 L800,600 L0,600 Z" fill="#05040D"/>
  <ellipse cx="240" cy="512" rx="260" ry="42" fill="#B9C4E8" opacity="0.14"/>
  <ellipse cx="600" cy="546" rx="280" ry="46" fill="#B9C4E8" opacity="0.12"/>
  <rect width="800" height="600" fill="url(#st-mVig)"/>

  <!-- ENVELOPE -->
  <g filter="url(#st-envShadow)">
    <rect x="70" y="180" width="430" height="320" rx="8" fill="#150F2E"/>
    <path d="M70,184 L285,46 L500,184 Z" fill="#0D0920"/>
    <path d="M104,180 L285,78 L466,180 Z" fill="url(#st-liner)"/>
    <path d="M104,180 L285,78 L285,180 Z" fill="#FFFFFF" opacity="0.1"/>
    <path d="M104,180 L285,78 L466,180" fill="none" stroke="#C13BFF" stroke-width="2.4" opacity="0.8"/>
    <path d="M70,184 h430" stroke="#0A0716" stroke-width="3" opacity="0.75"/>
  </g>

  <!-- INVITATION CARD (5x7) -->
  <g filter="url(#st-cardShadow)">
    <rect x="280" y="70" width="330" height="462" rx="6" fill="#0A0716"/>
    <g transform="translate(280,70) scale(0.66)">
      <rect width="500" height="700" fill="url(#st-mSky)"/>
      <g fill="#EDEBFF">
        <circle cx="62" cy="58" r="1.7"/><circle cx="130" cy="34" r="1.2"/><circle cx="196" cy="76" r="1.5"/>
        <circle cx="446" cy="66" r="1.6"/><circle cx="40" cy="140" r="1.3"/><circle cx="470" cy="150" r="1.2"/>
      </g>
      <circle cx="386" cy="112" r="120" fill="#CFC9FF" opacity="0.14"/>
      <circle cx="386" cy="112" r="56" fill="url(#st-mMoon)"/>
      <ellipse cx="250" cy="330" rx="215" ry="165" fill="url(#st-mStorm)"/>

      <!-- haunted house -->
      <g fill="#0A0616">
        <path d="M250,186 L338,252 L338,420 L162,420 L162,252 Z"/>
        <path d="M150,258 L250,180 L350,258 L350,268 L150,268 Z"/>
        <rect x="286" y="196" width="26" height="52" rx="3"/>
        <path d="M282,196 L299,172 L316,196 Z"/>
        <rect x="230" y="356" width="42" height="64" rx="6"/>
      </g>
      <g fill="#FFB347">
        <rect x="210" y="294" width="26" height="38" rx="3"/>
        <rect x="266" y="294" width="26" height="38" rx="3"/>
        <rect x="180" y="298" width="18" height="26" rx="3"/>
        <rect x="304" y="298" width="18" height="26" rx="3"/>
      </g>
      <rect x="236" y="366" width="30" height="54" rx="5" fill="#FF6B6B"/>
      <g stroke="#0A0616" stroke-width="3">
        <path d="M223,294 v38 M210,313 h26 M279,294 v38 M266,313 h26"/>
      </g>

      <!-- trees + ground -->
      <rect y="380" width="500" height="320" fill="url(#st-mTrees)" opacity="0.55"/>
      <path d="M0,466 C90,450 170,482 250,476 C336,470 420,446 500,462 L500,700 L0,700 Z" fill="#05040D"/>
      <ellipse cx="250" cy="530" rx="270" ry="52" fill="#8E9AC8" opacity="0.1"/>

      <!-- BAKED TYPOGRAPHY (editable as layers in the editor) -->
      <g text-anchor="middle">
        <g filter="url(#st-glow)">
          <text x="250" y="546" font-family="'Londrina Solid', 'Arial Black', sans-serif" font-size="74" font-weight="900" fill="#FF2E3F" stroke="#FFD1D6" stroke-width="1.4">LET'S</text>
          <text x="250" y="606" font-family="'Londrina Solid', 'Arial Black', sans-serif" font-size="74" font-weight="900" fill="#FF2E3F" stroke="#FFD1D6" stroke-width="1.4">PARTY</text>
        </g>
        <text x="250" y="640" font-family="'Inter', sans-serif" font-size="13" font-weight="700" letter-spacing="1.6" fill="#EDEBFF" dominant-baseline="central">A STRANGE EVENING AWAITS... IF YOU DARE</text>
        <text x="250" y="664" font-family="'Inter', sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF" dominant-baseline="central">October 31st | 6 PM | 1228 Strange Street</text>
        <text x="250" y="684" font-family="'Inter', sans-serif" font-size="12.5" font-weight="500" fill="#C6C0E6" dominant-baseline="central">Hawkins, Indiana</text>
      </g>
    </g>
  </g>
</svg>
