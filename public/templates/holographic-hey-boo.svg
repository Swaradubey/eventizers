      <rect width="500" height="700" fill="#FEFDFA"/>
      <ellipse cx="46" cy="120" rx="140" ry="150" fill="url(#hb-wash-pink)"/>
      <ellipse cx="470" cy="96" rx="130" ry="140" fill="url(#hb-wash-blue)"/>
      <ellipse cx="34" cy="600" rx="150" ry="150" fill="url(#hb-wash-lav)"/>
      <ellipse cx="474" cy="612" rx="140" ry="150" fill="url(#hb-wash-mint)"/>
      <ellipse cx="250" cy="352" rx="180" ry="150" fill="url(#hb-wash-pink)" opacity="0.35"/>

      <g transform="translate(14,14)"><use href="#hb-web"/></g>
      <g transform="translate(486,686) rotate(180)"><use href="#hb-web"/></g>
      <g transform="translate(486,14) rotate(90)" opacity="0.75"><use href="#hb-web"/></g>

      <g transform="translate(74,96)">
        <path d="M16,-16 a22,22 0 1 0 6,32 a17,17 0 1 1 -6,-32 z" fill="#FDE7A9" stroke="#1A1A1A" stroke-width="2"/>
        <use href="#hb-star" x="34" y="-14" fill="#CDB8F0"/>
        <use href="#hb-star" x="30" y="22" fill="#F9C6D9"/>
        <circle cx="-30" cy="-24" r="3" fill="#BFE0F5"/>
      </g>

      <g transform="translate(424,84)">
        <path d="M-4,4 L14,-44 L30,6 Z" fill="#1A1A1A"/>
        <path d="M-24,10 q26,-12 58,0 q-30,14 -58,0 z" fill="#1A1A1A"/>
        <path d="M2,-14 l16,4 l-3,9 l-16,-4 z" fill="#CDB8F0"/>
        <use href="#hb-spark" x="-38" y="-16" fill="#F9C6D9"/>
        <circle cx="40" cy="26" r="4" fill="#BFEAD9"/>
      </g>

      <g transform="translate(70,224)">
        <path d="M-24,32 L-24,-4 a24,24 0 0 1 48,0 L24,32 l-12,-10 -12,10 -12,-10 -12,10 z" fill="#FDFCFB" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
        <ellipse cx="-8" cy="-4" rx="4.4" ry="6" fill="#1A1A1A"/>
        <ellipse cx="8" cy="-4" rx="4.4" ry="6" fill="#1A1A1A"/>
        <ellipse cx="0" cy="12" rx="6" ry="7" fill="#1A1A1A"/>
        <circle cx="-16" cy="8" r="5" fill="#F9C6D9" opacity="0.9"/>
        <circle cx="16" cy="8" r="5" fill="#F9C6D9" opacity="0.9"/>
      </g>

      <g transform="translate(432,214)">
        <rect x="-3" y="-32" width="7" height="12" rx="3" fill="#7FBF9B"/>
        <ellipse cx="0" cy="0" rx="30" ry="26" fill="#CDB8F0" stroke="#1A1A1A" stroke-width="2.4"/>
        <path d="M-12,-25 q-9,25 0,50 M12,-25 q9,25 0,50 M0,-26 q-4,26 0,52" stroke="#A98FE0" stroke-width="2.2" fill="none"/>
        <path d="M-10,-4 l6,-5 3,5 z M10,-4 l-6,-5 -3,5 z" fill="#1A1A1A"/>
        <path d="M-8,8 q8,8 16,0" stroke="#1A1A1A" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      </g>

      <g transform="translate(74,346)">
        <path d="M-24,-12 L-21,-36 L-5,-23 Z M24,-12 L21,-36 L5,-23 Z" fill="#1A1A1A"/>
        <circle cx="0" cy="4" r="26" fill="#1A1A1A"/>
        <ellipse cx="-9" cy="-1" rx="5.4" ry="7" fill="#FDE7A9"/>
        <ellipse cx="9" cy="-1" rx="5.4" ry="7" fill="#FDE7A9"/>
        <circle cx="-9" cy="-1" r="2" fill="#1A1A1A"/>
        <circle cx="9" cy="-1" r="2" fill="#1A1A1A"/>
        <path d="M-4,13 h8 l-4,5 z" fill="#F9C6D9"/>
        <path d="M-24,10 l-14,-5 M-24,17 l-14,6 M24,10 l14,-5 M24,17 l14,6" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
      </g>

      <g transform="translate(440,332)">
        <path d="M0,-46 v34" stroke="#1A1A1A" stroke-width="1.6"/>
        <ellipse cx="0" cy="0" rx="12" ry="10" fill="#1A1A1A"/>
        <circle cx="-9" cy="-8" r="6" fill="#1A1A1A"/>
        <path d="M-11,-2 l-14,-8 M-11,3 l-15,3 M-9,8 l-12,10 M11,-2 l14,-8 M11,3 l15,3 M9,8 l12,10" stroke="#1A1A1A" stroke-width="2.4" stroke-linecap="round" fill="none"/>
        <circle cx="-4" cy="-2" r="2" fill="#F9C6D9"/>
        <circle cx="4" cy="-2" r="2" fill="#F9C6D9"/>
      </g>

      <g transform="translate(72,474)">
        <rect x="-2.5" y="-24" width="6" height="9" rx="2" fill="#7FBF9B"/>
        <ellipse cx="0" cy="0" rx="22" ry="19" fill="#F9C6D9" stroke="#1A1A1A" stroke-width="2.2"/>
        <path d="M-9,-18 q-7,18 0,36 M9,-18 q7,18 0,36" stroke="#EDAFC6" stroke-width="2" fill="none"/>
        <path d="M-8,-3 l5,-4 2,4 z M8,-3 l-5,-4 -2,4 z" fill="#1A1A1A"/>
        <path d="M-6,6 q6,6 12,0" stroke="#1A1A1A" stroke-width="2" fill="none" stroke-linecap="round"/>
      </g>

      <g transform="translate(434,478)">
        <path d="M-21,28 L-21,-4 a21,21 0 0 1 42,0 L21,28 l-10.5,-9 -10.5,9 -10.5,-9 -10.5,9 z" fill="#EAF6FF" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M-7,-3 q3,-5 6,0 M1,-3 q3,-5 6,0" stroke="#1A1A1A" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <path d="M-5,10 q5,7 10,0" stroke="#1A1A1A" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      </g>

      <g transform="translate(250,626)">
        <path d="M-26,-4 q8,-12 15,-3 q5,-7 11,0 q6,-7 11,0 q7,-9 15,3 q-7,4 -9,12 q-7,-5 -12,-1 q-5,-5 -11,0 q-5,-4 -12,1 q-2,-8 -9,-12 z" fill="#1A1A1A"/>
        <circle cx="-3" cy="0" r="1.8" fill="#FDE7A9"/>
        <circle cx="4" cy="0" r="1.8" fill="#FDE7A9"/>
      </g>

      <use href="#hb-spark" x="132" y="140" fill="#CDB8F0"/>
      <use href="#hb-spark" x="372" y="150" fill="#F9C6D9"/>
      <use href="#hb-spark" x="126" y="566" fill="#BFEAD9"/>
      <use href="#hb-spark" x="382" y="556" fill="#CDB8F0"/>
      <use href="#hb-star" x="150" y="646" fill="#FDE7A9"/>
      <use href="#hb-star" x="352" y="646" fill="#BFE0F5"/>
      <circle cx="196" cy="96" r="3.4" fill="#F9C6D9"/>
      <circle cx="312" cy="86" r="3.4" fill="#BFEAD9"/>
      <circle cx="44" cy="416" r="3.4" fill="#CDB8F0"/>
      <circle cx="456" cy="420" r="3.4" fill="#FDE7A9"/>
      <circle cx="120" cy="300" r="2.6" fill="#BFE0F5"/>
      <circle cx="384" cy="292" r="2.6" fill="#F9C6D9"/>

      <!--BAKED TYPOGRAPHY (editable as layers in the editor)-->
      <g text-anchor="middle">
        <text x="250" y="210" font-family="'Pacifico', cursive" font-size="58" fill="#1A1A1A" dominant-baseline="central">Hey Boo!</text>
        <text x="250" y="434" font-family="'Montserrat', sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#1A1A1A" dominant-baseline="central">COME ON OVER FOR OUR HALLOWEEN PARTY!</text>
        <text x="250" y="504" font-family="'Inter', sans-serif" font-size="12" font-weight="600" letter-spacing="1" fill="#3A3A3A" dominant-baseline="central">SATURDAY, OCTOBER 31 AT 6 PM</text>
        <text x="250" y="553" font-family="'Inter', sans-serif" font-size="12" font-weight="600" letter-spacing="1" fill="#5A5A5A" dominant-baseline="central">3333 PALMERA DRIVE</text>
      </g>
    </g>
  </g>
</svg>
