<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!--Black crushed velvet backdrop-->
    <pattern id="hb-velvet" width="44" height="44" patternUnits="userSpaceOnUse">
      <rect width="44" height="44" fill="#0A0A0C"/>
      <path d="M0,44 L44,0" stroke="#1B1B22" stroke-width="7" opacity="0.65"/>
      <path d="M-12,12 L12,-12 M32,56 L56,32" stroke="#24242D" stroke-width="3.5" opacity="0.55"/>
      <path d="M0,0 L44,44" stroke="#141419" stroke-width="2" opacity="0.7"/>
    </pattern>
    <filter id="hb-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <!--Card artwork washes-->
    <radialGradient id="hb-wash-pink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F9C6D9" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F9C6D9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hb-wash-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#BFE0F5" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#BFE0F5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hb-wash-lav" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#CDB8F0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#CDB8F0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hb-wash-mint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#BFEAD9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#BFEAD9" stop-opacity="0"/>
    </radialGradient>
    <g id="hb-web" fill="none" stroke="#C7C4D8" stroke-width="1.4" stroke-linecap="round">
      <path d="M0,0 L72,0 M0,0 L66,27 M0,0 L51,51 M0,0 L27,66 M0,0 L0,72"/>
      <path d="M24,0 Q13,13 0,24"/>
      <path d="M46,0 Q31,6 42.5,17.6 Q34,24 32.5,32.5 Q24,34 17.6,42.5 Q15,34 0,46"/>
      <path d="M72,0 Q50,7 66,27 Q52,36 51,51 Q36,52 27,66 Q7,50 0,72"/>
    </g>
    <path id="hb-spark" d="M0,-10 Q1.2,-1.2 10,0 Q1.2,1.2 0,10 Q-1.2,1.2 -10,0 Q-1.2,-1.2 0,-10 Z"/>
    <path id="hb-star" d="M0,-9 L2.6,-3 L9,-3 L4,1.4 L5.8,8 L0,4.2 L-5.8,8 L-4,1.4 L-9,-3 L-2.6,-3 Z"/>

    <!--Pastel iridescent envelope liner-->
    <linearGradient id="hb-liner" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F9C6D9"/>
      <stop offset="30%" stop-color="#CDB8F0"/>
      <stop offset="60%" stop-color="#BFE0F5"/>
      <stop offset="100%" stop-color="#BFEAD9"/>
    </linearGradient>

    <filter id="hb-cardShadow" x="-25%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="hb-envShadow" x="-25%" y="-25%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <radialGradient id="hb-backdropVig" cx="50%" cy="48%" r="72%">
      <stop offset="50%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.72"/>
    </radialGradient>
  </defs>

  <!--============================ BACKDROP ============================-->
  <rect width="800" height="600" fill="url(#hb-velvet)"/>
  <g filter="url(#hb-soft)" opacity="0.5">
    <path d="M-40,520 L360,-40 L470,-40 L60,560 Z" fill="#FFFFFF" opacity="0.1"/>
    <path d="M300,640 L820,180 L880,260 L420,660 Z" fill="#FFFFFF" opacity="0.08"/>
    <path d="M-60,240 L220,-60 L280,-20 L-10,300 Z" fill="#8FA0C0" opacity="0.09"/>
  </g>
  <rect width="800" height="600" fill="url(#hb-backdropVig)"/>

  <!--============================ ENVELOPE ============================-->
  <g filter="url(#hb-envShadow)">
    <rect x="90" y="180" width="440" height="322" rx="8" fill="#F6F4F1"/>
    <path d="M90,184 L310,44 L530,184 Z" fill="#EDEBE7"/>
    <path d="M124,180 L310,74 L496,180 Z" fill="url(#hb-liner)"/>
    <path d="M124,180 L310,74 L310,180 Z" fill="#FFFFFF" opacity="0.3"/>
    <path d="M124,180 L310,74 L496,180" fill="none" stroke="#D9D5D0" stroke-width="2.4"/>
    <path d="M90,184 h440" stroke="#D9D5D0" stroke-width="3" opacity="0.8"/>
    <circle cx="310" cy="300" r="46" fill="none" stroke="#E7E3DE" stroke-width="2" opacity="0.7"/>
  </g>

  <!--====================== INVITATION CARD (5x7) ======================-->
  <g filter="url(#hb-cardShadow)">
    <rect x="280" y="70" width="330" height="462" rx="6" fill="#FEFDFA"/>
    <g transform="translate(280,70) scale(0.66)">
