<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="sy-mBackdrop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6E3358"/>
      <stop offset="55%" stop-color="#59264A"/>
      <stop offset="100%" stop-color="#3E1834"/>
    </linearGradient>
    <linearGradient id="sy-mPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15111F"/>
      <stop offset="100%" stop-color="#0B0813"/>
    </linearGradient>
    <linearGradient id="sy-rose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E7A9C4"/>
      <stop offset="100%" stop-color="#C77E9F"/>
    </linearGradient>
    <g id="sy-floral" fill="none" stroke="#8E5679" stroke-width="2.1" stroke-linecap="round" opacity="0.9">
      <path d="M0,40 C0,22 8,10 20,0 C32,10 40,22 40,40 C40,56 32,66 20,72 C8,66 0,56 0,40 Z"/>
      <path d="M20,72 C20,86 20,96 20,104"/>
      <path d="M20,86 C10,82 4,74 2,64"/>
      <path d="M20,86 C30,82 36,74 38,64"/>
      <path d="M20,40 C14,32 14,22 20,14 C26,22 26,32 20,40 Z"/>
      <circle cx="20" cy="40" r="4.4"/>
    </g>
    <pattern id="sy-damask" width="112" height="132" patternUnits="userSpaceOnUse">
      <use href="#sy-floral" transform="translate(36,20)"/>
      <use href="#sy-floral" transform="translate(-20,86) scale(0.7)"/>
      <use href="#sy-floral" transform="translate(92,86) scale(0.7)"/>
    </pattern>
    <pattern id="sy-liner" width="26" height="26" patternUnits="userSpaceOnUse">
      <rect width="26" height="26" fill="#2A1026"/>
      <path d="M0,13 h26 M13,0 v26" stroke="#4B2C46" stroke-width="2.4"/>
      <circle cx="13" cy="13" r="3.4" fill="#C77E9F"/>
    </pattern>
    <radialGradient id="sy-mVig" cx="50%" cy="48%" r="72%">
      <stop offset="50%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.68"/>
    </radialGradient>
    <filter id="sy-cardShadow" x="-25%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#1A0512" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="sy-envShadow" x="-25%" y="-25%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#2A1026" flood-opacity="0.7"/>
    </filter>
    <g id="sy-heart">
      <path d="M0,7 C-3,-2 -12,-3 -12,5 C-12,12 -4,17 0,21 C4,17 12,12 12,5 C12,-3 3,-2 0,7 Z"/>
    </g>
  </defs>

  <!-- BACKDROP: plum floral wallpaper -->
  <rect width="800" height="600" fill="url(#sy-mBackdrop)"/>
  <rect width="800" height="600" fill="url(#sy-damask)" opacity="0.55"/>
  <rect width="800" height="600" fill="url(#sy-mVig)"/>

  <!-- ENVELOPE -->
  <g filter="url(#sy-envShadow)">
    <rect x="70" y="180" width="430" height="320" rx="8" fill="#3E1834"/>
    <path d="M70,184 L285,46 L500,184 Z" fill="#31132B"/>
    <path d="M104,180 L285,78 L466,180 Z" fill="url(#sy-liner)"/>
    <path d="M104,180 L285,78 L285,180 Z" fill="#FFFFFF" opacity="0.1"/>
    <path d="M104,180 L285,78 L466,180" fill="none" stroke="#E7A9C4" stroke-width="2.4" opacity="0.85"/>
    <path d="M70,184 h430" stroke="#2A1026" stroke-width="3" opacity="0.75"/>
  </g>

  <!-- INVITATION CARD (5x7) -->
  <g filter="url(#sy-cardShadow)">
    <rect x="280" y="70" width="330" height="462" rx="6" fill="#0B0813"/>
    <g transform="translate(280,70) scale(0.66)">
      <rect width="500" height="700" fill="url(#sy-mPanel)"/>
      <rect width="500" height="700" fill="url(#sy-damask)" opacity="0.18"/>
      <rect x="46" y="46" width="408" height="608" rx="6" fill="none" stroke="#4B2C46" stroke-width="1.6"/>
      <rect x="53" y="53" width="394" height="594" rx="4" fill="none" stroke="#4B2C46" stroke-width="0.9" stroke-dasharray="3 7"/>

      <!-- moon + stars -->
      <path d="M108,116 A26,26 0 1 0 138,146 A21,21 0 1 1 108,116 Z" fill="url(#sy-rose)" opacity="0.9"/>
      <g fill="#E7A9C4">
        <path d="M400,104 l3,7 l7,3 l-7,3 l-3,7 l-3,-7 l-7,-3 l7,-3 z" opacity="0.9"/>
        <path d="M362,168 l2,5 l5,2 l-5,2 l-2,5 l-2,-5 l-5,-2 l5,-2 z" opacity="0.7"/>
        <circle cx="178" cy="140" r="2" opacity="0.7"/>
      </g>

      <!-- foliage -->
      <g fill="none" stroke="#EDE6F2" stroke-width="2" stroke-linecap="round" opacity="0.75">
        <path d="M78,646 C70,570 84,510 74,452 C66,404 84,362 78,320"/>
        <path d="M74,540 C60,532 52,518 50,502 M74,540 C88,534 96,520 98,504"/>
        <path d="M422,646 C430,574 416,512 426,456 C434,410 416,368 422,330"/>
        <path d="M426,548 C440,540 448,526 450,510 M426,548 C412,542 404,528 402,512"/>
      </g>

      <!-- Sally + cat (simplified) -->
      <g transform="translate(250,486) scale(0.92)" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-46,6 C-56,54 -60,92 -54,124 L54,124 C60,92 56,54 46,6 Z" fill="#2C1A3A" stroke="url(#sy-rose)" stroke-width="2.6"/>
        <path d="M0,6 C-6,34 -6,66 0,120" fill="none" stroke="#E7A9C4" stroke-width="1.6" stroke-dasharray="6 5"/>
        <path d="M-46,16 C-70,44 -78,74 -72,104 M46,16 C70,44 78,74 72,104" fill="none" stroke="url(#sy-rose)" stroke-width="8"/>
        <path d="M-26,124 C-30,158 -30,182 -26,206 M26,124 C30,158 30,182 26,206" fill="none" stroke="url(#sy-rose)" stroke-width="9"/>
        <circle cx="0" cy="-34" r="42" fill="#F6EDE4" stroke="#E7A9C4" stroke-width="2.6"/>
        <path d="M-42,-38 C-46,-84 -18,-104 0,-104 C18,-104 46,-84 42,-38 C36,-58 24,-70 0,-72 C-24,-70 -36,-58 -42,-38 Z" fill="#B7223A" stroke="#E7A9C4" stroke-width="2"/>
        <path d="M-42,-38 C-52,-14 -52,10 -44,30 C-50,4 -50,-20 -44,-40 Z" fill="#B7223A"/>
        <path d="M42,-38 C52,-14 52,10 44,30 C50,4 50,-20 44,-40 Z" fill="#B7223A"/>
        <g fill="#2C1A3A">
          <circle cx="-15" cy="-40" r="5.4"/>
          <circle cx="15" cy="-40" r="5.4"/>
          <path d="M-12,-18 C-6,-12 6,-12 12,-18" fill="none" stroke="#2C1A3A" stroke-width="2.6"/>
        </g>
        <path d="M-34,-24 l-10,4 M-33,-18 l-10,4 M-32,-12 l-10,4" stroke="#B3607F" stroke-width="1.8"/>
        <path d="M34,-24 l10,4 M33,-18 l10,4 M32,-12 l10,4" stroke="#B3607F" stroke-width="1.8"/>
      </g>
      <g transform="translate(374,572) scale(0.78)">
        <path d="M0,86 C-30,86 -44,64 -44,40 C-44,18 -32,4 -14,-4 L-24,-34 L-4,-18 C4,-20 12,-20 20,-16 L38,-34 L32,-2 C46,10 52,28 50,46 C48,68 30,86 0,86 Z"
              fill="#0C0910" stroke="#E7A9C4" stroke-width="2.4"/>
        <path d="M46,74 C74,78 88,58 82,36 C78,22 66,18 60,26 C68,26 72,36 68,46 C64,58 56,66 44,66"
              fill="#0C0910" stroke="#E7A9C4" stroke-width="2.4"/>
        <g fill="#F2E27A"><ellipse cx="-14" cy="26" rx="7" ry="8"/><ellipse cx="14" cy="26" rx="7" ry="8"/></g>
        <g fill="#14100F"><ellipse cx="-14" cy="26" rx="2.2" ry="7"/><ellipse cx="14" cy="26" rx="2.2" ry="7"/></g>
        <path d="M0,40 l-5,-6 h10 z" fill="#E7A9C4"/>
      </g>
      <g fill="url(#sy-rose)" opacity="0.9">
        <g transform="translate(150,316) scale(1.1)"><use href="#sy-heart"/></g>
        <g transform="translate(360,286) scale(0.8)"><use href="#sy-heart"/></g>
      </g>

      <!-- BAKED TYPOGRAPHY (editable as layers in the editor) -->
      <g text-anchor="middle">
        <text x="250" y="146" font-family="'Dancing Script', cursive" font-size="40" font-weight="600" fill="#F4E6F0">A splendid</text>
        <text x="250" y="192" font-family="'Dancing Script', cursive" font-size="40" font-weight="600" fill="#F4E6F0">nightmare awaits</text>
        <text x="250" y="240" font-family="'Inter', sans-serif" font-size="12" font-weight="600" letter-spacing="1.4" fill="#D9CDE4">JOIN US FOR A FRIGHTFULLY</text>
        <text x="250" y="258" font-family="'Inter', sans-serif" font-size="12" font-weight="600" letter-spacing="1.4" fill="#D9CDE4">CHILLING TIME AT SIX</text>
        <text x="250" y="300" font-family="'Dancing Script', cursive" font-size="34" font-weight="600" fill="#E7A9C4">Halloween</text>
        <text x="250" y="336" font-family="'Dancing Script', cursive" font-size="34" font-weight="600" fill="#E7A9C4">celebration</text>
        <text x="250" y="376" font-family="'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="1.3" fill="#F4E6F0">SATURDAY</text>
        <text x="250" y="394" font-family="'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="1.3" fill="#F4E6F0">OCTOBER 31ST</text>
        <text x="250" y="412" font-family="'Inter', sans-serif" font-size="12" font-weight="600" letter-spacing="1.3" fill="#D9CDE4">AT 7PM</text>
        <text x="250" y="440" font-family="'Inter', sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.4" fill="#E7A9C4">THE PLACE</text>
        <text x="250" y="458" font-family="'Inter', sans-serif" font-size="11.5" font-weight="500" letter-spacing="1.2" fill="#D9CDE4">84 EVERLOCK DR.</text>
      </g>
    </g>
  </g>
</svg>
