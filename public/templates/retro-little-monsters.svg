<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <path id="rmm-dia" d="M0,-15 L11,0 L0,15 L-11,0 Z"/>
    <path id="rmm-dia-sm" d="M0,-8 L6,0 L0,8 L-6,0 Z"/>
    <path id="rmm-spark" d="M0,-9 Q1,-1 9,0 Q1,1 0,9 Q-1,1 -9,0 Q-1,-1 0,-9 Z"/>

    <pattern id="rmm-grain" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="7" r="0.8" fill="#D8CEB4" opacity="0.5"/>
      <circle cx="18" cy="16" r="0.7" fill="#D8CEB4" opacity="0.4"/>
      <circle cx="12" cy="22" r="0.6" fill="#E0D7C0" opacity="0.5"/>
    </pattern>

    <!--Lilac linen backdrop-->
    <pattern id="rmm-linen" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#C7B8E6"/>
      <path d="M0,0 h8 M0,4 h8" stroke="#BFACE1" stroke-width="1.4"/>
      <path d="M0,0 v8 M4,0 v8" stroke="#D0C4EC" stroke-width="1"/>
    </pattern>

    <!--Black &amp; white checkerboard envelope liner-->
    <pattern id="rmm-checker" width="26" height="26" patternUnits="userSpaceOnUse">
      <rect width="26" height="26" fill="#FDFCF7"/>
      <rect width="13" height="13" fill="#1C1A19"/>
      <rect x="13" y="13" width="13" height="13" fill="#1C1A19"/>
    </pattern>

    <filter id="rmm-cardShadow" x="-25%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.38"/>
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    <filter id="rmm-envShadow" x="-25%" y="-25%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#3B2E52" flood-opacity="0.45"/>
    </filter>
    <radialGradient id="rmm-backdropVig" cx="50%" cy="48%" r="70%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#2A1E45" stop-opacity="0.5"/>
    </radialGradient>
  </defs>

  <!--============================ BACKDROP ============================-->
  <rect width="800" height="600" fill="url(#rmm-linen)"/>
  <rect width="800" height="600" fill="url(#rmm-backdropVig)"/>

  <!--============================ ENVELOPE ============================-->
  <g filter="url(#rmm-envShadow)">
    <rect x="90" y="180" width="440" height="322" rx="8" fill="#A9DCC6"/>
    <path d="M90,184 L310,44 L530,184 Z" fill="#9AD2BA"/>
    <path d="M124,180 L310,74 L496,180 Z" fill="url(#rmm-checker)"/>
    <path d="M124,180 L310,74 L310,180 Z" fill="#FFFFFF" opacity="0.12"/>
